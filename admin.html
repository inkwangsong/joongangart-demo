/* \uC67C\uCABD \uBA54\uB274 \uC0C9 \u2014 CI \uBE14\uB8E8. \uACE0\uAC1D \uC0AC\uC774\uD2B8 \uB9E8 \uC704 \uC11C\uBE44\uC2A4 \uD0ED\uACFC \uAC19\uC740 \uC0C9\uC73C\uB85C \uBE0C\uB79C\uB4DC\uB97C \uC787\uACE0,
   \uC120\uD0DD\uD55C \uBA54\uB274\uB294 \uD770\uC0C9\uC744 \uC5B9\uC5B4 \uAD6C\uBD84\uD569\uB2C8\uB2E4(\uD30C\uB780 \uBC14\uD0D5 \uC704 \uD30C\uB780 \uC120\uD0DD\uC740 \uBCF4\uC774\uC9C0 \uC54A\uC73C\uBBC0\uB85C) */
.ad-side{--side-bg:#203BA1;--side-tx:#D5DCF5;--side-mute:#A4B1E3;--side-av:#3450B8;--side-on:rgba(255,255,255,.18);}
.ad-side{width:224px;flex-shrink:0;background:var(--side-bg);color:#fff;display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;}
.ad-brand{padding:var(--s4);border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;}
.ad-brand b{font-size:14px;font-weight:600;display:block;letter-spacing:-.3px;}
.ad-brand span{font-size:11px;color:var(--side-mute);letter-spacing:1px;}
/* \uB85C\uACE0\uB294 \uACE0\uAC1D \uC0AC\uC774\uD2B8\uC640 \uAC19\uACE0, \uC774\uB984 \uC606 \uC791\uC740 \uD45C\uC2DC\uB85C \uAD00\uB9AC\uC790 \uD654\uBA74\uC784\uC744 \uAD6C\uBD84\uD569\uB2C8\uB2E4 */
.adm-tag{display:inline-block;vertical-align:2px;margin-left:4px;padding:2px 7px;border-radius:999px;
  background:#C7F04A;color:#12292D;font-size:11px;font-weight:700;font-style:normal;letter-spacing:0;line-height:1.4;}
.ad-nav{padding:var(--s3) var(--s2);flex:1;overflow-y:auto;}
.ad-grp{font-size:11px;color:var(--side-mute);letter-spacing:.8px;padding:12px 12px 6px;}
.ad-nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;
  color:var(--side-tx);font-size:13px;padding:10px 12px;border-radius:var(--r1);text-align:left;
  transition:background .15s,color .15s;}
.ad-nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.ad-nav button[data-on="1"]{background:var(--side-on);color:#fff;font-weight:600;}
.ad-nav em{margin-left:auto;font-style:normal;font-size:11px;background:rgba(255,255,255,.14);
  padding:2px 8px;border-radius:var(--pill);}
.ad-me{padding:var(--s3) var(--s4);border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;}
.ad-me i{width:30px;height:30px;border-radius:50%;background:var(--side-av);display:flex;
  align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#C6C6CE;}
.ad-me b{font-size:12px;font-weight:500;display:block;}
.ad-me span{font-size:11px;color:var(--side-mute);}

/* \u2500\u2500 main \u2500\u2500 */
.ad-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.ad-top{background:#fff;border-bottom:1px solid var(--ln);height:60px;display:flex;
  align-items:center;justify-content:space-between;padding:0 var(--s5);position:sticky;top:0;z-index:20;}
.ad-crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx3);}
.ad-crumb b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:-.4px;}
.ad-topr{display:flex;align-items:center;gap:var(--s3);}
.ad-srch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);
  padding:8px 14px;border-radius:var(--pill);}
/* \uD14C\uB450\uB9AC \uC548\uCABD \uC804\uCCB4\uAC00 \uB20C\uB824\uC57C \uD569\uB2C8\uB2E4. \uAE00\uC790 \uB192\uC774\uB9CC \uACFC\uB141\uC774\uBA74 \uC606\uC744 \uB20C\uB7EC\uB3C4 \uCEE4\uC11C\uAC00 \uC548 \uB4E4\uC5B4\uC635\uB2C8\uB2E4 */
.ad-srch{padding:0 14px;height:38px;}
.ad-srch input{border:none;background:none;outline:none;font-size:13px;width:170px;
  align-self:stretch;}
.ad-ico{background:none;border:1px solid var(--ln);width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--tx2);position:relative;}
.ad-ico:hover{border-color:var(--pt);color:var(--pt);}
.ad-body{padding:var(--s5);flex:1;}

/* \u2500\u2500 buttons \u2500\u2500 */
.ad-bt{border:1px solid var(--ln);background:#fff;color:var(--tx);font-size:13px;
  padding:9px 17px;border-radius:var(--pill);display:inline-flex;align-items:center;gap:7px;
  transition:all .15s;}
.ad-bt:hover{border-color:var(--pt);color:var(--pt);}
.ad-bt-p{background:var(--pt);border-color:var(--pt);color:#fff;font-weight:600;}
.ad-bt-p:hover{background:var(--pt2);border-color:var(--pt2);color:#fff;}
.ad-bt-p:disabled{background:#C6C6C6;border-color:#C6C6C6;color:#fff;cursor:default;}
.ad-bt-d{color:var(--rd);border-color:rgba(214,43,36,.3);}
.ad-bt-d:hover{background:#FEF5F4;border-color:var(--rd);color:var(--rd);}
.ad-bt-d:disabled{color:#C6C6C6;border-color:var(--ln);cursor:default;background:none;}
.ad-bt-sm{padding:6px 13px;font-size:12px;white-space:nowrap;}

/* \uD45C\uC758 \uAD00\uB9AC \uCE7C\uB7FC \u2014 \uBC84\uD2BC \uC0AC\uC774\uB97C \uACF5\uBC31 \uBB38\uC790\uB85C\uB9CC \uB744\uC6B0\uBA74 \uAC04\uACA9\uC774 3~5px\uBC16\uC5D0 \uB0A8\uC9C0 \uC54A\uACE0
   \uCE7C\uB7FC\uC774 \uC881\uC73C\uBA74 \uC904\uBC14\uAFC8\uB418\uC5B4 \uB450 \uBC84\uD2BC\uC774 \uD55C \uB369\uC5B4\uB9AC\uB85C \uBCF4\uC785\uB2C8\uB2E4. \uAC04\uACA9\uC744 \uBA85\uC2DC\uD569\uB2C8\uB2E4. */
.ad-acts{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
.ad-acts .ad-bt{flex-shrink:0;}
/* \uB418\uB3CC\uB9B4 \uC218 \uC5C6\uB294 \uC791\uC5C5\uC740 \uC606 \uBC84\uD2BC\uACFC \uB354 \uB5BC\uC5B4 \uC624\uD074\uB9AD\uC744 \uC904\uC785\uB2C8\uB2E4 */
.ad-acts-risk{gap:16px;}

/* \u2500\u2500 cards / panels \u2500\u2500 */
.ad-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s5);}
.ad-card{background:#fff;border:1px solid var(--ln);border-radius:var(--r2);padding:var(--s4);}
.ad-card b{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.8px;}
.ad-card em{font-style:normal;font-size:12px;margin-left:7px;color:var(--ok);}
.ad-card em[data-d="1"]{color:var(--rd);}

.ad-panel{background:#fff;border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;
  margin-bottom:var(--s3);}
.ad-ph{padding:var(--s4);border-bottom:1px solid var(--ln);display:flex;
  align-items:center;justify-content:space-between;gap:var(--s3);}
.ad-ph b{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.ad-ph span{font-size:12px;color:var(--tx3);display:block;margin-top:2px;font-weight:400;}
.ad-pb{padding:var(--s4);}

/* \u2500\u2500 table \u2500\u2500 */
.ad-tbl{width:100%;border-collapse:collapse;}
.ad-tbl th{background:#FAFAFA;border-bottom:1px solid var(--ln);padding:11px 14px;
  font-size:12px;color:var(--tx2);font-weight:500;text-align:left;white-space:nowrap;}
.ad-tbl td{border-bottom:1px solid var(--ln2);padding:13px 14px;font-size:13px;vertical-align:middle;}
.ad-tbl tr:hover td{background:#FCFCFD;}
.ad-tbl .c{text-align:center;} .ad-tbl .r{text-align:right;}
.ad-code{font-size:11px;color:var(--tx3);}
.ad-tt{font-weight:600;color:var(--ink);}
.ad-tsub{font-size:11px;color:var(--tx3);margin-top:2px;}
.ad-st{font-size:11px;padding:4px 11px;border-radius:var(--pill);display:inline-block;font-weight:500;}
.ad-st[data-s="\uD310\uB9E4\uC911"]{background:#EAF6EF;color:#1E7A4A;}
.ad-st[data-s="\uC228\uAE40"]{background:#F1F1F3;color:var(--tx2);}
.ad-st[data-s="\uC791\uC131\uC911"]{background:#FDF4E7;color:#B5761A;}
.ad-st[data-s="\uACB0\uC81C\uC644\uB8CC"]{background:#EAF6EF;color:#1E7A4A;}
.ad-st[data-s="\uD658\uBD88"]{background:var(--red-tint);color:var(--rd);}

/* \u2500\u2500 form \u2500\u2500 */
.ad-sect{background:#fff;border:1px solid var(--ln);border-radius:var(--r2);margin-bottom:var(--s3);}
.ad-sh{padding:var(--s3) var(--s4);border-bottom:1px solid var(--ln2);display:flex;
  align-items:center;gap:10px;}
.ad-sh i{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--pt);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;
  font-weight:700;flex-shrink:0;}
.ad-sh b{font-size:14px;font-weight:700;}
.ad-sh span{font-size:12px;color:var(--tx3);margin-left:auto;}
.ad-sb{padding:var(--s4);}
.ad-row{display:grid;grid-template-columns:112px 1fr;gap:var(--s3);align-items:start;padding:9px 0;}
.ad-lb{font-size:13px;color:var(--tx2);padding-top:10px;}
.ad-lb em{font-style:normal;color:var(--rd);margin-left:3px;}
.ad-in{width:100%;border:1px solid var(--ln);border-radius:var(--r1);padding:10px 13px;
  font-size:13px;color:var(--ink);background:#fff;transition:border-color .15s;}
.ad-in:focus{outline:none;border-color:var(--pt);}
.ad-in::placeholder{color:#B8B8B8;}
textarea.ad-in{resize:vertical;min-height:80px;line-height:1.8;}
.ad-hint{font-size:12px;color:var(--tx3);margin-top:7px;line-height:1.7;}
.ad-hint b{color:var(--tx);}
.ad-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);}
.ad-seg{display:flex;gap:5px;flex-wrap:wrap;}
.ad-seg button{border:1px solid var(--ln);background:#fff;font-size:12px;color:var(--tx2);
  padding:8px 15px;border-radius:var(--pill);transition:all .15s;}
.ad-seg button:hover{border-color:var(--pt);color:var(--pt);}
.ad-seg button[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;}
.ad-money{position:relative;}
.ad-money input{padding-right:36px;text-align:right;}
.ad-money span{position:absolute;right:13px;top:10px;font-size:13px;color:var(--tx3);}

/* \u2500\u2500 upload \u2500\u2500 */
.ad-drop{border:1.5px dashed var(--ln);border-radius:var(--r2);padding:var(--s6) var(--s4);
  text-align:center;background:#FCFCFD;transition:all .18s;}
.ad-drop[data-over="1"]{border-color:var(--pt);background:var(--tint);}
.ad-drop i{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--pt);
  display:flex;align-items:center;justify-content:center;margin:0 auto var(--s3);font-style:normal;}
.ad-drop b{display:block;font-size:14px;font-weight:700;margin-bottom:5px;}
.ad-drop span{display:block;font-size:12px;color:var(--tx3);line-height:1.8;}
.ad-drop button{margin-top:var(--s3);}
.ad-file{border:1px solid var(--ln);border-radius:var(--r2);padding:var(--s3) var(--s4);
  display:flex;align-items:center;gap:var(--s3);background:#FCFCFD;}
.ad-file>i{width:38px;height:46px;border:1px solid var(--ln);border-radius:var(--r1);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--rd);font-style:normal;
  font-size:11px;font-weight:700;flex-shrink:0;}
.ad-file b{display:block;font-size:13px;font-weight:600;margin-bottom:3px;}
.ad-file span{font-size:11px;color:var(--tx3);}
.ad-file-a{margin-left:auto;display:flex;gap:6px;}
.ad-pages{display:flex;gap:7px;flex-wrap:wrap;margin-top:var(--s3);}
.ad-pages button{width:40px;height:50px;border:1px solid var(--ln);border-radius:var(--r1);
  background:#fff;font-size:12px;color:var(--tx3);display:flex;align-items:center;
  justify-content:center;position:relative;transition:all .15s;}
.ad-pages button[data-on="1"]{border-color:var(--pt);color:var(--pt);background:var(--tint);font-weight:700;}
.ad-pages button[data-on="1"]::after{content:'\uACF5\uAC1C';position:absolute;bottom:-9px;left:50%;
  transform:translateX(-50%);font-size:11px;background:var(--pt);color:#fff;padding:1px 6px;
  border-radius:var(--pill);white-space:nowrap;}

.ad-checks{border:1px solid var(--ln);border-radius:var(--r2);padding:var(--s3) var(--s4);
  margin-top:var(--s3);background:#FCFCFD;}
.ad-checks-h{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid var(--ln2);margin-bottom:6px;}
.ad-checks-h b{font-size:13px;font-weight:700;}
.ad-checks-h span{font-size:12px;color:var(--tx3);}
.ad-chk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px;}
.ad-chk i{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-style:normal;background:#EAF6EF;color:var(--ok);}
.ad-chk[data-ok="0"] i{background:#FDF4E7;color:var(--warn);}
.ad-chk b{font-weight:500;color:var(--tx);min-width:110px;}
.ad-chk span{color:var(--tx3);}
.ad-chk[data-ok="0"] span{color:var(--warn);}
.ad-chk-msg{font-size:12px;color:var(--warn);background:#FFFCF5;border-radius:var(--r1);
  padding:10px 12px;margin:8px 0 0;line-height:1.75;}

/* \u2500\u2500 \uB9AC\uC2A4\uD2B8 \uD3B8\uC9D1 (FAQ \uB4F1) \u2500\u2500 */
.ad-item{border:1px solid var(--ln);border-radius:var(--r2);margin-bottom:var(--s2);background:#FCFCFD;}
.ad-item-h{display:flex;align-items:center;gap:9px;padding:11px 13px;}
.ad-item-h svg{color:var(--tx3);cursor:grab;flex-shrink:0;}
.ad-item-h input{flex:1;min-width:0;border:none;background:none;outline:none;
  font-size:13px;font-weight:600;padding:7px 0;}
/* \uC0AD\uC81C\uB294 \uB418\uB3CC\uB9AC\uAE30 \uC5B4\uB835\uC2B5\uB2C8\uB2E4. \uACFC\uB141\uC774 \uC791\uC73C\uBA74 \uC606\uC744 \uB204\uB974\uB824\uB2E4 \uB20C\uB9BD\uB2C8\uB2E4 */
.ad-item-h button{background:none;border:none;color:var(--tx3);display:flex;padding:8px;
  border-radius:50%;flex-shrink:0;}
.ad-item-h button:hover{color:var(--rd);background:#FEF5F4;}
.ad-item textarea{width:100%;border:none;border-top:1px solid var(--ln2);background:none;
  outline:none;padding:11px 13px;font-size:12px;color:var(--tx2);resize:vertical;min-height:54px;
  line-height:1.8;}
.ad-add{width:100%;border:1px dashed var(--ln);background:none;color:var(--tx2);font-size:13px;
  padding:12px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;gap:6px;}
.ad-add:hover{border-color:var(--pt);color:var(--pt);}

/* \u2500\u2500 \uD648 \uD3B8\uC131 \u2500\u2500 */
.ad-home{display:grid;grid-template-columns:1fr 358px;gap:var(--s4);align-items:start;}
.ad-blocks{display:flex;flex-direction:column;gap:var(--s2);}
.ad-blk{background:#fff;border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;
  transition:border-color .16s;}
.ad-blk[data-off="1"]{background:#FAFAFA;}
.ad-blk[data-open="1"]{border-color:var(--pt);}
.ad-blk-h{display:flex;align-items:center;gap:var(--s3);padding:14px 16px;}
.ad-blk-h>svg:first-child{color:var(--tx3);cursor:grab;flex-shrink:0;}
.ad-blk-n{flex:1;min-width:0;}
.ad-blk-n b{display:block;font-size:14px;font-weight:700;letter-spacing:-.3px;}
.ad-blk[data-off="1"] .ad-blk-n b{color:var(--tx3);}
.ad-blk-n span{font-size:12px;color:var(--tx3);}
.ad-blk-a{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ad-tog{width:44px;height:24px;border-radius:var(--pill);background:#D8D8D8;border:none;
  position:relative;transition:background .18s;flex-shrink:0;}
.ad-tog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:transform .18s;}
.ad-tog[data-on="1"]{background:var(--pt);}
.ad-tog[data-on="1"]::after{transform:translateX(20px);}
.ad-blk-x{background:none;border:1px solid var(--ln);border-radius:50%;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;color:var(--tx2);}
.ad-blk-x:hover{border-color:var(--pt);color:var(--pt);}
.ad-blk-b{border-top:1px solid var(--ln2);padding:var(--s4);background:#FCFCFD;}
.ad-fixed{font-size:11px;color:var(--tx3);background:var(--ln2);padding:3px 9px;
  border-radius:var(--pill);white-space:nowrap;}

/* \uB178\uCD9C \uACE1 \uC120\uD0DD */
.ad-picks{display:flex;flex-direction:column;gap:6px;}
.ad-pick{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:var(--r1);
  padding:9px 12px;background:#fff;font-size:13px;}
.ad-pick svg{color:var(--tx3);cursor:grab;flex-shrink:0;}
.ad-pick b{font-weight:600;}
.ad-pick span{color:var(--tx3);font-size:11px;}
.ad-pick button{margin-left:auto;background:none;border:none;color:var(--tx3);display:flex;
  padding:8px;margin-right:-5px;border-radius:50%;flex-shrink:0;}
.ad-pick button:hover{color:var(--pt);background:var(--tint);}
.ad-pick button:hover{color:var(--rd);}

/* \uC808\uAE30 \uD45C */

/* \uBBF8\uB9AC\uBCF4\uAE30 */
.ad-pv{position:sticky;top:calc(60px + var(--s5));}
.ad-pv-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s2);}
.ad-pv-h b{font-size:12px;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:6px;}
.ad-pv-h span{font-size:11px;color:var(--tx3);}
.ad-pv-frame{background:#fff;border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;}
.ad-pv-bar{background:#F1F1F3;padding:8px 12px;display:flex;align-items:center;gap:6px;
  border-bottom:1px solid var(--ln);}
.ad-pv-bar i{width:8px;height:8px;border-radius:50%;background:#D2D2D7;font-style:normal;}
.ad-pv-bar span{margin-left:8px;font-size:11px;color:var(--tx3);background:#fff;
  padding:3px 11px;border-radius:var(--pill);}
.ad-pv-body{padding:var(--s3);max-height:620px;overflow-y:auto;background:#fff;}
.ad-mini{border-radius:var(--r1);margin-bottom:8px;padding:12px 13px;font-size:11px;
  border:1px solid var(--ln2);}
.ad-mini b{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px;
  letter-spacing:-.3px;}
.ad-mini span{color:var(--tx3);line-height:1.65;display:block;}
.ad-mini[data-k="hero"]{background:#F5F5F7;padding:16px 14px;}
.ad-mini[data-k="up"]{background:var(--pt);border-color:var(--pt);}
.ad-mini[data-k="up"] b,.ad-mini[data-k="up"] span{color:#fff;}
.ad-mini[data-k="up"] span{color:#C9D2EE;}
.ad-mini[data-k="proof"]{background:#F5F5F7;}
.ad-mini-row{display:flex;gap:6px;margin-top:8px;}
.ad-mini-row i{flex:1;height:38px;background:#E8E8EA;border-radius:5px;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx3);}
.ad-mini-chips{display:flex;gap:5px;margin-top:8px;}
.ad-mini-chips i{font-style:normal;background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:4px 9px;font-size:11px;color:var(--tx2);}

/* \u2500\u2500 \uC815\uCC45 \uD3B8\uC9D1 \u2500\u2500 */
.ad-pol{display:grid;grid-template-columns:180px 1fr;gap:var(--s4);align-items:start;}
.ad-poltabs{display:flex;flex-direction:column;gap:4px;}
.ad-poltabs button{text-align:left;background:none;border:none;padding:11px 14px;font-size:13px;
  color:var(--tx2);border-radius:var(--r1);}
.ad-poltabs button:hover{background:#fff;}
.ad-poltabs button[data-on="1"]{background:var(--pt);color:#fff;font-weight:600;}

/* \u2500\u2500 misc \u2500\u2500 */
.ad-tabs{display:flex;gap:var(--s4);border-bottom:1px solid var(--ln);margin-bottom:var(--s4);}
.ad-tabs button{background:none;border:none;padding:0 0 12px;font-size:14px;color:var(--tx2);
  border-bottom:2px solid transparent;margin-bottom:-1px;}
.ad-tabs button[data-on="1"]{color:var(--pt);font-weight:700;border-bottom-color:var(--pt);}
.ad-note{display:flex;gap:9px;background:var(--tint);border-radius:var(--r2);
  padding:13px 15px;font-size:12px;color:var(--tx2);line-height:1.8;margin-bottom:var(--s3);}
.ad-note svg{color:var(--pt);flex-shrink:0;margin-top:2px;}
.ad-note b{color:var(--ink);}
.ad-empty{padding:var(--s6);text-align:center;color:var(--tx3);font-size:13px;line-height:1.9;}
.ad-empty b{display:block;color:var(--tx);font-size:14px;margin-bottom:6px;}

/* \u2500\u2500 \uD558\uB2E8 \uC800\uC7A5 \uBC14 \u2500\u2500 */
.ad-save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--ln);
  padding:var(--s3) var(--s5);display:flex;align-items:center;justify-content:space-between;
  gap:var(--s3);margin:var(--s4) calc(var(--s5) * -1) calc(var(--s5) * -1);z-index:15;}
.ad-save-l{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tx2);}
.ad-save-l svg{color:var(--warn);flex-shrink:0;}
.ad-save-r{display:flex;gap:var(--s2);}

@media (max-width:1240px){
  .ad-home{grid-template-columns:1fr;}
  .ad-pv{position:static;}
  .ad-cards{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:860px){
  /* \uC608\uC804\uC5D0\uB294 \uC5EC\uAE30\uC11C .ad-side\uB97C \uD1B5\uC9F8\uB85C \uC228\uACBC\uC2B5\uB2C8\uB2E4. \uBA54\uB274\uAC00 \uC0AC\uB77C\uC838
     \uC881\uC740 \uD654\uBA74\uC5D0\uC11C\uB294 \uB2E4\uB978 \uBA54\uB274\uB85C \uAC08 \uBC29\uBC95\uC774 \uC544\uC608 \uC5C6\uC5C8\uC2B5\uB2C8\uB2E4.
     \uC544\uB798 900px \uBE14\uB85D\uC5D0\uC11C \uC0C1\uB2E8 \uAC00\uB85C \uB760\uB85C \uBC14\uAFC9\uB2C8\uB2E4. */
  .ad-row,.ad-pol{grid-template-columns:1fr;}
  .ad-lb{padding-top:0;}
}
/* \u2500\u2500 \uC218\uC815 \uBAA8\uB4DC \u2500\u2500 */
.ad-live{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  background:#fff;border:1px solid var(--ln);border-radius:var(--r2);padding:var(--s3) var(--s4);
  margin-bottom:var(--s3);flex-wrap:wrap;}
.ad-live-l{display:flex;align-items:center;gap:var(--s3);}
.ad-live-l b{display:block;font-size:15px;font-weight:700;letter-spacing:-.4px;margin-bottom:2px;}
.ad-live-l em{font-style:normal;font-size:12px;color:var(--tx3);}
.ad-live-r{display:flex;gap:6px;flex-wrap:wrap;}
.ad-repl{border:1px solid var(--warn);background:#FFFCF5;border-radius:var(--r2);
  padding:var(--s3) var(--s4);margin-top:var(--s3);}
.ad-repl>b{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--warn);
  margin-bottom:8px;}
.ad-repl p{font-size:12px;color:var(--tx2);line-height:1.85;margin:0 0 var(--s3);}
.ad-repl p b{color:var(--tx);}
.ad-check{display:flex;align-items:center;gap:9px;background:none;border:none;padding:8px 0;
  font-size:12px;color:var(--tx2);font-family:inherit;text-align:left;}
.ad-check i{width:17px;height:17px;border:1px solid var(--ln);border-radius:4px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-style:normal;}
.ad-check[data-on="1"] i{background:var(--pt);border-color:var(--pt);}
.ad-repl-a{display:flex;gap:6px;justify-content:flex-end;margin-top:var(--s2);}

/* \u2500\u2500 \uB300\uC2DC\uBCF4\uB4DC \uAE30\uAC04 \uD45C\uC2DC \u2500\u2500 */
.ad-dashbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  margin-bottom:var(--s3);flex-wrap:wrap;}
.ad-dash-t b{display:block;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.3px;}
.ad-dash-t span{font-size:12px;color:var(--tx3);}
.ad-card-n{font-size:12px;color:var(--tx2);display:block;margin-bottom:2px;font-weight:500;}
.ad-card-p{font-size:11px;color:var(--tx3);display:block;margin-bottom:10px;}
.ad-card-b{font-size:11px;color:var(--tx3);display:block;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--ln2);}
.ad-th-s{font-style:normal;font-size:11px;color:var(--tx3);font-weight:400;}

/* \u2500\u2500 \uCEEC\uB809\uC158 \uC0C1\uD0DC \xB7 \uBBF8\uB9AC\uBCF4\uAE30 \u2500\u2500 */
.ad-st[data-s="\uACF5\uAC1C\uC911"]{background:#EAF6EF;color:#1E7A4A;}
.ad-st[data-s="\uC608\uC57D"]{background:var(--tint);color:var(--pt);}
.ad-st[data-s="\uC885\uB8CC"]{background:#F1F1F3;color:var(--tx2);}
.ad-collpv{border-radius:var(--r2);padding:26px 18px 18px;position:relative;overflow:hidden;}
.ad-collpv em{display:block;font-style:normal;font-size:11px;letter-spacing:1.6px;margin-bottom:6px;}
.ad-collpv b{display:block;font-size:20px;font-weight:700;letter-spacing:-.8px;margin-bottom:5px;}
.ad-collpv span{font-size:11px;}
.ad-collpv[data-tone="night"]{background:linear-gradient(160deg,#16233D,#0A1220);}
.ad-collpv[data-tone="night"] em{color:#F0D89A;}
.ad-collpv[data-tone="night"] b{color:#fff;}
.ad-collpv[data-tone="night"] span{color:#B9C4D8;}
.ad-collpv[data-tone="dawn"]{background:linear-gradient(160deg,#F6EFE6,#E4D8C8);}
.ad-collpv[data-tone="dawn"] em{color:#B07A3E;}
.ad-collpv[data-tone="dawn"] b{color:var(--ink);}
.ad-collpv[data-tone="dawn"] span{color:var(--tx2);}
.ad-collpv[data-tone="plain"]{background:#F2F2F4;}
.ad-collpv[data-tone="plain"] em{color:var(--pt);}
.ad-collpv[data-tone="plain"] b{color:var(--ink);}
.ad-collpv[data-tone="plain"] span{color:var(--tx2);}

/* \u2500\u2500 \uB3D9\uC791 \uBAA8\uB2EC \u2500\u2500 */
.ad-veil{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px;}
.ad-modal{background:#fff;border-radius:var(--r3);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.ad-modal-h{padding:var(--s4);border-bottom:1px solid var(--ln);display:flex;
  align-items:flex-start;justify-content:space-between;gap:var(--s3);}
.ad-modal-h b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;margin-bottom:3px;}
.ad-modal-h span{font-size:12px;color:var(--tx3);}
.ad-modal-h button{background:none;border:none;color:var(--tx3);display:flex;padding:4px;
  border-radius:50%;}
.ad-modal-h button:hover{background:var(--bg);color:var(--tx);}
.ad-modal-b{padding:var(--s4);overflow-y:auto;flex:1;}
.ad-modal-f{padding:var(--s3) var(--s4);border-top:1px solid var(--ln);display:flex;
  justify-content:flex-end;gap:var(--s2);}
.ad-mbox{background:var(--tint);border-radius:var(--r2);padding:14px 16px;margin-bottom:var(--s4);}

/* \u2500\u2500 \uACE1\uC9D1 \xB7 \uD45C\uC9C0 \u2500\u2500 */
.ad-cv{display:inline-flex;align-items:center;justify-content:center;width:30px;height:38px;
  border-radius:3px;font-style:normal;font-size:11px;font-weight:700;letter-spacing:-.3px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);}
.ad-tbl tr[data-sel="1"] td{background:var(--tint);}
.ad-bked{margin-top:var(--s4);}
.ad-cvpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;}
.ad-cvpick button{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;
  border:1px solid var(--ln);border-radius:var(--r2);padding:10px 6px;font-size:11px;color:var(--tx2);}
.ad-cvpick button:hover{border-color:var(--pt);}
.ad-cvpick button[data-on="1"]{border-color:var(--pt);box-shadow:0 0 0 2px var(--tint);color:var(--pt);font-weight:600;}
.ad-cvpick i{display:flex;align-items:center;justify-content:center;width:42px;height:54px;border-radius:3px;
  font-style:normal;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.14);}
.ad-cvline{display:flex;align-items:center;gap:12px;padding-top:4px;font-size:12px;color:var(--tx2);line-height:1.7;}
.ad-cvline i{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:34px;height:44px;
  border-radius:3px;font-style:normal;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.14);}
.ad-pick[data-off="1"]{background:var(--bg);}
.ad-pick[data-off="1"] b{color:var(--tx3);}

/* \u2500\u2500 \uBD84\uB958 \uAD00\uB9AC \u2500\u2500 */
.ad-cattabs{display:flex;flex-direction:row;gap:6px;margin-bottom:var(--s3);}
.ad-cattabs button{width:auto;}
.ad-codes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.ad-codes .ad-panel{margin:0;}
@media (max-width:1240px){ .ad-codes{grid-template-columns:1fr;} }

/* \u2500\u2500 \uD648 \uD3B8\uC131 > \uC774\uBC88 \uC808\uAE30 \uC900\uBE44 \xB7 \uC791\uB144 \uC21C\uC704 \u2500\u2500 */
.ad-sep{height:1px;background:var(--ln);margin:14px 0;}
.ad-unit{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);}
.ad-unit span{min-width:44px;}
.ad-unit .ad-in-sm{width:64px;text-align:right;}
.ad-unit em{font-style:normal;color:var(--tx3);white-space:nowrap;}
.ad-bestrow{display:block;font-size:12px;line-height:1.9;}
.ad-bestrow b{display:inline;color:var(--tx);font-size:12px;margin:0 4px 0 0;}
.ad-bestrow[data-show="0"]{color:var(--tx3);}
.ad-bestrow em{font-style:normal;color:var(--warn);}

/* \u2500\u2500 \uD648 \uD3B8\uC131 > \uAC80\uC0C9\uC5B4 \u2500\u2500 */
.ad-srchset{margin-top:var(--s4);}
.ad-srchset-b{display:grid;grid-template-columns:1.25fr 1fr;gap:0;}
.ad-srchset-col{padding:var(--s4);}
.ad-srchset-col + .ad-srchset-col{border-left:1px solid var(--ln);}
.ad-srchset-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ad-srchset-h b{font-size:14px;}
/* \uC218\uB3D9/\uC790\uB3D9\uC744 \uC0C9\uC73C\uB85C\uB3C4 \uAD6C\uBD84 \u2014 \uAC19\uC740 \uD328\uB110 \uC548\uC5D0\uC11C \uC131\uACA9\uC774 \uB2E4\uB974\uB2E4\uB294 \uAC78 \uBA3C\uC800 \uBCF4\uC774\uAC8C */
.ad-tagm,.ad-taga{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--pill);}
.ad-tagm{background:var(--tint);color:var(--pt);}
.ad-taga{background:#E9F4EE;color:var(--ok);}
.ad-sug{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.ad-sug-r{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:var(--r1);
  padding:6px 8px;background:#fff;}
.ad-sug-r[data-live="0"]{background:var(--bg);}
.ad-sug-r[data-live="0"] b{color:var(--tx3);}
.ad-sug-r b{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.ad-sug-r em{font-style:normal;font-size:11px;color:var(--tx3);width:44px;text-align:center;flex-shrink:0;}
.ad-sug-r[data-live="1"] em{color:var(--ok);font-weight:600;}
.ad-sug-o{display:flex;flex-direction:column;flex-shrink:0;}
.ad-sug-o button{background:none;border:none;color:var(--tx3);padding:1px 4px;display:flex;border-radius:3px;}
.ad-sug-o button:hover{color:var(--pt);background:var(--tint);}
.ad-sug-sep{color:var(--tx3);font-size:11px;}
.ad-in-sm{width:128px;padding:6px 8px;font-size:12px;flex-shrink:0;}
.ad-sug-x{background:none;border:none;color:var(--tx3);display:flex;padding:7px;border-radius:50%;flex-shrink:0;}
.ad-sug-x:hover{color:var(--rd);background:var(--red-tint);}
.ad-sug-add{display:flex;gap:8px;margin-top:8px;}
.ad-sug-add .ad-in{flex:1;}
.ad-sug-add .ad-bt{flex-shrink:0;white-space:nowrap;}
.ad-ban{display:flex;flex-wrap:wrap;gap:6px;}
.ad-ban span{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--ln);
  border-radius:var(--pill);padding:3px 4px 3px 11px;font-size:12px;}
.ad-ban button{background:none;border:none;color:var(--tx3);display:flex;padding:5px;border-radius:50%;}
.ad-ban button:hover{color:var(--rd);background:var(--red-tint);}
@media (max-width:1240px){
  .ad-srchset-b{grid-template-columns:1fr;}
  .ad-srchset-col + .ad-srchset-col{border-left:0;border-top:1px solid var(--ln);}
}
@media (max-width:640px){
  .ad-sug-r{flex-wrap:wrap;}
  .ad-sug-r b{flex-basis:calc(100% - 80px);}
  .ad-in-sm{width:calc(50% - 20px);}
}
.ad-mbox b{display:block;font-size:13px;color:var(--pt);margin-bottom:6px;}
.ad-mbox p{font-size:13px;color:var(--tx2);line-height:1.85;margin:0;}
.ad-mbox p b{display:inline;color:var(--tx);}
.ad-mbox[data-k="warn"]{background:var(--red-tint);}
.ad-mbox[data-k="warn"] b{color:var(--rd);}
.ad-mspec{margin:0 0 var(--s4);border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;}
.ad-mspec div{display:flex;justify-content:space-between;gap:var(--s3);padding:11px 16px;
  border-bottom:1px solid var(--ln2);font-size:13px;}
.ad-mspec div:last-child{border-bottom:0;}
.ad-mspec dt{color:var(--tx3);margin:0;}
.ad-mspec dd{color:var(--tx);margin:0;font-weight:500;}
.ad-mspec dd b{font-size:15px;font-weight:700;}
.ad-mnote{font-size:12px;color:var(--tx3);line-height:1.8;margin:var(--s3) 0 0;
  padding-top:var(--s3);border-top:1px solid var(--ln2);}
.ad-mnote b{color:var(--tx);}
.ad-done{display:flex;align-items:center;gap:10px;background:#EAF6EF;color:#1E7A4A;
  border-radius:var(--r2);padding:13px 16px;margin-bottom:var(--s3);font-size:13px;font-weight:500;}
.ad-done span{flex:1;}
.ad-done button{background:none;border:none;color:#1E7A4A;display:flex;padding:3px;}

/* \u2500\u2500 \uB2E4\uC6B4\uB85C\uB4DC \uC774\uB825 \u2500\u2500 */
.ad-ratio{font-size:12px;padding:4px 11px;border-radius:var(--pill);display:inline-block;}
.ad-ratio[data-k="ok"]{background:var(--bg);color:var(--tx2);}
.ad-ratio[data-k="watch"]{background:#FDF4E7;color:var(--warn);font-weight:600;}
.ad-ratio[data-k="high"]{background:var(--red-tint);color:var(--rd);font-weight:700;}
.ad-st[data-s="\uC815\uC0C1"]{background:var(--bg);color:var(--tx2);}
.ad-st[data-s="\uAD00\uCC30"]{background:#FDF4E7;color:var(--warn);}
.ad-st[data-s="\uC8FC\uC758"]{background:var(--red-tint);color:var(--rd);}
.ad-st[data-s="\uC9C4\uD589\uC911"]{background:var(--tint);color:var(--pt);}
.ad-st[data-s="\uC9C0\uAE09\uC644\uB8CC"]{background:#EAF6EF;color:#1E7A4A;}
.ad-st[data-s="\uC5F0\uB3D9 \uD574\uC81C"]{background:#F1F1F3;color:var(--tx2);}
.ad-st[data-s="\uC1FC\uD551\uBAB0 \uD0C8\uD1F4"]{background:var(--red-tint);color:var(--rd);}
.ad-mem-q{max-width:240px;}
.ad-st{white-space:nowrap;}
.ad-mem-f{padding:var(--s3) var(--s4);border-bottom:1px solid var(--ln);}
.ad-mem-h{font-size:13px;font-weight:600;color:var(--tx);margin:var(--s4) 0 var(--s2);}
.ad-mem-agree td{font-size:13px;}

/* \u2500\u2500 \uC124\uC815 \u2500\u2500 */
.ad-wmpv{border:1px solid var(--ln);border-radius:var(--r2);background:#fff;padding:14px 18px;
  font-size:11px;color:var(--pt);line-height:1.8;text-align:center;}
.ad-link{display:flex;align-items:center;gap:var(--s3);padding:14px 0;
  border-bottom:1px solid var(--ln2);}
.ad-link:last-child{border-bottom:0;}
.ad-link b{display:block;font-size:14px;font-weight:600;margin-bottom:2px;}
.ad-link em{font-style:normal;font-size:12px;color:var(--tx3);}
.ad-link>div{flex:1;}

/* \u2500\u2500 \uAD00\uB9AC\uC790 \uB85C\uADF8\uC778 \u2500\u2500 */
/* \uAC00\uC6B4\uB370 \uC815\uB82C\uC5D0 justify-content:center\uB97C \uC4F0\uBA74 \uB0B4\uC6A9\uC774 \uD654\uBA74\uBCF4\uB2E4 \uAE38 \uB54C
   \uC704\uC544\uB798\uAC00 \uC798\uB9AC\uACE0 \uC2A4\uD06C\uB864\uB3C4 \uB418\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. margin:auto\uB85C \uAC00\uC6B4\uB370\uB97C \uB9DE\uCDA5\uB2C8\uB2E4. */
.al :focus-visible{outline:2px solid var(--pt,#203BA1);outline-offset:2px;border-radius:2px;}
.al{min-height:100vh;min-height:100dvh;background:#EEEFF2;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:40px 20px;overflow-y:auto;
  font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',-apple-system,sans-serif;
  color:var(--tx);letter-spacing:-.2px;line-height:1.6;}
.al *{box-sizing:border-box;}
.al button{font-family:inherit;cursor:pointer;}
.al-box{background:#fff;border-radius:22px;padding:36px 34px 30px;width:100%;
  max-width:420px;box-shadow:0 4px 30px rgba(0,0,0,.08);margin:auto;flex-shrink:0;}

.al-brand{display:flex;align-items:center;gap:12px;padding-bottom:24px;
  border-bottom:1px solid var(--ln2);margin-bottom:24px;}
.al-brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.4px;}
.al-brand span{font-size:11px;color:var(--tx3);letter-spacing:1px;}


.al h1{font-size:24px;font-weight:700;letter-spacing:-.9px;margin:0 0 8px;}
.al-sub{font-size:13px;color:var(--tx2);line-height:1.8;margin:0 0 24px;}
.al-sub b{color:var(--tx);font-weight:600;}

.al-lb{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:13px;color:var(--tx2);margin-bottom:8px;font-weight:600;}

.al-in{width:100%;height:50px;border:1px solid #D6D7DD;border-radius:10px;
  padding:0 15px;font-size:15px;font-family:inherit;color:var(--tx);background:#FAFAFB;
  margin-bottom:18px;transition:border-color .16s,background .16s,box-shadow .16s;}
.al-in:hover{border-color:#B8B9C2;}
.al-in:focus{outline:none;border-color:var(--pt);background:#fff;
  box-shadow:0 0 0 3px rgba(20,40,160,.12);}
.al-in::placeholder{color:#A9AAB4;}
.al-pw{position:relative;margin-bottom:18px;}
.al-pw .al-in{margin-bottom:0;padding-right:48px;}
.al-pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;
  border:none;padding:7px;color:var(--tx3);display:flex;border-radius:50%;}
.al-pw button:hover{color:var(--tx);background:#EFEFF2;}

.al-err{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--rd);
  background:var(--red-tint);border-radius:9px;padding:11px 13px;margin:-4px 0 18px;line-height:1.65;}
.al-err svg{flex-shrink:0;margin-top:2px;}

/* \uB85C\uADF8\uC778 \uC720\uC9C0 \u2014 \uB204\uB97C \uC218 \uC788\uB294 \uC601\uC5ED\uC784\uC774 \uBCF4\uC774\uB3C4\uB85D \uBA74\uC73C\uB85C \uAC10\uC309\uB2C8\uB2E4 */
.al-keep{display:flex;align-items:center;gap:11px;background:#F7F8FA;
  border:1px solid #E4E6EC;border-radius:10px;padding:13px 15px;margin-bottom:20px;
  font-size:13px;color:var(--tx);text-align:left;width:100%;flex-wrap:wrap;
  transition:background .16s,border-color .16s;}
.al-keep:hover{background:#F1F3F7;border-color:#CFD2DC;}
.al-keep i{width:22px;height:22px;border:2px solid var(--ln-i);border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  font-style:normal;transition:background .14s,border-color .14s;}
.al-keep i svg{display:block;stroke:#fff;stroke-width:3.5;}
.al-keep:hover i{border-color:var(--pt);}
.al-keep[data-on="1"]{background:var(--tint);border-color:var(--pt);}
.al-keep[data-on="1"] i{background:var(--pt);border-color:var(--pt);}
.al-keep[data-on="1"] > span{color:var(--pt);font-weight:600;}
.al-keep > span{flex:1;min-width:0;}
.al-keep em{font-style:normal;font-size:12px;color:var(--tx3);width:100%;padding-left:32px;
  margin-top:5px;line-height:1.6;}

.al-go{width:100%;height:52px;background:var(--pt);color:#fff;border:none;border-radius:26px;
  font-size:15px;font-weight:600;font-family:inherit;transition:background .16s;}
.al-go:hover:not(:disabled){background:var(--pt2);}
.al-go:disabled{background:#CBCCD3;cursor:default;}



.al-test{border:1px dashed #C7CBE0;border-radius:12px;padding:14px 15px;margin-top:12px;
  font-size:12px;color:var(--tx2);line-height:1.85;text-align:center;}
.al-test b{display:block;color:var(--pt);font-size:11px;font-weight:700;margin-bottom:5px;}
.al-test button{border:1px solid var(--pt);background:#fff;color:var(--pt);font-size:12px;
  padding:8px 18px;border-radius:20px;margin:11px auto 0;display:block;}
.al-test button:hover{background:var(--pt);color:#fff;}

.al-foot{font-size:12px;color:var(--tx3);text-align:center;line-height:1.9;
  margin:20px 0 0;flex-shrink:0;}

@media (max-width:420px){
  .al{padding:28px 14px;}
  .al-box{padding:30px 22px 26px;}
}

/* \u2500\u2500 \uC54C\uB9BC \uD328\uB110 \u2500\u2500 */
.ad-alveil{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.3);z-index:50;}
.ad-al{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:#fff;
  z-index:51;display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(0,0,0,.14);
  animation:ad-slide .22s cubic-bezier(.2,.7,.2,1) both;}
@keyframes ad-slide{from{transform:translateX(24px);opacity:0;}to{transform:none;opacity:1;}}
.ad-al-h{padding:var(--s4);border-bottom:1px solid var(--ln);display:flex;
  align-items:center;justify-content:space-between;}
.ad-al-h b{font-size:17px;font-weight:700;letter-spacing:-.4px;}
.ad-al-h button{background:none;border:none;color:var(--tx3);display:flex;padding:5px;border-radius:50%;}
.ad-al-h button:hover{background:var(--bg);color:var(--tx);}
.ad-al-b{flex:1;overflow-y:auto;}
.ad-al-g{padding:14px var(--s4) 8px;font-size:12px;font-weight:700;display:flex;
  align-items:center;gap:7px;}
.ad-al-g span{font-weight:500;color:var(--tx3);}
.ad-al-g[data-g="\uAE34\uAE09"]{color:var(--rd);}
.ad-al-g[data-g="\uCC98\uB9AC \uD544\uC694"]{color:var(--warn);}
.ad-al-g[data-g="\uC548\uB0B4"]{color:var(--tx2);}
.ad-al-i{width:100%;display:flex;align-items:flex-start;gap:11px;padding:13px var(--s4);
  background:none;border:none;border-bottom:1px solid var(--ln2);text-align:left;
  font-family:inherit;transition:background .14s;}
.ad-al-i:hover{background:var(--bg);}
.ad-al-i > svg{color:var(--tx3);flex-shrink:0;margin-top:4px;}
.ad-al-d{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.ad-al-d[data-g="\uAE34\uAE09"]{background:var(--rd);}
.ad-al-d[data-g="\uCC98\uB9AC \uD544\uC694"]{background:var(--warn);}
.ad-al-d[data-g="\uC548\uB0B4"]{background:#C6C6C6;}
.ad-al-x{flex:1;min-width:0;}
.ad-al-x b{display:block;font-size:14px;font-weight:600;color:var(--tx);line-height:1.5;
  margin-bottom:4px;}
.ad-al-x em{display:block;font-style:normal;font-size:12px;color:var(--tx2);line-height:1.7;
  margin-bottom:5px;}
.ad-al-x i{font-style:normal;font-size:11px;color:var(--tx3);}
.ad-al-f{padding:var(--s3) var(--s4);border-top:1px solid var(--ln);display:flex;
  align-items:center;justify-content:space-between;gap:var(--s3);font-size:12px;color:var(--tx3);}
.ad-al-f b{color:var(--tx2);}
.ad-al-f button{background:none;border:1px solid var(--ln);border-radius:var(--pill);
  padding:7px 15px;font-size:12px;color:var(--tx2);flex-shrink:0;}
.ad-al-f button:hover{border-color:var(--pt);color:var(--pt);}
.ad-ico em{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 5px;
  border-radius:var(--pill);background:var(--rd);color:#fff;font-size:11px;font-weight:700;
  font-style:normal;display:flex;align-items:center;justify-content:center;}

/* \u2500\u2500 \uBA54\uC778 \uBC30\uB108 \uAD00\uB9AC \u2500\u2500 */
.ad-hero-row{display:flex;align-items:center;gap:var(--s3);padding:13px 0;
  border-bottom:1px solid var(--ln2);}
.ad-hero-row:last-child{border-bottom:0;}
.ad-hero-row[data-off="1"]{opacity:.45;}
.ad-hero-n{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--tx3);
  width:26px;flex-shrink:0;}
.ad-hero-th{width:92px;height:52px;border-radius:var(--r1);flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.ad-hero-th[data-tone="blue"]{background:linear-gradient(150deg,#2A47B8,#141F5E);}
.ad-hero-th[data-tone="wine"]{background:linear-gradient(150deg,#9E2547,#5E1428);}
.ad-hero-th[data-tone="teal"]{background:linear-gradient(150deg,#26616A,#12333A);}
.ad-hero-th em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--lime);
  letter-spacing:.6px;}
.ad-hero-th img{width:100%;height:100%;object-fit:cover;}
.ad-hero-tx{flex:1;min-width:0;}
.ad-hero-tx b{display:block;font-size:14px;font-weight:700;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ad-hero-tx em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--pt);margin-bottom:3px;}
.ad-hero-tx span{font-size:11px;color:var(--tx3);}
.ad-hero-a{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ad-pick-n{font-family:var(--mono);font-size:11px;color:var(--tx3);flex-shrink:0;}

.ad-tones{display:flex;gap:8px;flex-wrap:wrap;}
.ad-tones button{border:1px solid var(--ln);background:#fff;border-radius:var(--r1);
  padding:7px 12px 7px 8px;display:flex;align-items:center;gap:8px;font-size:12px;
  color:var(--tx2);}
.ad-tones button i{width:22px;height:22px;border-radius:4px;flex-shrink:0;}
.ad-tones button[data-tone="blue"] i{background:linear-gradient(150deg,#2A47B8,#141F5E);}
.ad-tones button[data-tone="wine"] i{background:linear-gradient(150deg,#9E2547,#5E1428);}
.ad-tones button[data-tone="teal"] i{background:linear-gradient(150deg,#26616A,#12333A);}
.ad-tones button[data-on="1"]{border-color:var(--pt);color:var(--pt);font-weight:600;
  box-shadow:0 0 0 2px var(--tint);}

/* \uBA54\uC778 \uBC30\uB108 \uAD00\uB9AC \u2014 5\uC7A5 \xB7 \uD615\uC2DD \xB7 \uADDC\uACA9 \uAC80\uC0AC (2026.11) */
.ad-hero-th[data-tone="lent"],.ad-tones button[data-tone="lent"] i,.ad-heropv[data-tone="lent"]{background:linear-gradient(150deg,#6B46A3,#2E1A4A);}
.ad-hero-th[data-tone="sky"],.ad-tones button[data-tone="sky"] i,.ad-heropv[data-tone="sky"]{background:linear-gradient(160deg,#A9D3FF,#EAF5FF);}
.ad-hero-th[data-tone="sky"] em{color:#1F6FB2;}
.ad-heropv[data-tone="sky"] em{color:#1F6FB2;}
.ad-heropv[data-tone="sky"] b{color:#12292D;}
.ad-heropv[data-tone="sky"]>span{color:#33465A;}
.ad-heropv[data-tone="sky"] i{background:#1F6FB2;color:#fff;}
.ad-heropv[data-tone="sky"] .ad-heropv-dots u{background:rgba(11,16,48,.2);}
.ad-heropv[data-tone="sky"] .ad-heropv-dots u[data-on="1"]{background:#1F6FB2;}
.ad-hst{display:inline-block;font-family:inherit;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:4px;}
.ad-hst[data-s="live"]{background:#EAF6EF;color:#1E7A4A;}
.ad-hst[data-s="wait"]{background:var(--tint);color:var(--pt);}
.ad-hst[data-s="end"],.ad-hst[data-s="off"]{background:#F1F1F3;color:var(--tx2);}
.ad-hero-tx em{font-family:inherit;}
.ad-hdel{display:inline-flex;gap:4px;}
.ad-hmax{margin:0;padding:10px 20px;background:#FDF4E7;color:#8A5A12;}
.ad-hspec th,.ad-hspec td{font-size:12px;line-height:1.6;vertical-align:top;}
.ad-hspec td.mono{font-family:var(--mono);white-space:nowrap;}
.ad-hkind{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ad-hkind button{text-align:left;border:1px solid var(--ln);background:#fff;border-radius:var(--r2);padding:12px 14px;}
.ad-hkind button b{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:4px;}
.ad-hkind button b em{font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--lime);color:#12292D;}
.ad-hkind button span{font-size:12px;color:var(--tx3);line-height:1.5;}
.ad-hkind button[data-on="1"]{border-color:var(--pt);box-shadow:0 0 0 2px var(--tint);}
.ad-hdrop b{font-family:inherit;}
.ad-hdrop-a{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:var(--s3);}
.ad-hdrop-a .ad-bt{margin-top:0;}
.ad-link{background:none;border:none;padding:0;font-size:11px;color:var(--tx3);text-decoration:underline;cursor:pointer;}
.ad-hfile[data-ok="0"] .ad-file{border-color:#E3A1AE;background:#FFF7F8;}
.ad-hchk{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;}
.ad-hchk li{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.5;}
.ad-hchk li svg{flex-shrink:0;margin-top:2px;}
.ad-hchk li[data-ok="1"]{color:#1E7A4A;}
.ad-hchk li[data-ok="0"]{color:#B4233F;}
.ad-hint[data-bad="1"]{color:#B4233F;}
.ad-hguide{display:flex;gap:12px;align-items:center;margin-top:10px;padding:10px 12px;background:#FAFAFB;border-radius:var(--r2);}
.ad-hguide p{margin:0;font-size:12px;line-height:1.65;color:var(--tx2);}
.ad-hsafe{display:block;width:180px;flex-shrink:0;border-radius:4px;}
.ad-hsafe.is-sq{width:84px;}
.ad-hsafe.is-art{width:110px;}
.ad-heropv.is-full{padding:0;background:#EEF0F6;}
.ad-heropv.is-full .ad-hsafe{width:100%;border-radius:0;}
.ad-heropv-full{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:2880/800;height:auto;min-height:80px;background:repeating-linear-gradient(45deg,#DDE3F3 0 8px,#E8ECF8 8px 16px);
  font-family:var(--mono);font-size:11px;color:var(--pt);}
.ad-hspec-mini{margin-top:10px;padding:12px 14px;border:1px solid var(--ln);border-radius:var(--r2);background:#fff;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx2);}
.ad-hspec-mini b{font-size:12px;color:var(--tx);}
.ad-hspec-mini em{font-style:normal;font-family:var(--mono);color:var(--pt);margin-left:4px;}
.ad-herr{color:#B4233F;font-weight:600;}
@media (max-width:900px){
  .ad-hkind{grid-template-columns:1fr;}
  .ad-hguide{flex-direction:column;align-items:flex-start;}
  .ad-hero-row{flex-wrap:wrap;}
  .ad-hero-a{flex-wrap:wrap;}
}

/* \uD734\uB300\uD3F0 Safari\uB294 16px\uBCF4\uB2E4 \uC791\uC740 \uC785\uB825\uCE78\uC744 \uB204\uB974\uBA74 \uD654\uBA74\uC744 \uD655\uB300\uD569\uB2C8\uB2E4 \u2014 \uC881\uC740 \uD654\uBA74\uC5D0\uC11C\uB294 16px\uB85C */
@media (max-width:900px){
  .ad input:not([type="checkbox"]):not([type="radio"]),.ad select,.ad textarea,
  .al input:not([type="checkbox"]):not([type="radio"]){font-size:16px !important;}
}
/* \uC881\uC740 \uD654\uBA74 \uB118\uCE68 \uC815\uB9AC(2026.11 \uBAA8\uBC14\uC77C \uC804 \uD654\uBA74 \uC810\uAC80) */
.ad-row > *,.ad-cards > *,.ad-2 > *{min-width:0;}
.ad-file{min-width:0;} .ad-file > div:not(.ad-file-a){min-width:0;}
.ad-file b{overflow-wrap:anywhere;}
@media (max-width:600px){
  .ad-row{grid-template-columns:1fr;gap:6px;}
  .ad-2{grid-template-columns:1fr;}
  .ad-file{flex-wrap:wrap;}
  .ad-file-a{margin-left:0;}
  .ad-cards{grid-template-columns:1fr 1fr;}
  .ad-ph{flex-wrap:wrap;gap:10px;}
  .ad-ph > div:last-child{flex-wrap:wrap;}
  .ad-hero-th{width:72px;height:42px;}
}
@media (max-width:380px){ .ad-cards{grid-template-columns:1fr;} }
@media (max-width:900px){
  .ad-pol{grid-template-columns:1fr !important;}
  .ad-pol > *{min-width:0;}
  .ad-poltabs:not(.ad-cattabs){flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .ad-poltabs button{white-space:nowrap;flex-shrink:0;}
  .ad-cattabs{overflow-x:auto;}
}
/* \uB20C\uB7EC\uC11C \uBC14\uB00C\uB294 \uAC83\uC774 \uB208\uC5D0 \uBCF4\uC774\uAC8C(2026.11) */
.ad-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:8px;
  background:#12292D;color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  max-width:calc(100vw - 32px);animation:ad-toast .25s ease both;}
.ad-toast svg{color:var(--lime);flex-shrink:0;}
@keyframes ad-toast{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
.ad-set{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--ln);background:#fff;
  font-size:12px;font-weight:700;color:var(--pt);white-space:nowrap;cursor:pointer;}
.ad-set:hover{border-color:var(--pt);background:var(--tint);}
.ad-set[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;}
.ad-auto{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:#F1F1F3;color:var(--tx3);font-size:12px;font-weight:600;}
.ad-grip{display:inline-flex;align-items:center;color:var(--tx3);cursor:grab;padding:4px 2px;border-radius:4px;touch-action:none;}
.ad-grip:hover{color:var(--pt);background:var(--tint);}
.ad-grip:active{cursor:grabbing;}
[data-dragover="1"]{outline:2px dashed var(--pt);outline-offset:2px;}
button.ad-pick{width:100%;text-align:left;font:inherit;cursor:pointer;}
.ad-pick-go em{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:11px;font-weight:700;color:var(--pt);}
.ad-pick-go:hover{border-color:var(--pt);background:var(--tint);}
.ad-fixtx{display:flex;align-items:center;height:40px;padding:0 4px;font-size:14px;font-weight:700;color:var(--tx);}
.ad-addpick{display:flex;gap:6px;margin-top:8px;}
.ad-addpick select{flex:1;min-width:0;}
.ad-hist{list-style:none;margin:0 0 10px;padding:10px 14px;background:#FAFAFB;border-radius:var(--r2);font-size:12px;color:var(--tx2);line-height:1.8;}
.ad-hist b{font-family:var(--mono);font-weight:600;margin-right:6px;}
.ad-pvbox{margin-top:10px;max-width:260px;border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;background:#fff;}
.ad-pvbox span{display:block;padding:6px 10px;font-size:11px;color:var(--tx3);border-top:1px solid var(--ln2);}
.ad-bt[data-on="1"]{border-color:var(--pt);color:var(--pt);}
.ad-add:disabled{opacity:.55;cursor:not-allowed;}
.ad-blk-x:disabled,.ad-sug-o button:disabled{opacity:.3;cursor:default;}
/* \uC785\uB825\uD560 \uC218 \uC788\uB294 \uCE78\uC740 \uD770 \uBC14\uD0D5 \xB7 \uD14C\uB450\uB9AC, \uACE0\uCE60 \uC218 \uC5C6\uB294 \uAC12\uC740 \uCE78 \uC5C6\uC774 \uAE00\uC790\uB85C \u2014 \uB20C\uB7EC\uB3C4 \uC548 \uBC14\uB00C\uB294 \uCE78\uC744 \uB450\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4 */
.ad-in:read-only:not(select){background:#fff;}
/* \uC545\uBCF4 \uB4F1\uB85D \uC911 \uBC14\uB85C \uCD94\uAC00 */
.ad-qrow{display:flex;gap:6px;}
.ad-qrow select{flex:1;min-width:0;}
.ad-qrow .ad-bt{white-space:nowrap;flex-shrink:0;}
.ad-seg-add{border-style:dashed !important;color:var(--pt) !important;display:inline-flex;align-items:center;gap:4px;}
.ad-seg-add[data-on="1"]{background:var(--tint) !important;}
.ad-qa{margin-top:10px;border:1px solid var(--pt);border-radius:var(--r2);background:#FAFBFF;box-shadow:0 0 0 3px var(--tint);}
.ad-qa-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln2);}
.ad-qa-h b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--pt);}
.ad-qa-x{background:none;border:none;color:var(--tx3);padding:4px;cursor:pointer;}
.ad-qa-b{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:12px 14px;}
.ad-qa-f{display:flex;flex-direction:column;gap:4px;min-width:0;}
.ad-qa-f > span{font-size:12px;font-weight:600;color:var(--tx2);}
.ad-qa-f > span em{color:#B4233F;font-style:normal;margin-left:2px;}
.ad-qa-f > i{font-style:normal;font-size:11px;color:var(--tx3);line-height:1.5;}
.ad-qa > .ad-hint{margin:0 14px 8px;}
.ad-qa-a{display:flex;justify-content:flex-end;gap:6px;padding:0 14px 12px;}
@media (max-width:600px){ .ad-qa-b{grid-template-columns:1fr;} .ad-qrow{flex-wrap:wrap;} }
/* \uBC30\uB108 \uBBF8\uB9AC\uBCF4\uAE30 */
.ad-heropv{padding:26px 20px 34px;position:relative;overflow:hidden;}
.ad-heropv[data-tone="blue"]{background:linear-gradient(150deg,#2A47B8,#141F5E);}
.ad-heropv[data-tone="wine"]{background:linear-gradient(150deg,#9E2547,#5E1428);}
.ad-heropv[data-tone="teal"]{background:linear-gradient(150deg,#26616A,#12333A);}
.ad-heropv-img{position:absolute;right:0;top:0;bottom:0;width:44%;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 8px,transparent 8px 16px);}
.ad-heropv em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:1.4px;
  color:var(--lime);display:block;margin-bottom:9px;position:relative;z-index:2;}
.ad-heropv b{display:block;font-size:20px;font-weight:750;letter-spacing:-1px;color:#fff;
  line-height:1.2;margin-bottom:8px;position:relative;z-index:2;}
.ad-heropv>span{display:block;font-size:11px;color:rgba(255,255,255,.7);line-height:1.7;
  margin-bottom:14px;position:relative;z-index:2;max-width:78%;}
.ad-heropv i{font-style:normal;display:inline-block;background:var(--lime);color:#12292D;
  font-size:11px;font-weight:700;padding:8px 15px;border-radius:var(--pill);
  position:relative;z-index:2;}
.ad-heropv-dots{display:flex;gap:5px;margin-top:16px;position:relative;z-index:2;}
.ad-heropv-dots u{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);}
.ad-heropv-dots u[data-on="1"]{background:var(--lime);}
.ad-heropv-pick{background:var(--bg);padding:14px 20px;font-size:11px;font-weight:700;
  color:var(--tx);border-bottom:1px solid var(--ln);}
.ad-heropv-pick div{display:flex;gap:6px;margin-top:9px;}
.ad-heropv-pick s{text-decoration:none;background:#fff;border:1px solid var(--ln);
  border-radius:var(--r1);padding:7px 11px;font-size:11px;font-weight:500;color:var(--tx2);
  flex:1;text-align:center;}

/* \uBCF4\uC548 \uC548\uB0B4 \u2014 \uC778\uC99D\uBC88\uD638 \uB300\uC2E0 \uC5B4\uB5BB\uAC8C \uC9C0\uCF1C\uC9C0\uB294\uC9C0 \uC54C\uB9BD\uB2C8\uB2E4 */
.al-sec{background:var(--tint);border-radius:12px;padding:14px 16px;margin-top:22px;}
.al-sec b{display:flex;align-items:center;gap:7px;color:var(--pt);font-size:13px;
  margin-bottom:9px;}
.al-sec ul{margin:0;padding-left:16px;font-size:12px;color:var(--tx2);line-height:1.9;}
.al-sec li b{display:inline;color:var(--tx);font-size:12px;margin:0;}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   \uC881\uC740 \uD654\uBA74 \uB300\uC751

   \uAD00\uB9AC\uC790\uB294 \uCC45\uC0C1\uC5D0\uC11C \uC4F0\uB294 \uB3C4\uAD6C\uB77C \uB370\uC2A4\uD06C\uD1B1\uC774 \uAE30\uBCF8\uC785\uB2C8\uB2E4.
   \uB2E4\uB9CC \uC678\uBD80\uC5D0\uC11C \uC8FC\uBB38\xB7\uD658\uBD88\uC744 \uD655\uC778\uD558\uB294 \uC77C\uC774 \uC788\uC73C\uB2C8
   \uD0DC\uBE14\uB9BF\uACFC \uD734\uB300\uD3F0\uC5D0\uC11C\uB3C4 \uC77D\uACE0 \uB204\uB97C \uC218\uB294 \uC788\uAC8C \uD569\uB2C8\uB2E4.
   \uD45C\uB294 \uCE78\uC774 \uB9CE\uC544 \uCE74\uB4DC\uB85C \uBC14\uAFB8\uC9C0 \uC54A\uACE0 \uAC00\uB85C\uB85C \uBC00\uC5B4 \uBCF4\uAC8C \uB461\uB2C8\uB2E4.
   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

@media (max-width:1100px){
  .ad-cards{grid-template-columns:repeat(2,1fr);}
  .ad-side{width:188px;}
}

@media (max-width:900px){
  /* \uC138\uB85C \uC0AC\uC774\uB4DC\uBC14\uB97C \uC0C1\uB2E8 \uAC00\uB85C \uB760\uB85C \uBC14\uAFC9\uB2C8\uB2E4.
     \uC544\uC774\uCF58\uB9CC \uB0A8\uAE30\uB294 \uBC29\uC2DD\uC740 \uAE00\uC790\uAC00 \uD14D\uC2A4\uD2B8 \uB178\uB4DC\uB85C \uBD99\uC5B4 \uC788\uC5B4 \uC4F8 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4. */
  .ad{flex-direction:column;min-height:100vh;}
  .ad-side{display:flex;width:100%;height:auto;position:sticky;top:0;z-index:30;
    flex-direction:row;align-items:center;}
  .ad-brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.08);
    flex-shrink:0;padding:12px var(--s3);}
  .ad-brand span{display:none;}
  .ad-nav{display:flex;align-items:center;padding:7px var(--s2);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
  .ad-nav::-webkit-scrollbar{display:none;}
  .ad-nav > div{display:flex;align-items:center;gap:2px;}
  .ad-grp{display:none;}          /* \uAC00\uB85C\uB85C \uB298\uC5B4\uB193\uC73C\uBA74 \uADF8\uB8F9 \uC81C\uBAA9\uC774 \uD750\uB984\uC744 \uB04A\uC2B5\uB2C8\uB2E4 */
  .ad-nav button{width:auto;white-space:nowrap;padding:9px 12px;}
  .ad-nav em{margin-left:6px;}
  .ad-me{border-top:0;border-left:1px solid rgba(255,255,255,.08);
    flex-shrink:0;padding:10px var(--s3);}
  .ad-me span{display:none;}

  /* \uBA54\uB274 \uB760\uC640 \uC0C1\uB2E8 \uBC14\uAC00 \uB458 \uB2E4 top:0\uC5D0 \uBD99\uC73C\uBA74 \uC11C\uB85C \uACB9\uCE69\uB2C8\uB2E4.
     \uC881\uC740 \uD654\uBA74\uC5D0\uC11C\uB294 \uBA54\uB274 \uB760\uB9CC \uACE0\uC815\uD558\uACE0 \uC0C1\uB2E8 \uBC14\uB294 \uD568\uAED8 \uC2A4\uD06C\uB864\uB418\uAC8C \uB461\uB2C8\uB2E4. */
  .ad-top{position:static;padding:0 var(--s3);}

  /* \uD45C\uB294 \uCE78\uC774 \uB9CE\uC544 \uC138\uB85C\uB85C \uC138\uC6B0\uBA74 \uC624\uD788\uB824 \uC77D\uAE30 \uC5B4\uB835\uC2B5\uB2C8\uB2E4. \uC606\uC73C\uB85C \uBC09\uB2C8\uB2E4.
     min-width\uAC00 \uBAA8\uC790\uB77C\uBA74 \uCE78\uC774 \uC9D3\uB20C\uB824 \uC81C\uBAA9\uC774 \uD55C \uAE00\uC790\uC529 \uCABC\uAC1C\uC9D1\uB2C8\uB2E4. */
  .ad-panel{overflow-x:auto;}
  .ad-tbl{min-width:1000px;}
  .ad-tbl .ad-tt,.ad-tbl .ad-code{white-space:nowrap;}
}

@media (max-width:640px){
  .ad-cards{grid-template-columns:1fr;}
  .ad-top{height:auto;padding:10px var(--s3);flex-wrap:wrap;gap:8px;}
  .ad-srch{width:100%;}
  .ad-srch input{width:100%;}
  .ad-me b{display:none;}
  .ad-brand b{font-size:13px;}
}

.ad-audio{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--ln);
  border-radius:var(--r1);padding:8px 10px 8px 13px;font-size:13px;color:var(--tx2);}
/* \u2500\u2500 \uD45C\uBA74 \uC815\uB9AC (2026.11) \u2500\u2500 */
.ad ::selection,.al ::selection{background:#C7F04A;color:#12292D;}
.ad,.al{font-variant-numeric:tabular-nums;word-break:keep-all;}
.ad input,.al input{caret-color:#203BA1;}


/* \uBA54\uB274 \uAD6C\uC131 */
.ad-home > *{min-width:0;}
.ad-mn-wrap .ad-blk-n{min-width:0;}
.ad-mn-wrap .ad-blk-n span{white-space:normal;overflow-wrap:anywhere;}
.ad-mn-wrap .ad-mn-snb{overflow-x:auto;}
.ad-mn-wrap .ad-mn-snb .ad-tbl{min-width:520px;}
.ad-mn-lock{color:var(--tx3);flex-shrink:0;}
.ad-mn-new{font-style:normal;margin-left:6px;padding:1px 6px;border-radius:999px;background:#C7F04A;color:#12292D;font-size:10px;font-weight:700;vertical-align:1px;}
.ad-mn-type{font-style:normal;display:inline-block;margin-right:6px;padding:1px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--ln);font-size:11px;color:var(--tx2);}
.ad-mn-to{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ad-mn-to > *{flex:1 1 140px;min-width:0;}
.ad-hint[data-bad="1"]{color:#B42318;font-weight:600;}
.ad-mn-snb{margin-top:14px;padding-top:14px;border-top:1px dashed var(--ln);}
.ad-mn-snb-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.ad-mn-snb-h b{font-size:13px;}
.ad-mn-snb-h span{font-size:12px;color:var(--tx3);}
.ad-mn-snb tr[data-off="1"] td{opacity:.5;}
.ad-mn-snb td[data-zero="1"]{color:#B42318;font-weight:700;}
.ad-mn-snb td.c{white-space:nowrap;}
.ad-mn-snb td.c .ad-tog{vertical-align:middle;margin:0 4px;}
.ad-mn-pv{background:#fff;font-size:11px;}
.ad-mn-pv-svc{display:flex;gap:2px;background:#203BA1;padding:0 8px;}
.ad-mn-pv-svc span{color:rgba(255,255,255,.72);padding:6px 7px;white-space:nowrap;}
.ad-mn-pv-svc span[data-on="1"]{color:#C7F04A;font-weight:700;box-shadow:inset 0 -2px #C7F04A;}
.ad-mn-pv-gnb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:8px;border-bottom:1px solid var(--ln);}
.ad-mn-pv-gnb span{padding:4px 7px;border-radius:6px;color:var(--tx2);white-space:nowrap;}
.ad-mn-pv-gnb span.is-all{font-weight:700;color:var(--tx);}
.ad-mn-pv-gnb span[data-on="1"]{background:#EEF0FA;color:#203BA1;font-weight:700;}
.ad-mn-pv-gnb em{font-style:normal;margin-left:3px;padding:0 4px;border-radius:999px;background:#C7F04A;color:#12292D;font-size:9px;font-weight:700;}
.ad-mn-pv-gnb i{flex:1;}
.ad-mn-pv-snb{padding:10px 8px 12px;}
.ad-mn-pv-snb small{display:block;color:var(--tx3);font-size:10.5px;margin-bottom:6px;}
.ad-mn-pv-snb div{display:flex;flex-wrap:wrap;gap:4px;}
.ad-mn-pv-snb span{padding:3px 9px;border-radius:999px;border:1px solid var(--ln);color:var(--tx2);}
.ad-mn-pv-snb span[data-on="1"]{background:#203BA1;border-color:#203BA1;color:#fff;font-weight:700;}
.ad-chk[data-ok="w"] i{background:#FEF0C7;color:#93370D;}
.ad-mn-hist{display:grid;grid-template-columns:52px 1fr;gap:2px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln2);font-size:12px;}
.ad-mn-hist span:nth-child(3){grid-column:2;color:var(--tx3);}
.ad-mn-hist button{grid-column:2;justify-self:start;}
