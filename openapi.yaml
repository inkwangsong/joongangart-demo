openapi: 3.1.0
info:
  title: 중앙아트 디지털 악보몰 API
  version: 0.1.0 (2026-11-27 초안)
  description: 기획 문서 「서버 · API 명세」와 짝입니다. 규칙 번호(x-policy)는 기본 정책서, 화면 번호(x-screen)는 상세 기획서를 가리킵니다. 금액은 원 단위 정수, 시각은 +09:00.
servers:
- url: https://sheet.joongangart.co.kr
  description: 운영(예정)
- url: https://stg-sheet.joongangart.co.kr
  description: 검수(예정)
- url: http://localhost:3000
  description: 개발
tags:
- name: 고객 · 인증
- name: 고객 · 둘러보기
- name: 고객 · 관심 · 장바구니
- name: 고객 · 주문
- name: 고객 · 악보함
- name: 관리자 · 인증
- name: 관리자 · 현황
- name: 관리자 · 악보
- name: 관리자 · 곡집
- name: 관리자 · 주문
- name: 관리자 · 저작권료
- name: 관리자 · 권리자
- name: 관리자 · 회원
- name: 관리자 · 설정
- name: 통지
paths:
  /api/v1/auth/cafe24/start:
    get:
      summary: 카페24 인증 화면으로 보냄
      tags:
      - 고객 · 인증
      responses:
        '302':
          description: 카페24 authorize 주소로
      security: []
      x-policy: M-02
      x-screen: B-01
  /api/v1/auth/cafe24/callback:
    get:
      summary: 인증 코드 → 우리 세션
      tags:
      - 고객 · 인증
      responses:
        '302':
          description: 동의 전이면 /consent, 아니면 돌아갈 곳
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: ''
        schema:
          type: string
      x-policy: M-02
      x-screen: B-01
  /api/v1/auth/consent:
    post:
      summary: 최초 연동 동의
      tags:
      - 고객 · 인증
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - member: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInput'
      x-policy: M-03
      x-screen: B-02
  /api/v1/auth/logout:
    post:
      summary: 로그아웃
      tags:
      - 고객 · 인증
      responses:
        '204':
          description: 성공
      security:
      - member: []
  /api/v1/me:
    get:
      summary: 내 정보
      tags:
      - 고객 · 인증
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - member: []
      x-screen: C-06
    delete:
      summary: 연동 해제 — 이름 · 이메일 · 동의 · 관심 지움, 주문 · 결제는 법정 보존
      tags:
      - 고객 · 인증
      responses:
        '204':
          description: 성공
      security:
      - member: []
      x-policy: M-07 W-07
      x-screen: C-06
  /api/v1/home:
    get:
      summary: 홈 블록(게시한 판)
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
      security: []
      x-policy: H-04
      x-screen: A-01
  /api/v1/menu:
    get:
      summary: 메뉴(게시한 판)
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
      security: []
      x-policy: N-01
      x-screen: A-00
  /api/v1/scores:
    get:
      summary: 목록 · 검색
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScoreCard'
                  meta:
                    $ref: '#/components/schemas/Page'
      security: []
      parameters:
      - name: cat
        in: query
        required: false
        description: 분류
        schema:
          type: string
      - name: season
        in: query
        required: false
        description: 절기
        schema:
          type: string
      - name: voice
        in: query
        required: false
        description: 편성
        schema:
          type: string
      - name: acc
        in: query
        required: false
        description: 반주
        schema:
          type: string
      - name: bible
        in: query
        required: false
        description: 성경 장절
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: 검색어
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: popular · new · title
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: size
        in: query
        required: false
        description: 최대 100
        schema:
          type: string
      x-policy: H-06
      x-screen: A-02 A-07
  /api/v1/scores/{code}:
    get:
      summary: 악보 상세
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScoreDetail'
        '404':
          $ref: '#/components/responses/E404'
      security: []
      parameters:
      - &id001
        name: code
        in: path
        required: true
        description: '상품코드 (예: JA52001)'
        schema:
          type: string
      x-policy: P-08 P-10
      x-screen: A-03
  /api/v1/scores/{code}/preview:
    get:
      summary: 공개 면 이미지 · 미리듣기 주소
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pages:
                        type: array
                        items:
                          type: string
                      audio:
                        type: string
                        nullable: true
      security: []
      parameters:
      - *id001
      x-screen: A-04
  /api/v1/scores/{code}/lyrics:
    get:
      summary: 가사 슬라이드
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lyrics'
        '404':
          $ref: '#/components/responses/E404'
      security: []
      parameters:
      - *id001
      x-policy: P-12
      x-screen: A-03
  /api/v1/books/{code}:
    get:
      summary: 곡집
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
      security: []
      parameters:
      - name: code
        in: path
        required: true
        description: '곡집 코드 (예: JA52)'
        schema:
          type: string
      x-screen: A-05
  /api/v1/collections/{id}:
    get:
      summary: 컬렉션
      tags:
      - 고객 · 둘러보기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      x-screen: A-06
  /api/v1/wishlist/{code}:
    put:
      summary: 관심에 담기
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '204':
          description: 성공
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
      security:
      - member: []
      parameters:
      - *id001
      x-policy: W-01~04
      x-screen: C-07
    delete:
      summary: 관심에서 빼기
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '204':
          description: 성공
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
      security:
      - member: []
      parameters:
      - *id001
      x-policy: W-01~04
      x-screen: C-07
  /api/v1/wishlist:
    get:
      summary: 관심 악보
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScoreCard'
      security:
      - member: []
      x-screen: C-07
  /api/v1/wishlist/to-cart:
    post:
      summary: 골라서 같은 부수로 장바구니에
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '422':
          $ref: '#/components/responses/E422'
      security:
      - member: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - codes
              - copies
              properties:
                codes:
                  type: array
                  items:
                    type: string
                copies:
                  type: integer
                  default: 20
      x-policy: W-06
  /api/v1/cart:
    get:
      summary: 장바구니
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
      security:
      - member: []
      x-screen: B-03
  /api/v1/cart/items/{code}:
    put:
      summary: 담기 · 부수 바꾸기
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '422':
          $ref: '#/components/responses/E422'
      security:
      - member: []
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - copies
              properties:
                copies:
                  type: integer
                  minimum: 1
                  maximum: 999
      x-policy: P-03
    delete:
      summary: 빼기
      tags:
      - 고객 · 관심 · 장바구니
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
      security:
      - member: []
      parameters:
      - *id001
  /api/v1/orders:
    post:
      summary: 주문 만들기 — 금액은 서버가 계산
      tags:
      - 고객 · 주문
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrderCreated'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
      description: 화면은 곡과 부수만 보냅니다. 가격 · 합계는 보내지 않고, 보내도 무시합니다.
      security:
      - member: []
      parameters:
      - $ref: '#/components/parameters/Idem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      x-policy: C-01 R-03 P-03
      x-screen: B-04
    get:
      summary: 주문 내역
      tags:
      - 고객 · 주문
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/Page'
      security:
      - member: []
      x-screen: C-04
  /api/v1/orders/{orderNo}:
    get:
      summary: 주문 상세(여는 암호 포함)
      tags:
      - 고객 · 주문
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - member: []
      parameters:
      - &id002
        name: orderNo
        in: path
        required: true
        description: '주문번호 (예: 20261108-0000131)'
        schema:
          type: string
      x-policy: DL-05
      x-screen: C-01 C-04
  /api/v1/orders/{orderNo}/refund-requests:
    post:
      summary: 환불 요청(곡 단위)
      tags:
      - 고객 · 주문
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requestId:
                        type: string
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
      security:
      - member: []
      parameters:
      - *id002
      - $ref: '#/components/parameters/Idem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - itemIds
              - reason
              properties:
                itemIds:
                  type: array
                  items:
                    type: integer
                reason:
                  type: string
                  maxLength: 500
      x-policy: F-01~04
      x-screen: C-05
  /api/v1/library:
    get:
      summary: 내 악보함
      tags:
      - 고객 · 악보함
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LibraryItem'
      security:
      - member: []
      x-policy: DL-02
      x-screen: C-03
  /api/v1/library/items/{itemId}/issue:
    post:
      summary: PDF 발급 — 10분짜리 주소
      tags:
      - 고객 · 악보함
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - member: []
      parameters:
      - &id003
        name: itemId
        in: path
        required: true
        description: 주문 항목 id
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - pdf
                  - print
      x-policy: DL-03~06 DL-08 L-07
      x-screen: C-03
  /api/v1/library/merge:
    post:
      summary: 묶어 받기
      tags:
      - 고객 · 악보함
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '202':
          description: 오래 걸림 — 작업 번호
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
      security:
      - member: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      x-policy: DL-07
      x-screen: C-03
  /api/v1/jobs/{jobId}:
    get:
      summary: 작업 상태
      tags:
      - 고객 · 악보함
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
      security:
      - member: []
      parameters:
      - name: jobId
        in: path
        required: true
        description: ''
        schema:
          type: string
  /api/v1/library/items/{itemId}/lyrics.txt:
    get:
      summary: 곡 하나 가사 TXT
      tags:
      - 고객 · 악보함
      responses:
        '200':
          description: UTF-8 BOM · CRLF · 빈 줄 = 슬라이드
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - member: []
      parameters:
      - *id003
      x-policy: P-12
  /api/v1/library/lyrics.txt:
    post:
      summary: 고른 순서대로 이은 가사 TXT
      tags:
      - 고객 · 악보함
      responses:
        '200':
          description: 성공
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/E403'
      security:
      - member: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemIds:
                  type: array
                  items:
                    type: integer
      x-policy: P-12
  /api/admin/v1/auth/login:
    post:
      summary: 관리자 로그인
      tags:
      - 관리자 · 인증
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/E401'
        '423':
          $ref: '#/components/responses/E423'
        '429':
          $ref: '#/components/responses/E429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
                  format: password
      x-policy: A-02~04
      x-screen: D-00
  /api/admin/v1/auth/logout:
    post:
      summary: 로그아웃
      tags:
      - 관리자 · 인증
      responses:
        '204':
          description: 성공
      security:
      - admin: []
  /api/admin/v1/dashboard:
    get:
      summary: 대시보드
      tags:
      - 관리자 · 현황
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
      security:
      - admin: []
      parameters:
      - name: period
        in: query
        required: false
        description: today · week · month · year
        schema:
          type: string
      x-screen: D-07
  /api/admin/v1/scores:
    get:
      summary: 악보 목록
      tags:
      - 관리자 · 악보
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScoreCard'
                  meta:
                    $ref: '#/components/schemas/Page'
      security:
      - admin: []
