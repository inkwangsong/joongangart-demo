      summary: 기본 설정 바꾸기
      tags:
      - 관리자 · 설정
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
      security:
      - admin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/admin/v1/integrations:
    get:
      summary: 연동 상태
      tags:
      - 관리자 · 설정
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                        expiresAt:
                          type: string
                          format: date-time
                          nullable: true
      security:
      - admin: []
  /api/hooks/inicis/return:
    post:
      summary: 결제창 복귀 — 승인 · 금액 대조 · 주문 확정
      tags:
      - 통지
      responses:
        '302':
          description: /order/done 또는 /order/fail
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      x-policy: C-01 C-02
  /api/hooks/inicis/noti:
    post:
      summary: PG 서버 통지
      tags:
      - 통지
      responses:
        '200':
          description: PG가 요구하는 응답 문자열
          content:
            text/plain:
              schema:
                type: string
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      x-policy: C-02 C-03
  /api/hooks/mail/events:
    post:
      summary: 메일 반송 · 거부 통지
      tags:
      - 통지
      responses:
        '204':
          description: 성공
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      x-policy: S-11
components:
  securitySchemes:
    member:
      type: apiKey
      in: cookie
      name: jm_sid
      description: 카페24 인증 뒤 발급하는 고객 세션
    admin:
      type: apiKey
      in: cookie
      name: ja_admin_sid
      description: 관리자 세션 · 권한 owner / manager / viewer
  parameters:
    Idem:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: 같은 키로 다시 보내면 첫 결과를 돌려줍니다
  responses:
    E400:
      description: 입력을 확인해 주세요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION
              message: 입력을 확인해 주세요
    E401:
      description: 로그인이 필요합니다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: AUTH_REQUIRED
              message: 로그인이 필요합니다
    E403:
      description: 권한이 없습니다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 권한이 없습니다
    E404:
      description: 찾을 수 없습니다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: 찾을 수 없습니다
    E409:
      description: 지금 상태에서는 할 수 없습니다 — 코드별 문장은 API 명세 3장
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: 지금 상태에서는 할 수 없습니다 — 코드별 문장은 API 명세 3장
    E422:
      description: 규칙에 맞지 않습니다 — 코드별 문장은 API 명세 3장
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNPROCESSABLE
              message: 규칙에 맞지 않습니다 — 코드별 문장은 API 명세 3장
    E423:
      description: 로그인 5회 실패로 30분 동안 잠겼습니다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ADMIN_LOCKED
              message: 로그인 5회 실패로 30분 동안 잠겼습니다
    E429:
      description: 잠시 뒤 다시 시도해 주세요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 잠시 뒤 다시 시도해 주세요
    E502:
      description: 결제사 응답이 없습니다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PG_ERROR
              message: 결제사 응답이 없습니다
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: MIN_COPIES
            message:
              type: string
              example: 이 곡은 20부부터 구매하실 수 있습니다
            field:
              type: string
              example: items[0].copies
    Page:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Me:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        consentAt:
          type: string
          format: date-time
          nullable: true
    ConsentInput:
      type: object
      required:
      - terms
      - privacy
      - usage
      properties:
        terms:
          type: boolean
          const: true
        privacy:
          type: boolean
          const: true
        usage:
          type: boolean
          const: true
        phone:
          type: string
          nullable: true
        shareToPayee:
          type: boolean
          default: false
          description: 구매자 이름 · 이메일을 권리자에게 제공(선택, S-10)
    ScoreCard:
      type: object
      properties:
        code:
          type: string
          example: JA52001
        title:
          type: string
        book:
          type: string
          nullable: true
        voice:
          type: string
          example: SATB
        price:
          type: integer
          example: 1000
        minCopies:
          type: integer
          example: 1
        status:
          type: string
          enum:
          - on_sale
          - stopped
        hasLyrics:
          type: boolean
    ScoreDetail:
      allOf:
      - $ref: '#/components/schemas/ScoreCard'
      - type: object
        properties:
          pages:
            type: integer
          durationSec:
            type: integer
          key:
            type: string
          level:
            type: string
          range:
            type: array
            nullable: true
            description: 관리자가 확인한 것만
            items:
              type: object
              properties:
                part:
                  type: string
                lo:
                  type: string
                  example: D4
                hi:
                  type: string
                  example: G5
          bible:
            type: array
            items:
              type: object
              properties:
                ref:
                  type: string
                  example: 요한복음 19:30
                rel:
                  type: string
                  enum:
                  - quote
                  - paraphrase
                  - theme
          people:
            type: array
            items:
              type: object
              properties:
                role:
                  type: string
                name:
                  type: string
                note:
                  type: string
    ScoreAdmin:
      allOf:
      - $ref: '#/components/schemas/ScoreDetail'
      - type: object
        properties:
          status:
            type: string
            enum:
            - draft
            - on_sale
            - stopped
          fileVersion:
            type: integer
          rights:
            type: array
            items:
              $ref: '#/components/schemas/Right'
    Lyrics:
      type: object
      properties:
        title:
          type: string
        credit:
          type: string
          example: Arr. by 진선미
        slides:
          type: array
          items:
            type: array
            items:
              type: string
    FileCheck:
      type: object
      properties:
        k:
          type: string
          example: 하단 여백
        ok:
          type: boolean
        block:
          type: boolean
        msg:
          type: string
    Right:
      type: object
      properties:
        payeeId:
          type: integer
        name:
          type: string
        role:
          type: string
          enum:
          - 작곡
          - 작사
          - 작사 · 작곡
          - 편곡
          - 원곡
        rate:
          type: number
          example: 8
        note:
          type: string
    RightInput:
      type: object
      required:
      - name
      - role
      - rate
      properties:
        name:
          type: string
        role:
          type: string
        rate:
          type: number
        note:
          type: string
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              title:
                type: string
              unitPrice:
                type: integer
              copies:
                type: integer
              amount:
                type: integer
        amount:
          type: integer
    OrderCreate:
      type: object
      required:
      - items
      - agree
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - code
            - copies
            properties:
              code:
                type: string
              copies:
                type: integer
                minimum: 1
                maximum: 999
        agree:
          type: object
          required:
          - digitalNoRefundAfterDownload
          properties:
            digitalNoRefundAfterDownload:
              type: boolean
              const: true
    OrderCreated:
      type: object
      properties:
        orderNo:
          type: string
          example: 20261127-0000214
        amount:
          type: integer
          example: 80000
        pg:
          type: object
          description: KG이니시스 결제창에 넘길 값(서명 포함, 서버가 만듦)
    Order:
      type: object
      properties:
        orderNo:
          type: string
        status:
          type: string
          enum:
          - pending
          - paid
          - failed
          - partially_refunded
          - refunded
        amount:
          type: integer
        paidAt:
          type: string
          format: date-time
        pdfPassword:
          type: string
          example: '000214'
          description: 주문번호 뒤 6자리 (DL-05)
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              code:
                type: string
              titleAtOrder:
                type: string
              unitPrice:
                type: integer
              copies:
                type: integer
              amount:
                type: integer
              status:
                type: string
                enum:
                - active
                - refunded
              downloaded:
                type: boolean
    LibraryItem:
      type: object
      properties:
        itemId:
          type: integer
        code:
          type: string
        title:
          type: string
        orderNo:
          type: string
        copies:
          type: integer
        rounds:
          type: integer
          description: 받은 회차
        pdfPassword:
          type: string
        hasLyrics:
          type: boolean
        practiceUrl:
          type: string
          nullable: true
    Issue:
      type: object
      properties:
        url:
          type: string
          description: 서명된 주소 · 10분 유효
        expiresAt:
          type: string
          format: date-time
        fileName:
          type: string
        password:
          type: string
        round:
          type: integer
        kind:
          type: string
          enum:
          - pdf
          - print
          - merge
        lyricsUrl:
          type: string
          nullable: true
        lyricsMissing:
          type: integer
          description: 가사가 없어 빠진 곡 수
    MergeRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: integer
          description: 고른 순서대로
        cover:
          type: boolean
          default: true
        withLyrics:
          type: boolean
          default: true
        kind:
          type: string
          enum:
          - pdf
          - print
    Job:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
          - running
          - done
          - failed
        pollAfterSec:
          type: integer
        result:
          $ref: '#/components/schemas/Issue'
    Refund:
      type: object
      properties:
        orderNo:
          type: string
        amount:
          type: integer
        kind:
          type: string
        pgCancelTid:
          type: string
        status:
          type: string
          enum:
          - done
          - failed
    RoyaltyMonth:
      type: object
      properties:
        month:
          type: string
          example: 2026-10
        status:
          type: string
          enum:
          - draft
          - confirmed
        totalCopies:
          type: integer
        totalPay:
          type: integer
        payees:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              roles:
                type: array
                items:
                  type: string
              songs:
                type: integer
              copies:
                type: integer
              pay:
                type: integer
              contact:
                type: string
                enum:
                - ok
                - need_email
                - need_birth
                - stopped
              send:
                allOf:
                - $ref: '#/components/schemas/Send'
                nullable: true
              lines:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    title:
                      type: string
                    role:
                      type: string
                    rate:
                      type: number
                    copies:
                      type: integer
                    sales:
                      type: integer
                    pay:
                      type: integer
    SendRequest:
      type: object
      required:
      - payeeIds
      properties:
        payeeIds:
          type: array
          items:
            type: integer
        attach:
          type: object
          properties:
            statementPdf:
              type: boolean
              const: true
            detailXlsx:
              type: boolean
              default: false
    SendBatch:
      type: object
      properties:
        batchId:
          type: string
        queued:
          type: integer
        skipped:
          type: array
          items:
            type: object
            properties:
              payeeId:
                type: integer
              reason:
                type: string
    Send:
      type: object
      properties:
        payeeId:
          type: integer
        to:
          type: string
        files:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - queued
          - sent
          - failed
        error:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
    Payee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        hasBirth:
          type: boolean
          description: 값은 내려주지 않음
        status:
          type: string
          enum:
          - active
          - stopped
        contact:
          type: string
          enum:
          - ok
          - need_email
          - need_birth
          - stopped
        memo:
          type: string
        source:
          type: string
          enum:
          - seed
          - score
          - manual
          - import
        songs:
          type: integer
    PayeeInput:
      type: object
      properties:
        name:
          type: string
          description: 추가할 때만
        email:
          type: string
          format: email
        birth:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
        memo:
          type: string
        status:
          type: string
          enum:
          - active
          - stopped
    ImportResult:
      type: object
      properties:
        added:
          type: integer
        updated:
          type: integer
        skipped:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              reason:
                type: string
    Admin:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - manager
          - viewer
