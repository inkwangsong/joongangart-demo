@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap');

.jm{
  /* \u2500\u2500 color \u2500\u2500 */
  /* B3 \u2014 CI \uBE14\uB8E8 + \uC560\uC2DC\uB4DC \uB77C\uC784 \xB7 60 \uC624\uD504\uD654\uC774\uD2B8 / 30 \uBE14\uB8E8 / 10 \uB77C\uC784 */
  --ink:#12292D;--tx:#12292D;--tx2:#4C6165;--tx3:#667577;--ln:#E0E5E6;--ln2:#EEF2F2;--ln-i:#7C8B8D;--warn:#B5761A;
  --teal:#1E4A50;--teal2:#163A3F;--teal-tint:#EAF1F2;
  --pt:#203BA1;--pt2:#16297C;--pt-tint:#EEF0FA;--pt-deep:#131E52;
  --lime:#C7F04A;--lime-soft:#F3FAE0;
  /* \uCE74\uBBFC \uBC84\uAC74\uB514 \u2014 \uAE4A\uC740 \uC790\uC8FC. \uBC1D\uC740 \uBA74 \uC704 \uAE00\uC790 \xB7 \uC9D9\uC740 \uBA74\uC73C\uB85C\uB3C4 \uC0AC\uC6A9 */
  --red:#8A1F3D;--red2:#6E1730;--red-tint:#FAEDF1;--rd:#8A1F3D;
  --paper:#F9FBFB;--paper2:#FCFDFD;--card:#F1F4F4;
  /* \u2500\u2500 radius \u2500\u2500 */
  --r1:6px;--r2:10px;--r3:14px;--r4:20px;--pill:999px;
  /* \u2500\u2500 shadow \u2500\u2500 */
  --sh1:0 1px 2px rgba(18,41,45,.06),0 4px 14px rgba(18,41,45,.06);--sh2:0 2px 6px rgba(18,41,45,.06),0 18px 40px rgba(18,41,45,.12);
  /* \u2500\u2500 type \u2500\u2500 */
  --t-display:clamp(34px,4.6vw,58px);--t-h1:clamp(24px,2.8vw,36px);--t-h2:20px;
  --t-body:15px;--t-sm:13px;--t-xs:12px;
  --serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* \u2500\u2500 space \u2500\u2500 */
  --s1:4px;--s2:8px;--s3:14px;--s4:22px;--s5:34px;--s6:52px;--s7:78px;--s8:112px;
  --pad:clamp(24px,5vw,64px);
  font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',
    -apple-system,'Apple SD Gothic Neo',sans-serif;
  color:var(--tx);background:#fff;font-size:var(--t-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;letter-spacing:-.2px;}
.jm *,.jm *::before,.jm *::after{box-sizing:border-box;}
.jm button{font-family:inherit;cursor:pointer;}
/* \uD0A4\uBCF4\uB4DC \uD3EC\uCEE4\uC2A4 \u2014 \uBC1D\uC740 \uBA74\uC5D0\uC11C\uB294 CI \uBE14\uB8E8, \uC9D9\uC740 \uBA74\uC5D0\uC11C\uB294 \uB77C\uC784.
   \uD55C \uAC00\uC9C0 \uC0C9\uB9CC \uC4F0\uBA74 \uD30C\uB780 \uBC30\uB108 \uC704\uC5D0\uC11C \uB9C1\uC774 \uBCF4\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. */
.jm :focus-visible{outline:2px solid var(--pt);outline-offset:2px;border-radius:var(--r1);}
.jm-hero :focus-visible,.jm-svc :focus-visible,.jm-up[data-tone] :focus-visible,
.jm-coll :focus-visible,.jm-cathero[data-dark="1"] :focus-visible,
.jm-pw-h :focus-visible{outline-color:var(--lime);}
.jm-w{max-width:1200px;margin:0 auto;padding:0 var(--pad);}

/* \u2500\u2500 \uBE0C\uB79C\uB4DC \uBC14 (CI \uBE14\uB8E8) \u2500\u2500 */
.jm-svc{background:var(--pt);overflow:hidden;max-height:38px;
  transition:max-height .26s cubic-bezier(.2,.7,.2,1),opacity .2s;}
.jm-hd[data-shrink="1"] .jm-svc{max-height:0;opacity:0;}
.jm-svc-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:38px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.jm-svc-t{display:flex;align-items:stretch;height:38px;}
.jm-svc-t button,.jm-svc-t a{background:none;border:none;padding:0 17px;font-size:13px;
  color:rgba(255,255,255,.72);white-space:nowrap;position:relative;transition:color .16s;}
.jm-svc-t button:hover,.jm-svc-t a:hover{color:#fff;}
.jm-svc-t a{display:flex;align-items:center;text-decoration:none;}
.jm-svc-t button[data-on="1"]{color:var(--lime);font-weight:700;}
.jm-svc-t button[data-on="1"]::after{content:'';position:absolute;left:17px;right:17px;
  bottom:0;height:2px;background:var(--lime);}
.jm-svc-r{display:flex;align-items:center;gap:var(--s2);font-size:12px;
  color:rgba(255,255,255,.45);}
/* \uC790\uC8FC \uC4F0\uB294 \uC774\uB3D9 \uB9C1\uD06C\uC785\uB2C8\uB2E4. \uAE00\uC790 \uB192\uC774(15px)\uB9CC\uD07C\uB9CC \uB20C\uB9AC\uBA74 \uBE57\uB098\uAC00\uAE30 \uC26C\uC6CC
   \uC904 \uC804\uCCB4 \uB192\uC774\uB97C \uB204\uB97C \uC218 \uC788\uAC8C \uD569\uB2C8\uB2E4. \uAE00\uC790 \uD06C\uAE30\uB294 \uADF8\uB300\uB85C\uC785\uB2C8\uB2E4. */
.jm-svc-r button{background:none;border:none;font-size:12px;
  color:rgba(255,255,255,.88);padding:0 7px;height:38px;
  display:flex;align-items:center;white-space:nowrap;}
.jm-svc-r button:hover{color:#fff;}

.jm-link{background:none;border:none;padding:0;font:inherit;color:var(--tx2);
  text-decoration:underline;text-underline-offset:3px;}
.jm-link:hover{color:var(--pt);}

/* \u2500\u2500 \uBCF8 \uD5E4\uB354 \u2500\u2500 */
.jm-hd{background:#fff;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--ln);}
html,body{overflow-anchor:none;}
.jm-hd-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:80px;
  display:flex;align-items:center;gap:var(--s5);
  transition:height .26s cubic-bezier(.2,.7,.2,1);}
.jm-hd[data-shrink="1"] .jm-hd-in{height:62px;}
.jm-hd[data-shrink="1"]{box-shadow:0 2px 12px rgba(18,41,45,.07);}

/* \uB85C\uACE0 */
.jm-lg{background:none;border:none;padding:0;display:flex;align-items:center;gap:12px;
  flex-shrink:0;}
.jm-lg-tx{text-align:left;line-height:1.1;}
.jm-lg-tx b{display:block;font-size:20px;font-weight:750;letter-spacing:-1px;color:var(--tx);
  transition:font-size .26s;}
.jm-lg-tx em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--tx3);letter-spacing:1.4px;margin-top:3px;overflow:hidden;
  transition:max-height .26s,opacity .2s,margin-top .26s;max-height:14px;}
.jm-hd[data-shrink="1"] .jm-lg-tx b{font-size:17px;}
.jm-hd[data-shrink="1"] .jm-lg-tx em{max-height:0;opacity:0;margin-top:0;}

/* \uAC80\uC0C9 */
.jm-hd[data-shrink="1"] .jm-srch{height:42px;}
.jm-srch-sc{position:relative;flex-shrink:0;}
.jm-srch-sc>button{height:100%;background:none;border:none;padding:0 14px 0 20px;
  display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);
  white-space:nowrap;border-radius:24px 0 0 24px;}
.jm-srch-sc>button:hover{color:var(--pt);}
.jm-srch-sc::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:1px;height:18px;background:var(--ln);}
.jm-srch-menu{position:absolute;top:calc(100% + 10px);left:8px;min-width:150px;
  background:#fff;border:1px solid var(--ln);border-radius:var(--r2);box-shadow:var(--sh2);
  list-style:none;margin:0;padding:6px;z-index:50;}
.jm-srch-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:none;border:none;padding:9px 12px;font-size:13px;color:var(--tx2);
  border-radius:var(--r1);text-align:left;}
.jm-srch-menu button:hover{background:var(--paper);color:var(--tx);}
.jm-srch-menu button[data-on="1"]{color:var(--pt);font-weight:700;background:var(--pt-tint);}
.jm-srch input{flex:1;border:none;outline:none;background:none;padding:0 14px;
  font-size:15px;font-family:inherit;color:var(--tx);cursor:pointer;min-width:0;}
.jm-srch input::placeholder{color:var(--tx3);}
.jm-srch-go{flex-shrink:0;width:50px;background:none;border:none;display:flex;
  align-items:center;justify-content:center;color:var(--pt);
  border-radius:0 24px 24px 0;}
.jm-srch-go:hover{background:var(--pt-tint);}

/* \uAE30\uB2A5 */
.jm-hd-ac{display:flex;align-items:center;gap:var(--s1);flex-shrink:0;}
.jm-hd-ic{width:40px;height:40px;background:none;border:none;border-radius:50%;
  position:relative;display:flex;align-items:center;justify-content:center;color:var(--tx2);
  transition:background .16s,color .16s;}
.jm-hd-ic:hover{background:var(--paper);color:var(--pt);}
.jm-hd-ic em{position:absolute;top:2px;right:1px;font-style:normal;background:var(--red);
  color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;
  border-radius:var(--pill);display:flex;align-items:center;justify-content:center;padding:0 5px;}
.jm-hd-login{background:var(--pt);color:#fff;border:none;font-size:14px;font-weight:600;
  padding:11px 20px;border-radius:var(--pill);margin-left:var(--s2);transition:background .16s;}
.jm-hd-login:hover{background:var(--pt2);}
.jm-hd-me{display:flex;align-items:center;gap:var(--s2);margin-left:var(--s2);}
.jm-hd-me span{font-size:13px;color:var(--tx);font-weight:600;white-space:nowrap;}
.jm-hd-out{background:none;border:1px solid var(--ln);color:var(--tx2);font-size:12px;
  padding:8px 14px;border-radius:var(--pill);white-space:nowrap;}
.jm-hd-out:hover{border-color:var(--pt);color:var(--pt);}

/* 2\uB2E8 \uBD84\uB958 */
.jm-hd-r2{border-top:1px solid var(--ln2);overflow:hidden;max-height:50px;
  transition:max-height .26s cubic-bezier(.2,.7,.2,1),opacity .2s;}
.jm-hd[data-shrink="1"] .jm-hd-r2{max-height:0;opacity:0;border-top-color:transparent;}
.jm-gnb{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:50px;
  display:flex;align-items:center;gap:2px;overflow-x:auto;}
.jm-gnb button{background:none;border:none;padding:8px 14px;font-size:15px;color:var(--tx2);
  white-space:nowrap;border-radius:var(--pill);font-weight:500;letter-spacing:-.3px;
  transition:background .16s,color .16s;}
.jm-gnb button:hover{background:var(--paper);color:var(--tx);}
.jm-gnb button[data-on="1"]{background:var(--pt-tint);color:var(--pt);font-weight:700;}
.jm-bg{display:flex;align-items:center;gap:7px;font-weight:700 !important;color:var(--tx) !important;}
.jm-bg[data-on="1"]{background:var(--pt) !important;color:#fff !important;}
.jm-hd-div{width:1px;height:16px;background:var(--ln);flex-shrink:0;margin:0 8px;}
.jm-gnb-sp{flex:1;}
.jm-gnb a.jm-gnb-a{display:flex;align-items:center;padding:8px 14px;font-size:15px;color:var(--tx2);text-decoration:none;border-radius:var(--r2);white-space:nowrap;}
.jm-gnb a.jm-gnb-a:hover{background:var(--paper);color:var(--tx);}
.jm-gnb-new{font-style:normal;margin-left:5px;padding:1px 5px;border-radius:999px;background:var(--lime,#C7F04A);color:#12292D;
  font-size:10px;font-weight:700;letter-spacing:.02em;vertical-align:1px;}
/* SNB \u2014 \uBD84\uB958 \uD654\uBA74 \uC548\uC758 \uD558\uC704 \uD0ED */
.jm-snb{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s4);padding-bottom:var(--s4);border-bottom:1px solid var(--ln2);}
.jm-snb button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--card);
  color:var(--tx2);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;}
.jm-snb button i{font-style:normal;color:var(--tx3);font-size:12px;margin-left:3px;font-variant-numeric:tabular-nums;}
.jm-snb button:hover{border-color:var(--tx3);color:var(--tx);}
.jm-snb button[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;font-weight:700;}
.jm-snb button[data-on="1"] i{color:rgba(255,255,255,.75);}
@media (max-width:640px){
  .jm-snb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad);}
  .jm-snb::-webkit-scrollbar{display:none;}
}

@media (prefers-reduced-motion:reduce){
  .jm-svc,.jm-hd-in,.jm-hd-r2,.jm-srch,.jm-lg-tx b,.jm-lg-tx em,
  .jm-srch-panel,.jm-srch-inner,.jm-srch-box{transition:none;}
  .jm-srch-veil{animation:none;}
}


/* \u2500\u2500 \uAC80\uC0C9 \uD328\uB110 \u2500\u2500
   \uC790\uB9AC(jm-srchwrap)\uB294 \uAC80\uC0C9\uCC3D \uB192\uC774\uB9CC \uCC28\uC9C0\uD558\uACE0,
   \uD14C\uB450\uB9AC\uB97C \uC9C0\uB2CC \uBC15\uC2A4(jm-srch-box)\uAC00 \uADF8 \uC704\uC5D0 \uB5A0\uC11C \uC544\uB798\uB85C \uD3BC\uCCD0\uC9D1\uB2C8\uB2E4.
   \uC774\uB807\uAC8C \uD574\uC57C \uD328\uB110\uC774 \uC5F4\uB824\uB3C4 \uD5E4\uB354 \uB192\uC774\uAC00 \uBCC0\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \u2500\u2500 */
.jm-srchwrap{flex:1;max-width:600px;position:relative;height:44px;
  transition:height .26s;}
.jm-hd[data-shrink="1"] .jm-srchwrap{height:38px;}
.jm-srchwrap[data-open="1"]{height:44px;transition:none;}
.jm-srch-box{position:absolute;top:0;left:0;right:0;z-index:52;
  border:2px solid var(--pt);border-radius:var(--r4);background:#fff;
  box-shadow:0 0 0 rgba(18,41,45,0);
  transition:border-radius .28s cubic-bezier(.2,.75,.25,1),
    box-shadow .3s ease;}
.jm-srchwrap[data-open="1"] .jm-srch-box{border-radius:26px 26px 20px 20px;
  box-shadow:0 18px 40px rgba(18,41,45,.16);}
.jm-srch{display:flex;align-items:stretch;height:40px;background:none;}
.jm-hd[data-shrink="1"] .jm-srch{height:34px;}
.jm-srchwrap[data-open="1"] .jm-srch{height:40px;}
.jm-srch-x{flex-shrink:0;width:34px;background:none;border:none;display:flex;
  align-items:center;justify-content:center;color:var(--tx3);}
.jm-srch-x:hover{color:var(--tx);}
.jm-srch input{cursor:text;}

.jm-srch-veil{position:fixed;inset:0;z-index:51;background:rgba(11,11,12,.18);
  animation:jm-veil .26s ease both;}
@keyframes jm-veil{from{opacity:0;}to{opacity:1;}}
/* \uD328\uB110\uC740 \uD56D\uC0C1 \uC790\uB9AC\uC5D0 \uB450\uACE0 \uB192\uC774\uB85C \uC5EC\uB2EB\uC2B5\uB2C8\uB2E4 \u2014 \uADF8\uB798\uC57C \uBD80\uB4DC\uB7FD\uAC8C \uD3BC\uCCD0\uC9D1\uB2C8\uB2E4 */
.jm-srch-panel{max-height:0;overflow:hidden;border-radius:0 0 18px 18px;
  visibility:hidden;pointer-events:none;
  transition:max-height .3s cubic-bezier(.2,.75,.25,1),visibility 0s .3s;}
.jm-srch-panel[data-open="1"]{max-height:66vh;overflow-y:auto;
  visibility:visible;pointer-events:auto;transition:max-height .3s cubic-bezier(.2,.75,.25,1);}
.jm-srch-inner{border-top:1px solid var(--ln2);padding:var(--s4) var(--s4) 0;
  opacity:0;transform:translateY(-6px);
  transition:opacity .22s ease .06s,transform .28s cubic-bezier(.2,.75,.25,1) .04s;}
.jm-srch-panel[data-open="1"] .jm-srch-inner{opacity:1;transform:none;}
.jm-sp-h{display:block;font-size:13px;font-weight:700;color:var(--tx);margin-bottom:12px;}

/* \uCD94\uCC9C \uAC80\uC0C9\uC5B4 */
.jm-sp-sug{padding-bottom:var(--s4);border-bottom:1px solid var(--ln2);}
.jm-sp-sug div{display:flex;gap:6px;flex-wrap:wrap;}
.jm-sp-sug button{background:var(--paper);border:1px solid var(--ln);border-radius:var(--pill);
  padding:8px 15px;font-size:13px;color:var(--tx2);}
.jm-sp-sug button:hover{background:var(--pt-tint);border-color:var(--pt);color:var(--pt);}

/* 3\uB2E8 */
.jm-sp-cols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:var(--s4);
  padding:var(--s4) 0;}
.jm-sp-col{min-width:0;}
.jm-sp-ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin-bottom:11px;}
.jm-sp-ch b{font-size:13px;font-weight:700;color:var(--tx);}
.jm-sp-ch span{font-size:11px;color:var(--tx3);}
.jm-sp-ch button{background:none;border:none;font-size:12px;color:var(--tx3);padding:0;}
.jm-sp-ch button:hover{color:var(--red);}
.jm-sp-empty{font-size:12px;color:var(--tx3);margin:0;padding:8px 0;}

.jm-sp-rec{display:flex;align-items:center;gap:8px;}
.jm-sp-rec>button:first-child{flex:1;background:none;border:none;text-align:left;
  font-size:13px;color:var(--tx2);padding:7px 0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.jm-sp-rec>button:first-child:hover{color:var(--pt);}
.jm-sp-rec>button:last-child{background:none;border:none;color:var(--tx3);display:flex;
  padding:4px;border-radius:50%;flex-shrink:0;}
.jm-sp-rec>button:last-child:hover{background:var(--paper);color:var(--red);}

.jm-sp-hit{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  padding:7px 6px;border-radius:var(--r1);text-align:left;}
.jm-sp-hit:hover{background:var(--paper);}
.jm-sp-cv{flex-shrink:0;line-height:0;}
.jm-sp-cv svg{border-radius:var(--r1);box-shadow:0 2px 6px rgba(0,0,0,.14);}
.jm-sp-tx{flex:1;min-width:0;}
.jm-sp-tx b{display:block;font-size:13px;font-weight:600;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jm-sp-tx em{display:block;font-style:normal;font-size:11px;color:var(--tx3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jm-sp-pr{flex-shrink:0;font-size:13px;font-weight:700;color:var(--tx);}

.jm-sp-hot{list-style:none;margin:0;padding:0;}
.jm-sp-hot button{display:flex;align-items:center;gap:10px;width:100%;background:none;
  border:none;padding:5px 4px;border-radius:var(--r1);text-align:left;}
.jm-sp-hot button:hover{background:var(--paper);}
.jm-sp-hot i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--tx3);
  width:20px;flex-shrink:0;}
.jm-sp-hot i[data-top="1"]{color:var(--pt);font-weight:700;}
.jm-sp-hot span{flex:1;font-size:13px;color:var(--tx2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.jm-sp-hot em{font-style:normal;font-family:var(--mono);font-size:11px;flex-shrink:0;}
.jm-sp-hot em[data-d="up"]{color:var(--red);}
.jm-sp-hot em[data-d="dn"]{color:var(--pt);}
.jm-sp-hot em[data-d="same"]{color:var(--tx3);}

/* \uC790\uB3D9\uC644\uC131 */
.jm-sp-auto{padding-bottom:var(--s3);}
.jm-sp-none{font-size:13px;color:var(--tx2);margin:0;padding:var(--s3) 6px;line-height:1.8;}
.jm-sp-more{width:100%;background:var(--paper);border:none;border-radius:var(--r1);
  padding:11px;font-size:13px;font-weight:600;color:var(--pt);margin-top:8px;}
.jm-sp-more:hover{background:var(--pt-tint);}

.jm-sp-foot{display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--ln2);margin:0 calc(var(--s4) * -1);padding:12px var(--s4);
  position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px;}
.jm-sp-foot button{background:none;border:none;font-size:13px;color:var(--tx2);padding:4px;}
.jm-sp-foot button:hover{color:var(--pt);}
.jm-sp-foot button:last-child{font-weight:600;color:var(--tx);}

@media (max-width:900px){.jm-sp-cols{grid-template-columns:1fr;gap:var(--s3);}}

/* mega */
.jm-mega{position:absolute;left:0;right:0;top:100%;background:#fff;z-index:40;
  box-shadow:var(--sh2);border-radius:0 0 var(--r3) var(--r3);overflow:hidden;
  animation:jm-fade .2s ease both;}
@keyframes jm-fade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.jm-mega-in{max-width:1200px;margin:0 auto;padding:32px var(--pad) 46px;}
.jm-mega-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
.jm-mega-h b{font-size:20px;font-weight:700;color:var(--tx);display:flex;align-items:center;
  gap:10px;letter-spacing:-.6px;}
.jm-mega-h b::before{content:'';width:4px;height:19px;background:var(--pt);border-radius:var(--pill);}
.jm-mega-h button{background:none;border:none;color:var(--tx3);display:flex;padding:6px;border-radius:50%;}
.jm-mega-h button:hover{background:var(--paper);color:var(--tx);}
.jm-mega-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;}
.jm-mega-cols h5{font-size:14px;font-weight:700;color:var(--tx);margin:0 0 16px;letter-spacing:-.4px;}
.jm-mega-cols ul{list-style:none;margin:0;padding:0;}
.jm-mega-cols li{font-size:13px;color:var(--tx2);line-height:2.1;}
.jm-mega-cols li ul li{padding-left:12px;font-size:13px;color:var(--tx3);}
.jm-mega-cols h5 button,.jm-mega-cols li button{background:none;border:none;padding:0;
  font:inherit;color:inherit;text-align:left;}
.jm-mega-cols h5 button:hover,.jm-mega-cols li button:hover{color:var(--pt);}

/* page */
.jm-page{padding-top:var(--s5);padding-bottom:var(--s8);min-height:46vh;}
.jm-crumb{display:flex;align-items:center;justify-content:flex-end;gap:6px;
  font-size:12px;color:var(--tx3);margin-bottom:36px;flex-wrap:wrap;}
.jm-crumb button{background:none;border:none;padding:6px 4px;margin:-6px -4px;
  font-size:12px;color:var(--tx3);}
.jm-crumb button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px;}
.jm-crumb-l{justify-content:flex-start;margin-bottom:var(--s3);}
.jm-cathero[data-dark="1"] .jm-crumb,
.jm-cathero[data-dark="1"] .jm-crumb button{color:rgba(255,255,255,.6);}
.jm-cathero[data-dark="1"] .jm-crumb button:hover{color:#fff;}
.jm-mega-cols h5 button,.jm-mega-cols li button{background:none;border:none;padding:0;
  font:inherit;color:inherit;text-align:left;}
.jm-mega-cols h5 button:hover,.jm-mega-cols li button:hover{color:var(--pt);
  text-decoration:underline;text-underline-offset:3px;}
.jm-ttl{text-align:center;margin-bottom:38px;}
.jm-ttl h2{font-size:24px;font-weight:700;letter-spacing:-.8px;margin:0 0 10px;color:#1A1A1A;}
.jm-ttl p{font-size:13px;color:var(--tx3);margin:0;}

/* \u2500\u2500 category hero \u2500\u2500 */
.jm-cathero{position:relative;min-height:300px;overflow:hidden;display:flex;align-items:center;}
.jm-cathero-in{position:relative;z-index:2;max-width:1200px;width:100%;margin:0 auto;
  padding:var(--s6) var(--pad);}
.jm-cathero-en{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1.8px;
  color:var(--pt);margin-bottom:var(--s3);font-weight:500;}
.jm-cathero h2{font-size:clamp(32px,4.6vw,58px);font-weight:750;letter-spacing:-2.6px;
  color:var(--tx);margin:0 0 var(--s3);line-height:1.1;}
.jm-cathero p{font-size:15px;color:var(--tx2);margin:0 0 var(--s4);line-height:1.8;}
.jm-cathero-n{display:inline-block;font-size:var(--t-xs);letter-spacing:0;font-weight:600;
  color:var(--tx);background:#fff;padding:8px 16px;border-radius:var(--pill);box-shadow:var(--sh1);}
.jm-cathero[data-dark="1"] .jm-cathero-en{color:#fff;}
.jm-cathero[data-dark="1"] h2{color:#fff;}
.jm-cathero[data-dark="1"] p{color:rgba(255,255,255,.75);}
.jm-cathero[data-dark="1"] .jm-cathero-n{color:var(--pt);background:#fff;}

/* \u2500\u2500 \uACE1\uC9D1 \uD398\uC774\uC9C0 \u2500\u2500 */
.jm-bookhero{background:var(--paper);}
.jm-bookhero-in{max-width:1200px;margin:0 auto;padding:var(--s7) var(--pad);display:grid;
  grid-template-columns:auto 1fr;gap:var(--s6);align-items:center;}
.jm-bookhero-art svg{filter:drop-shadow(0 18px 40px rgba(0,0,0,.2));border-radius:var(--r2);}
.jm-bookhero h2{font-size:40px;font-weight:600;letter-spacing:-1.5px;color:var(--ink);
  margin:var(--s2) 0 var(--s3);line-height:1.35;}
.jm-bookhero p{font-size:15px;color:var(--tx2);line-height:2;margin:0 0 var(--s4);max-width:460px;}
.jm-bookhero-a{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;}
.jm-booktbl{width:100%;border-collapse:collapse;}
.jm-booktbl th{border-top:1px solid var(--ink);border-bottom:1px solid var(--ln);
  background:#FAFAFA;padding:11px 12px;font-size:var(--t-xs);color:var(--tx2);font-weight:400;text-align:left;}
.jm-booktbl td{border-bottom:1px solid var(--ln2);padding:15px 12px;font-size:13px;
  color:var(--tx2);vertical-align:middle;}
.jm-booktbl tr:hover td{background:#FCFCFB;}
.jm-bt-no{font-size:var(--t-xs);color:var(--tx3);letter-spacing:.5px;}
.jm-booktitle{background:none;border:none;padding:0;font-size:15px;color:var(--ink);
  font-weight:500;text-align:left;}
.jm-booktitle:hover{color:var(--pt);text-decoration:underline;text-underline-offset:3px;}

/* \u2500\u2500 \uAC80\uC0C9 \u2500\u2500 */
.jm-srchtabs{display:flex;gap:4px;margin-bottom:var(--s3);flex-wrap:wrap;}
.jm-srchtabs button{background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:9px 17px;font-size:13px;color:var(--tx2);font-weight:500;display:flex;
  align-items:center;gap:7px;}
.jm-srchtabs button:hover{border-color:var(--pt);color:var(--pt);}
.jm-srchtabs button[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;
  font-weight:700;}
.jm-srchtabs em{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.75;}
.jm-srchbig{display:flex;align-items:center;gap:var(--s3);background:#fff;
  border:2px solid var(--pt);border-radius:var(--pill);padding:var(--s3) var(--s4);
  margin-bottom:var(--s5);}
.jm-srchbig input{flex:1;border:none;outline:none;font-size:20px;font-family:inherit;
  color:var(--ink);letter-spacing:-.6px;background:none;}
.jm-srchbig input::placeholder{color:var(--tx3);font-weight:300;}
.jm-srchbig button{background:none;border:none;color:var(--tx3);display:flex;padding:4px;}
.jm-srch-sug{padding:var(--s5) 0;}
.jm-srch-sug>span{display:block;font-size:var(--t-sm);color:var(--tx3);margin-bottom:var(--s3);}
.jm-srch-sug div{display:flex;gap:7px;flex-wrap:wrap;}
.jm-srch-sug button{border:1px solid var(--ln);background:#fff;font-size:13px;color:var(--tx2);
  padding:10px 18px;border-radius:var(--pill);}
.jm-srch-sug button:hover{border-color:var(--pt);color:var(--pt);}
.jm-srch-n{font-size:var(--t-sm);color:var(--tx2);margin:0 0 var(--s2);}
.jm-srch-n b{color:var(--ink);font-weight:600;}

/* \u2500\u2500 \uC774\uC6A9 \uC548\uB0B4 \u2500\u2500 */
.jm-steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s5);}
.jm-steps3>div{padding:var(--s5) var(--s4);background:var(--paper);border-radius:var(--r3);}
.jm-steps3 span{display:block;font-size:var(--t-xs);color:var(--pt);letter-spacing:1.6px;
  font-weight:600;margin-bottom:var(--s2);}
.jm-steps3 b{display:block;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.7px;
  margin-bottom:var(--s2);}
.jm-steps3 p{font-size:var(--t-sm);color:var(--tx2);line-height:1.9;margin:0;}
.jm-faq>div{border-bottom:1px solid var(--ln2);padding:var(--s4) 0;}
.jm-guide-cs{background:var(--paper);border-radius:var(--r4);padding:var(--s6);
  text-align:center;margin-top:var(--s7);}
.jm-guide-cs b{display:block;font-size:20px;font-weight:700;color:var(--ink);
  letter-spacing:-.7px;margin-bottom:var(--s2);}
.jm-guide-cs span{display:block;font-size:var(--t-sm);color:var(--tx2);margin-bottom:var(--s5);
  line-height:1.85;}
.jm-guide-cs-a{display:inline-flex;align-items:center;gap:9px;background:var(--pt);color:#fff;
  border:none;border-radius:var(--pill);height:52px;padding:0 32px;font-size:15px;
  font-weight:600;letter-spacing:-.3px;transition:background .16s,transform .16s,box-shadow .16s;}
.jm-guide-cs-a:hover{background:var(--pt2);transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(20,40,160,.24);}
.jm-guide-cs-a i{font-style:normal;transition:transform .22s;display:inline-block;}
.jm-guide-cs-a:hover i{transform:translateX(4px);}

/* \u2500\u2500 product card \u2500\u2500 */
.jm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s5) var(--s3);
  padding-top:var(--s4);}
.jm-card{display:block;position:relative;}
.jm-thumb{display:block;width:100%;position:relative;overflow:hidden;background:var(--card);
  padding:var(--s5) var(--s4);margin-bottom:var(--s3);border:none;border-radius:var(--r3);
  transition:box-shadow .24s,transform .24s;}
.jm-card:hover .jm-thumb{box-shadow:var(--sh2);transform:translateY(-3px);}
.jm-thumb svg{filter:drop-shadow(0 10px 24px rgba(0,0,0,.16));border-radius:var(--r1);
  transition:transform .45s cubic-bezier(.2,.7,.2,1);margin:0 auto;}
.jm-card:hover .jm-thumb svg{transform:scale(1.05);}
.jm-thumb-wrap{position:relative;}
.jm-pv-pnote[data-warn="1"]{color:#B42318;font-weight:600;}
/* \uB0B1\uACE1 \uC378\uB124\uC77C: \uC545\uBCF4 1\uBA74\uC774 \uC8FC\uC778\uACF5. \uC2A4\uD2F0\uCEE4 \uC5C6\uC774 \uC885\uC774\uB9CC, \uBA54\uD0C0\uB294 \uCE74\uB4DC \uC67C\uCABD \uC704 \uAE00\uC790\uB85C */
.jm-sth{position:relative;display:block;margin:0 auto;}
.jm-sth .jm-scorepage{display:block;width:100%;height:auto;max-width:none;}
.jm-thumb .jm-sth svg{filter:none;border-radius:0;}
.jm-sth.is-mini .jm-scorepage{height:100%;border-radius:2px;box-shadow:0 0 0 1px rgba(18,41,45,.10),0 2px 6px rgba(18,41,45,.10);}
.jm-sth-pg{display:block;position:relative;background:#FFFEFB;}
/* crop: \uC704\uCABD\uB9CC \uD06C\uAC8C. \uC885\uC774 \uC717\uBCC0\uC740 \uACE1\uC9D1 \uD45C\uC9C0 \uC0C9 \uB760, \uC544\uB798\uB294 \uCE74\uB4DC \uBC14\uD0D5\uC73C\uB85C \uC0AC\uB77C\uC9D0 */
.jm-sth.is-crop{overflow:hidden;padding:0 10px;margin:0 -10px;box-sizing:content-box;
  -webkit-mask-image:linear-gradient(#000 58%,transparent 98%);mask-image:linear-gradient(#000 58%,transparent 98%);}
.jm-sth.is-crop .jm-sth-pg{border-top:3px solid #203BA1;border-radius:3px 3px 0 0;
  box-shadow:0 1px 2px rgba(18,41,45,.08),0 8px 20px rgba(18,41,45,.10);}
/* book: \uACE1\uC9D1 \uD45C\uC9C0(\uB4A4) + \uC545\uBCF4 1\uBA74(\uC55E).
   \uD3C9\uC18C\uC5D0\uB294 \uBC18\uB4EF\uD558\uAC8C \uACB9\uCCD0 \uCC28\uBD84\uD558\uAC8C(B), \uB9C8\uC6B0\uC2A4\uB97C \uC62C\uB9AC\uBA74 \uD45C\uC9C0\uAC00 \uBE44\uC2A4\uB4EC\uD788 \uBE60\uC9C0\uBA70 \uC545\uBCF4\uAC00 \uC55E\uC73C\uB85C \uB098\uC635\uB2C8\uB2E4(A) \u2014
   '\uACE1\uC9D1\uC5D0\uC11C \uC545\uBCF4 \uD55C \uC7A5\uC744 \uAEBC\uB0B4\uB294' \uB3D9\uC791\uC785\uB2C8\uB2E4. \uC190\uAC00\uB77D\uC73C\uB85C \uC4F0\uB294 \uAE30\uAE30\uC5D0\uB294 \uB9C8\uC6B0\uC2A4 \uC62C\uB9BC\uC774 \uC5C6\uC5B4 B\uB85C \uB461\uB2C8\uB2E4.
   \uC6C0\uC9C1\uC784\uC744 \uC904\uC5EC \uB2EC\uB77C\uACE0 \uC124\uC815\uD55C \uBD84\uAED8\uB294 \uC6C0\uC9C1\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. */
.jm-sth.is-book{aspect-ratio:1/1.02;}
.jm-sth.is-book .jm-sth-cv{position:absolute;left:4%;top:0;width:54%;transform:rotate(-3deg);transform-origin:70% 90%;
  filter:drop-shadow(0 6px 12px rgba(18,41,45,.18));
  transition:left .5s cubic-bezier(.2,.7,.2,1),top .5s cubic-bezier(.2,.7,.2,1),width .5s cubic-bezier(.2,.7,.2,1),transform .5s cubic-bezier(.2,.7,.2,1),filter .5s;}
.jm-sth.is-book .jm-sth-cv svg{display:block;width:100%;height:auto;border-radius:2px;}
.jm-sth.is-book .jm-sth-pg{position:absolute;right:2%;bottom:0;width:64%;aspect-ratio:420/594;overflow:hidden;border-radius:2px;
  box-shadow:-6px 0 14px rgba(18,41,45,.10),0 1px 2px rgba(18,41,45,.10),0 12px 26px rgba(18,41,45,.14);
  transition:right .5s cubic-bezier(.2,.7,.2,1),width .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;}
.jm-sth.is-book .jm-sth-pg .jm-scorepage{height:100%;}
@media (hover:hover){
  .jm-card:hover .jm-sth.is-book .jm-sth-cv,
  .jm-thumb:focus-visible .jm-sth.is-book .jm-sth-cv{left:0;top:6%;width:58%;transform:rotate(-6deg);
    filter:drop-shadow(0 10px 18px rgba(18,41,45,.24));}
  .jm-card:hover .jm-sth.is-book .jm-sth-pg,
  .jm-thumb:focus-visible .jm-sth.is-book .jm-sth-pg{right:0;width:66%;
    box-shadow:-8px 0 18px rgba(18,41,45,.12),0 1px 2px rgba(18,41,45,.10),0 16px 32px rgba(18,41,45,.18);}
}
@media (prefers-reduced-motion:reduce){
  .jm-sth.is-book .jm-sth-cv,.jm-sth.is-book .jm-sth-pg{transition:none;}
}
/* stack: \uC885\uC774 \uC804\uCCB4 + \uB4A4\uB85C \uB450 \uC7A5\uC774 \uBE44\uCF1C \uBCF4\uC5EC \uC5EC\uB7EC \uBA74\uC9DC\uB9AC PDF\uB85C \uC77D\uD798 */
.jm-sth.is-stack{aspect-ratio:420/594;}
.jm-sth.is-stack .jm-sth-pg{height:100%;overflow:hidden;border-top:3px solid #203BA1;border-radius:2px;box-shadow:0 1px 2px rgba(18,41,45,.10),0 10px 22px rgba(18,41,45,.12);}
.jm-sth-sh{position:absolute;inset:0;background:#FBFAF6;border-radius:2px;box-shadow:0 1px 3px rgba(18,41,45,.12);}
.jm-sth-sh:nth-child(1){transform:translate(9px,7px) rotate(2.2deg);background:#F4F2EC;}
.jm-sth-sh:nth-child(2){transform:translate(5px,3.5px) rotate(1deg);}
.jm-card:hover .jm-thumb .jm-sth svg{transform:none;}
.jm-card .jm-thumb .jm-sth{transition:transform .45s cubic-bezier(.2,.7,.2,1);}
.jm-card:hover .jm-thumb .jm-sth{transform:translateY(-3px);}
.jm-thumb-meta{position:absolute;top:14px;left:16px;z-index:1;font-size:11px;font-weight:600;color:var(--tx3);
  letter-spacing:.02em;pointer-events:none;font-variant-numeric:tabular-nums;}
.jm-thumb-ov{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:var(--s3);opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .22s,transform .22s;}
.jm-card:hover .jm-thumb-ov,
.jm-thumb-ov:focus-within{opacity:1;transform:none;pointer-events:auto;}
/* \uD130\uCE58 \uAE30\uAE30\uC5D0\uB294 hover\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4. \uD56D\uC0C1 \uBCF4\uC774\uAC8C \uB450\uC9C0 \uC54A\uC73C\uBA74
   \uD734\uB300\uD3F0\xB7\uD0DC\uBE14\uB9BF\uC5D0\uC11C\uB294 \uBBF8\uB9AC\uBCF4\uAE30 \uBC84\uD2BC\uC5D0 \uC601\uC6D0\uD788 \uB2FF\uC744 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4. */
@media (hover:none){
  .jm-thumb-ov{opacity:1;transform:none;pointer-events:auto;}
}
.jm-pv-bt{background:#fff;color:var(--tx);font-size:13px;font-weight:600;padding:11px 20px;
  border-radius:var(--pill);border:none;box-shadow:var(--sh2);letter-spacing:-.2px;
  white-space:nowrap;cursor:pointer;font-family:inherit;}
.jm-pv-bt:hover{background:var(--pt);color:#fff;}
.jm-pv-bt:hover{background:var(--pt);color:#fff;}
.jm-card-tx{display:block;width:100%;text-align:left;background:none;border:none;padding:0 var(--s1);}
.jm-nm{display:block;font-size:15px;color:var(--tx);font-weight:600;line-height:1.45;
  margin-bottom:4px;letter-spacing:-.4px;transition:color .16s;}
.jm-card:hover .jm-nm{color:var(--pt);}
.jm-sub{display:block;font-size:12px;color:var(--tx3);
  margin-bottom:9px;letter-spacing:0;}
.jm-tags{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}

  padding:4px 10px;line-height:1.5;border-radius:var(--pill);}
.jm-pr{display:block;font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.5px;}
.jm-bd{display:flex;gap:5px;margin-bottom:var(--s2);}

  font-weight:600;border-radius:var(--pill);}
.jm-bd i[data-k="new"]{background:var(--red-tint);color:var(--red);}
.jm-bd i[data-k="\uCD94\uCC9C"]{background:var(--teal-tint);color:var(--teal);}
.jm-bd i[data-k="PDF"]{background:var(--pt-tint);color:var(--pt);}

/* \u2500\u2500 filters \u2500\u2500 */
.jm-lbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  border-bottom:1px solid var(--ln);padding-bottom:var(--s3);flex-wrap:wrap;}

.jm-lbar-r{display:flex;align-items:center;gap:var(--s4);}

  transition:all .16s;font-weight:500;}
.jm-fbt:hover{border-color:var(--pt);color:var(--pt);}
.jm-fbt[data-on="1"]{border-color:var(--pt);color:var(--pt);background:var(--pt-tint);}

.jm-fpanel{background:var(--paper);border-radius:var(--r2);padding:var(--s3) var(--s4);

@keyframes jm-fdown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.jm-frow{display:flex;align-items:center;gap:var(--s4);padding:7px 0;}

  padding:8px 16px;border-radius:var(--pill);transition:all .16s;}
.jm-fopts button:hover{border-color:var(--pt);color:var(--pt);}

.jm-lsort button[data-on="1"]{color:var(--ink);font-weight:600;}

.jm-empty{padding:var(--s8) var(--s4);text-align:center;}

/* detail */

  background:#fff;border-radius:var(--pill);padding:0 4px;}

/* \uBC84\uD2BC \uC774\uB984\uC740 \uD56D\uC0C1 \uD55C \uC904\uB85C \uB461\uB2C8\uB2E4. \uB450 \uC904\uB85C \uC811\uD788\uBA74 \uC54C\uC57D \uBAA8\uC591\uC774 \uBB34\uB108\uC9C0\uACE0
   \uBB34\uC5C7\uC744 \uD558\uB294 \uBC84\uD2BC\uC778\uC9C0 \uD55C\uB208\uC5D0 \uC77D\uD788\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uC881\uC544\uC9C0\uBA74 \uAE00\uC790\uAC00 \uC544\uB2C8\uB77C
   \uBC84\uD2BC \uD3ED\uC774 \uC904\uB3C4\uB85D min-width:0\uC744 \uD568\uAED8 \uB461\uB2C8\uB2E4. */
.jm-bt{height:52px;border:1px solid var(--ln);background:#fff;color:var(--tx);font-size:15px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;flex:1;
  min-width:0;white-space:nowrap;padding:0 16px;
  border-radius:var(--pill);letter-spacing:-.3px;
  transition:border-color .16s,color .16s,background .16s,box-shadow .16s;}
.jm-bt:hover{border-color:var(--pt);color:var(--pt);}
.jm-bt-main{background:var(--pt);border-color:var(--pt);color:#fff;flex:1.7;}
.jm-bt-main:hover{background:var(--pt2);border-color:var(--pt2);color:#fff;
  box-shadow:0 8px 20px rgba(20,40,160,.24);}
.jm-bt-main:disabled{background:#C6C6C6;border-color:#C6C6C6;color:#fff;cursor:default;box-shadow:none;}
.jm-bt-sm{height:30px;font-size:12px;padding:0 13px;flex:none;}
.jm-flash{border:1px solid #C9CEE6;background:#F5F6FC;padding:13px 15px;margin-top:16px;
  font-size:12px;display:flex;gap:9px;align-items:flex-start;line-height:1.75;}
.jm-flash button{background:none;border:none;padding:0;font-size:12px;color:var(--pt);
  text-decoration:underline;text-underline-offset:2px;}

/* tabs */
.jm-songs{width:100%;border-collapse:collapse;margin-top:18px;}
.jm-songs th{background:#5B6B7C;color:#fff;font-size:12px;font-weight:400;padding:9px 12px;text-align:left;}
.jm-songs td{border-bottom:1px solid var(--ln2);padding:9px 12px;font-size:12px;color:#555;}
.jm-songs tr[data-me="1"] td{background:#F5F6FC;color:var(--pt);font-weight:500;}

/* order tables */
.jm-otb{width:100%;border-collapse:collapse;margin-top:24px;}
.jm-otb thead th{border-top:1px solid #333;border-bottom:1px solid var(--ln);background:#FAFAFA;
  padding:11px 10px;font-size:12px;color:#666;font-weight:400;}
.jm-otb td{border-bottom:1px solid var(--ln2);padding:16px 10px;font-size:13px;vertical-align:middle;}
.jm-c{text-align:center;} .jm-r{text-align:right;}
.jm-mini{display:flex;gap:14px;align-items:center;}
.jm-mth{width:54px;flex-shrink:0;}
.jm-mth svg{filter:drop-shadow(2px 3px 5px rgba(0,0,0,.14));}
.jm-mnm{font-size:13px;color:#333;margin-bottom:3px;}
.jm-msb{font-size:11px;color:var(--tx3);}
.jm-x{background:none;border:1px solid #DDD;color:#999;font-size:11px;padding:4px 9px;}
.jm-x:hover{border-color:#AAA;color:#666;}
.jm-sum{border-top:1px solid #333;background:#FAFAFA;padding:20px 18px;display:flex;
  align-items:baseline;justify-content:flex-end;gap:14px;}
.jm-sum span{font-size:12px;color:var(--tx2);}
.jm-sum b{font-size:24px;color:var(--pt);}
.jm-mid{display:flex;justify-content:center;gap:6px;margin-top:34px;}
.jm-mid .jm-bt{flex:none;min-width:180px;}
.jm-blank{border:1px solid var(--ln);padding:76px 20px;text-align:center;color:var(--tx3);
  font-size:13px;margin-top:24px;line-height:2.1;}
.jm-blank button{background:none;border:none;color:var(--pt);font-size:13px;
  text-decoration:underline;text-underline-offset:3px;padding:9px 8px;margin-top:4px;}
.jm-steps{display:flex;justify-content:center;gap:32px;margin:0 0 40px;font-size:12px;color:var(--tx3);}
.jm-steps b{color:var(--pt);font-weight:500;}
.jm-sec{font-size:14px;font-weight:500;color:#222;margin:44px 0 0;padding-bottom:12px;
  border-bottom:1px solid #333;letter-spacing:-.3px;}
.jm-ftb{width:100%;border-collapse:collapse;}
.jm-ftb th{width:130px;border-bottom:1px solid var(--ln2);padding:13px 4px;font-size:12px;
  color:var(--tx3);font-weight:400;text-align:left;}
.jm-ftb td{border-bottom:1px solid var(--ln2);padding:13px 4px;font-size:13px;color:#444;}
.jm-pays{display:flex;flex-wrap:wrap;gap:6px;padding:22px 0 6px;}
.jm-pay{border:1px solid #DDD;background:#fff;padding:11px 18px;font-size:13px;color:#555;
  display:flex;align-items:center;gap:7px;}
.jm-pay[data-on="1"]{border-color:var(--pt);color:var(--pt);font-weight:500;background:#F7F8FD;}
.jm-rd{width:12px;height:12px;border:1px solid #CCC;border-radius:50%;display:flex;
  align-items:center;justify-content:center;}
.jm-pay[data-on="1"] .jm-rd{border-color:var(--pt);}
.jm-pay[data-on="1"] .jm-rd::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--pt);}
.jm-agree{border:1px solid var(--ln);background:#FCFCFC;padding:15px 16px;margin-top:24px;
  display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#555;line-height:1.85;
  width:100%;text-align:left;}
.jm-ck{width:14px;height:14px;border:1px solid #BBB;flex-shrink:0;margin-top:2px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;}
.jm-agree[data-on="1"] .jm-ck{background:var(--pt);border-color:var(--pt);}
.jm-hint{font-size:11px;color:var(--tx3);margin-top:9px;line-height:1.8;}
.jm-done{border:1px solid var(--ln);background:#FCFCFC;padding:46px 20px;text-align:center;}
.jm-done-i{width:44px;height:44px;border:1px solid var(--pt);border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;color:var(--pt);}
.jm-done h3{font-size:17px;font-weight:500;color:#222;margin:0 0 8px;}
.jm-done p{font-size:12px;color:var(--tx2);margin:0;}

/* overlays */
.jm-veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px;}
@keyframes jm-rot{to{transform:rotate(360deg);}}

/* cafe24 login */
/* \u2500\u2500 \uAE30\uC874 \uC1FC\uD551\uBAB0 \uB85C\uADF8\uC778 \uD398\uC774\uC9C0 (\uC804\uCCB4 \uD654\uBA74 \uC774\uB3D9) \u2500\u2500 */
.c2{position:fixed;inset:0;background:#fff;z-index:70;overflow-y:auto;}
.c2-hd{border-bottom:1px solid var(--ln);background:#fff;}
.c2-hd-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.c2-brand{display:flex;align-items:center;gap:9px;}
.c2-brand b{font-size:15px;font-weight:700;letter-spacing:-.5px;color:var(--tx);}
.c2-back{background:none;border:1px solid var(--ln);border-radius:var(--pill);
  padding:9px 16px;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px;
  white-space:nowrap;}
.c2-back:hover{border-color:var(--pt);color:var(--pt);}
.c2-body{max-width:390px;margin:0 auto;padding:var(--s7) var(--pad) var(--s8);}
.c2-from{background:var(--pt-tint);color:var(--pt);border-radius:var(--r2);
  padding:13px 16px;font-size:13px;line-height:1.75;margin-bottom:var(--s5);}
.c2-h{font-size:30px;font-weight:700;letter-spacing:-1.2px;color:var(--tx);margin:0 0 var(--s2);}
.c2-sub{font-size:14px;color:var(--tx2);margin:0 0 var(--s5);}
.c2-lb{display:block;font-size:13px;color:var(--tx2);margin-bottom:7px;font-weight:500;}
.c2-in{width:100%;border:1px solid var(--ln);border-radius:var(--r2);padding:14px 15px;
  font-size:14px;font-family:inherit;margin-bottom:var(--s3);color:var(--tx);}
.c2-in:focus{outline:none;border-color:var(--pt);}
.c2-in::placeholder{color:#B8B8B8;}
.c2-err{font-size:13px;color:var(--rd);margin:-8px 0 var(--s3);}
.c2-keep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);
  background:none;border:none;padding:0 0 var(--s4);font-family:inherit;}
.c2-kb{width:16px;height:16px;border:1px solid var(--ln);border-radius:var(--r1);display:flex;
  align-items:center;justify-content:center;color:#fff;}
.c2-keep[data-on="1"] .c2-kb{background:var(--pt);border-color:var(--pt);}
.c2-go{width:100%;background:var(--pt);color:#fff;border:none;border-radius:var(--pill);
  padding:16px;font-size:15px;font-weight:600;font-family:inherit;transition:background .16s;}
.c2-go:hover{background:var(--pt2);}
.c2-go:disabled{background:#C6C6C6;}
.c2-links{display:flex;justify-content:center;align-items:center;gap:var(--s3);margin-top:var(--s4);}
.c2-links button{background:none;border:none;color:var(--tx2);font-size:13px;font-family:inherit;padding:0;}
.c2-links button:hover{color:var(--pt);}
.c2-links i{width:1px;height:11px;background:var(--ln);}
.c2-scope{background:var(--paper);border-radius:var(--r2);padding:15px 17px;margin-top:var(--s5);
  font-size:12px;color:var(--tx2);line-height:1.85;}
.c2-scope b{color:var(--tx);font-weight:600;}
.c2-test{border:1px dashed #C5CAE2;background:#fff;border-radius:var(--r2);padding:14px 16px;
  margin-top:var(--s3);font-size:12px;color:var(--tx2);line-height:1.85;text-align:center;}
.c2-test b{display:block;color:var(--pt);font-size:11px;font-weight:700;margin-bottom:5px;}
.c2-test button{border:1px solid var(--pt);background:#fff;color:var(--pt);font-size:12px;
  padding:7px 16px;border-radius:var(--pill);margin-top:10px;font-family:inherit;display:block;
  margin-left:auto;margin-right:auto;}
.c2-test button:hover{background:var(--pt);color:#fff;}
.c2-cancel{display:block;width:100%;background:none;border:none;color:var(--tx3);font-size:13px;
  font-family:inherit;margin-top:var(--s5);padding:8px;text-decoration:underline;
  text-underline-offset:3px;}
.c2-cancel:hover{color:var(--tx);}

/* download modal */
.jm-md{background:#fff;width:100%;max-width:392px;border-radius:var(--r4);overflow:hidden;}
.jm-md-h{border-bottom:1px solid var(--ln);padding:14px 18px;display:flex;
  align-items:center;justify-content:space-between;}
.jm-md-h b{font-size:13px;font-weight:500;}
.jm-md-h button{background:none;border:none;color:var(--tx3);display:flex;padding:3px;
  border-radius:50%;}
.jm-md-h button:hover{background:var(--paper);color:var(--tx);}
.jm-md-stage{background:var(--card);padding:var(--s4);display:flex;justify-content:center;}
.jm-md-f{padding:var(--s3) var(--s4) 0;font-size:var(--t-xs);color:var(--tx3);
  line-height:1.85;text-align:center;}
.jm-md-f b{color:var(--tx);font-weight:600;}
.jm-md-acts{display:flex;gap:10px;padding:var(--s3) var(--s4) var(--s4);}

/* \u2500\u2500 \uC778\uC1C4 \u2500\u2500
   \uD654\uBA74\uC5D0\uC11C\uB294 \uC228\uAE30\uACE0 \uC778\uC1C4\uD560 \uB54C\uB9CC \uAEBC\uB0C5\uB2C8\uB2E4. \uD55C \uBA74\uC529 \uB04A\uC5B4 A4\uB85C \uB098\uAC11\uB2C8\uB2E4.
   \uC774 \uC778\uC1C4 CSS\uB294 "\uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uC9C0"\uB97C \uC704\uD55C \uAC83\uC774\uACE0, \uC2E4\uC81C \uBCF4\uD638\uB294
   \uB0B4\uB824\uBC1B\uB294 \uC2DC\uC810\uC5D0 \uC11C\uBC84\uAC00 PDF \uC548\uC5D0 \uC6CC\uD130\uB9C8\uD06C\uB97C \uAD6C\uC6CC \uB123\uB294 \uAC83\uC73C\uB85C \uD569\uB2C8\uB2E4. */
.jm-print{display:none;}
@media print{
  /* position:fixed/absolute \uC548\uC5D0\uC11C\uB294 \uBA74 \uB098\uB214\uC774 \uC0DD\uAE30\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
     \uC778\uC1C4\uD560 \uB54C\uB294 \uB36E\uAC1C\uB97C \uD3C9\uBC94\uD55C \uD750\uB984\uC73C\uB85C \uB418\uB3CC\uB824\uC57C \uD55C \uBA74\uC529 \uB04A\uAE41\uB2C8\uB2E4. */
  .jm > *{display:none !important;}
  .jm > .jm-veil{display:block !important;position:static !important;inset:auto !important;
    background:none !important;padding:0 !important;overflow:visible !important;}
  .jm-veil > .jm-md{display:none !important;}
  .jm-print{display:block !important;width:100% !important;}
  .jm-print-pg{break-after:page;page-break-after:always;width:100%;}
  .jm-print-pg:last-child{break-after:auto;page-break-after:auto;}
  /* \uD654\uBA74\uC6A9 .jm-scorepage\uC758 max-width:330px\uC640 \uADF8\uB9BC\uC790\uB97C \uC885\uC774\uC5D0\uC11C\uB294 \uD489\uB2C8\uB2E4 */
  .jm-print-pg .jm-scorepage{display:block;width:100% !important;max-width:none !important;
    height:auto;box-shadow:none !important;border-radius:0 !important;}
  @page{size:A4 portrait;margin:8mm;}
}


/* \u2500\u2500 1. \uBA54\uC778 \uBC30\uB108 \uCE90\uB7EC\uC140 \u2500\u2500 */
.jm-hero{position:relative;overflow:hidden;transition:background .5s ease;}
.jm-hero[data-tone="blue"]{background:linear-gradient(150deg,#2A47B8,#141F5E);}
.jm-hero[data-tone="wine"]{background:linear-gradient(150deg,#9E2547,#5E1428);}
.jm-hero[data-tone="teal"]{background:linear-gradient(150deg,#26616A,#12333A);}
.jm-hero-in{max-width:1200px;margin:0 auto;padding:var(--s7) var(--pad) var(--s8);
  display:grid;grid-template-columns:1.06fr .94fr;gap:var(--s6);align-items:center;
  min-height:340px;
  animation:jm-slidein .5s cubic-bezier(.2,.7,.2,1) both;}
.jm-hero-tx{min-height:250px;display:flex;flex-direction:column;justify-content:center;}
@keyframes jm-slidein{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.jm-hero-k{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:1.6px;
  color:var(--lime);margin-bottom:var(--s4);}
.jm-hero-tx h1{font-size:clamp(32px,4.4vw,54px);font-weight:750;letter-spacing:-2.6px;
  color:#fff;margin:0 0 var(--s3);line-height:1.14;}
.jm-hero-tx p{font-size:17px;color:rgba(255,255,255,.72);margin:0 0 var(--s5);line-height:1.8;
  max-width:440px;}
/* \uBD80\uBAA8(.jm-hero-tx)\uAC00 \uC138\uB85C flex\uB77C \uADF8\uB0E5 \uB450\uBA74 \uAE00\uC790 \uD3ED\uC774 \uC544\uB2C8\uB77C \uCE78 \uD3ED(541px)\uC73C\uB85C
   \uB298\uC5B4\uB0A9\uB2C8\uB2E4. align-self\uB85C \uAE00\uC790\uB9CC\uD07C\uB9CC \uCC28\uC9C0\uD558\uAC8C \uD569\uB2C8\uB2E4.
   \uD734\uB300\uD3F0\uC5D0\uC11C\uB294 \uC544\uB798 640px \uADDC\uCE59\uC5D0\uC11C \uC77C\uBD80\uB7EC \uAF49 \uCC44\uC6C1\uB2C8\uB2E4 \u2014 \uC5C4\uC9C0\uB85C \uB204\uB974\uAE30 \uC27D\uAC8C. */
.jm-hero-cta{background:var(--lime);color:var(--ink);border:none;border-radius:var(--pill);
  padding:16px 36px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;
  justify-content:center;min-width:240px;
  gap:10px;transition:background .16s,transform .16s;align-self:flex-start;white-space:nowrap;}
.jm-hero-cta:hover{background:#D6F76B;transform:translateY(-1px);}
.jm-hero-cta i{font-style:normal;transition:transform .22s;display:inline-block;}
.jm-hero-cta:hover i{transform:translateX(4px);}

/* \uC2AC\uB77C\uC774\uB4DC\uB9C8\uB2E4 \uADF8\uB9BC \uB192\uC774\uAC00 \uB2EC\uB77C \uD654\uBA74\uC774 \uBC00\uB9AC\uC9C0 \uC54A\uB3C4\uB85D \uACE0\uC815\uD569\uB2C8\uB2E4 */
.jm-hero-art{display:flex;align-items:center;justify-content:center;
  height:340px;flex-shrink:0;}
.jm-hero-art-svg{width:100%;max-width:460px;height:100%;display:block;}
.jm-hero-img{width:100%;max-width:460px;height:100%;object-fit:cover;
  border-radius:var(--r3);display:block;box-shadow:0 18px 44px rgba(0,0,0,.3);}
.jm-hero-covers{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;}
.jm-hero-covers .a{position:relative;z-index:2;
  filter:drop-shadow(0 20px 46px rgba(0,0,0,.42));}
.jm-hero-covers .b{position:absolute;left:16%;top:8%;transform:rotate(-7deg);opacity:.85;
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.34));}

/* \uCEE8\uD2B8\uB864 */
.jm-hero-ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;max-width:1200px;
  margin:0 auto;padding:0 var(--pad) var(--s5);display:flex;align-items:center;
  justify-content:space-between;gap:var(--s4);pointer-events:none;}
.jm-hero-ctl>*{pointer-events:auto;}
.jm-hero-idx{display:flex;align-items:center;gap:var(--s3);}
.jm-hero-idx button{background:none;border:none;padding:9px 5px;font-family:var(--mono);
  font-size:11px;color:rgba(255,255,255,.62);transition:color .2s;}
.jm-hero-idx button[data-on="1"]{color:var(--lime);font-weight:700;}
.jm-hero-idx button:hover{color:#fff;}
.jm-hero-idx i{width:86px;height:3px;background:rgba(255,255,255,.2);display:block;
  overflow:hidden;border-radius:var(--pill);}
.jm-hero-idx i em{display:block;height:100%;width:100%;background:var(--lime);
  transform-origin:left;transform:scaleX(0);border-radius:var(--pill);}
.jm-hero-idx i em[data-play="1"]{animation:jm-prog 6.5s linear forwards;}
@keyframes jm-prog{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.jm-hero-arws{display:flex;gap:6px;}
.jm-arw{width:40px;height:40px;border:1px solid rgba(255,255,255,.32);background:none;
  color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;
  justify-content:center;border-radius:50%;transition:background .16s,color .16s;}
.jm-arw:hover{background:#fff;color:var(--ink);}

/* \uC808\uAE30 \uC120\uD0DD \uBC14 */
.jm-quick{background:var(--paper);border-bottom:1px solid var(--ln);}
/* \uBC14\uB85C \uCC3E\uAE30 \u2014 \uC774\uC815\uD45C. \uCF58\uD150\uCE20\uCC98\uB7FC \uBCF4\uC774\uC9C0 \uC54A\uAC8C \uC587\uC740 \uD55C \uC904 */
.jm-quick-in{display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap;}
.jm-quick-q{font-size:13px;font-weight:700;color:var(--tx);margin-right:6px;white-space:nowrap;}
.jm-quick-g{display:flex;gap:6px;flex-wrap:wrap;}
.jm-quick-g button{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--ln);
  border-radius:var(--pill);padding:8px 14px;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;
  transition:border-color .16s,color .16s;}
.jm-quick-g button:hover{border-color:var(--pt);color:var(--pt);}
.jm-quick-g button svg{flex-shrink:0;}
.jm-quick-g button em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--tx3);font-weight:500;}
.jm-quick-g button[data-k="cond"]{font-weight:500;color:var(--tx2);}
.jm-quick-div{width:1px;height:20px;background:var(--ln);margin:0 4px;}

/* \u2500\u2500 \uC774\uBC88 \uC808\uAE30 \uC900\uBE44 \u2500\u2500 \uB760(D-day) + \uC544\uB798 \uB450 \uCE78(\uC62C\uD574 \uACE0\uB978 \uACE1 \xB7 \uC791\uB144 \uB9CE\uC774 \uBD80\uB978 \uACE1) */
.jm-season{margin-top:var(--s6);}
.jm-season .jm-up{margin-top:0;}
.jm-season .jm-up:not(:last-child){border-radius:var(--r3) var(--r3) 0 0;}
.jm-now{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-top:0;
  border-radius:0 0 var(--r3) var(--r3);background:#fff;}
.jm-now[data-cols="1"]{grid-template-columns:1fr;}
.jm-now-col{padding:var(--s4) var(--s5) var(--s5);min-width:0;}
.jm-now-col + .jm-now-col{border-left:1px solid var(--ln2);}
.jm-now-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.jm-now-h b{font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.4px;}
.jm-now-h span{font-size:12px;color:var(--tx3);}
.jm-now-lead{font-size:13px;color:var(--tx2);line-height:1.7;margin:0 0 10px;}
.jm-now-list{list-style:none;margin:0;padding:0;}
.jm-now-list li{display:grid;grid-template-columns:18px 36px 1fr auto;align-items:center;gap:12px;
  padding:9px 0;border-top:1px solid var(--ln2);}
.jm-now-n{font-family:var(--mono);font-size:12px;color:var(--tx3);text-align:center;}
.jm-now-cv{background:none;border:none;padding:0;display:block;border-radius:var(--r1);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.14);}
.jm-now-tx{background:none;border:none;padding:0;text-align:left;min-width:0;}
.jm-now-tx b{display:block;font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.jm-now-tx:hover b{color:var(--pt);}
.jm-now-tx em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-top:1px;}
.jm-now-r{font-family:var(--mono);font-size:12px;color:var(--tx2);white-space:nowrap;}
.jm-now-more{background:none;border:none;padding:10px 0 0;font-size:13px;font-weight:600;color:var(--pt);}
.jm-now-more i{font-style:normal;display:inline-block;transition:transform .2s;}
.jm-now-more:hover i{transform:translateX(3px);}

.jm-bk-bt{background:var(--pt);color:#fff;border:none;border-radius:var(--pill);
  padding:14px 28px;font-size:14px;font-weight:600;transition:background .16s;}
.jm-bk-bt:hover{background:var(--pt2);}
.jm-bk-link{background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:14px 24px;font-size:14px;font-weight:600;color:var(--tx);display:flex;
  align-items:center;gap:8px;text-decoration:none;}
.jm-bk-link:hover{border-color:var(--pt);color:var(--pt);}
.jm-bk-link span{transition:transform .22s;display:inline-block;}
.jm-bk-link:hover span{transform:translateX(4px);}



/* \u2500\u2500 \uB2E4\uAC00\uC624\uB294 \uC808\uAE30 (D-day) \u2500\u2500
   \uBA54\uC778 \uBC30\uB108\uB294 \uC0C9\uC774 \uAF49 \uCC2C \uB113\uC740 \uBA74\uC774\uBBC0\uB85C, \uC5EC\uAE30\uB294 \uBC1D\uC740 \uCE74\uB4DC\uB85C \uD615\uC2DD\uC744 \uB2EC\uB9AC\uD569\uB2C8\uB2E4.
   \uBC30\uB108\uAC00 \uC5B4\uB5A4 \uC0C9\uC73C\uB85C \uBC14\uB00C\uC5B4\uB3C4 \uACB9\uCCD0 \uBCF4\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \u2500\u2500 */
.jm-up{position:relative;overflow:hidden;border-radius:var(--r3);margin-top:var(--s6);
  padding:var(--s5);background:#fff;border:1px solid var(--ln);box-shadow:var(--sh1);}
.jm-up-bg{position:absolute;right:0;top:0;bottom:0;width:46%;height:100%;
  pointer-events:none;}
.jm-up-in{position:relative;z-index:2;display:flex;align-items:flex-end;
  justify-content:space-between;gap:var(--s5);flex-wrap:wrap;}
.jm-up-l{display:flex;align-items:flex-end;gap:var(--s4);}
.jm-up-d{font-family:var(--mono);font-size:clamp(38px,5.2vw,66px);font-weight:700;
  letter-spacing:-3px;line-height:.84;flex-shrink:0;}
.jm-up[data-tone="xmas"] .jm-up-d{color:var(--red);}
.jm-up[data-tone="easter"] .jm-up-d{color:var(--teal);}
.jm-up-tag{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1.4px;
  margin-bottom:8px;}
.jm-up[data-tone="xmas"] .jm-up-tag{color:var(--red);}
.jm-up[data-tone="easter"] .jm-up-tag{color:var(--teal);}
.jm-up-l b{display:block;font-size:clamp(18px,2vw,24px);font-weight:700;color:var(--tx);
  letter-spacing:-1px;margin-bottom:6px;line-height:1.2;}
.jm-up-l em{font-style:normal;font-size:14px;color:var(--tx2);line-height:1.75;
  display:block;max-width:430px;}
.jm-up-bt{border:none;border-radius:var(--pill);color:#fff;
  padding:14px 26px;font-size:14px;font-weight:700;white-space:nowrap;display:flex;
  align-items:center;gap:9px;transition:background .16s,transform .16s;flex-shrink:0;}
.jm-up[data-tone="xmas"] .jm-up-bt{background:var(--red);}
.jm-up[data-tone="xmas"] .jm-up-bt:hover{background:var(--red2);}
.jm-up[data-tone="easter"] .jm-up-bt{background:var(--teal);}
.jm-up[data-tone="easter"] .jm-up-bt:hover{background:var(--teal2);}
.jm-up-bt:hover{transform:translateY(-1px);}
.jm-up-bt i{font-style:normal;transition:transform .22s;display:inline-block;}
.jm-up-bt:hover i{transform:translateX(4px);}

/* \u2500\u2500 sections \u2500\u2500 */
.jm-sect{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
  margin:var(--s8) 0 var(--s4);}
.jm-sect-l{display:flex;align-items:flex-start;gap:var(--s3);}
.jm-sect-n{font-size:var(--t-xs);color:var(--pt);background:var(--pt-tint);
  padding:5px 12px;border-radius:var(--pill);flex-shrink:0;margin-top:7px;font-weight:600;}
.jm-sect h3{font-size:var(--t-h1);font-weight:700;color:var(--tx);letter-spacing:-1.4px;
  margin:0 0 5px;line-height:1.25;}
.jm-sect p{font-size:var(--t-sm);color:var(--tx2);margin:0;}
.jm-sect-more{background:#fff;border:1px solid var(--ln);font-size:14px;color:var(--tx);
  padding:11px 20px;border-radius:var(--pill);display:flex;align-items:center;gap:7px;
  white-space:nowrap;font-weight:600;transition:border-color .16s,color .16s;}
.jm-sect-more:hover{border-color:var(--pt);color:var(--pt);}
.jm-sect-more span{transition:transform .22s;display:inline-block;}
.jm-sect-more:hover span{transform:translateX(4px);}

/* \u2500\u2500 \uACE1\uC9D1 \u2500\u2500 */
.jm-books{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);}
.jm-book-c{background:var(--card);border:none;border-radius:var(--r3);padding:var(--s5) var(--s3);
  text-align:center;transition:box-shadow .22s,transform .22s;display:block;}
.jm-book-c:hover{box-shadow:var(--sh2);transform:translateY(-3px);}
.jm-book-img{display:block;margin-bottom:var(--s3);}
.jm-book-img svg{margin:0 auto;border-radius:var(--r1);
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.16));transition:transform .4s cubic-bezier(.2,.7,.2,1);}
.jm-book-c:hover .jm-book-img svg{transform:scale(1.04);}
.jm-book-c b{display:block;font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.4px;
  line-height:1.45;margin-bottom:4px;}
.jm-book-c em{font-style:normal;font-size:12px;color:var(--tx2);}

/* \u2500\u2500 \uC7AC\uBC29\uBB38 \uC778\uC0AC \u2500\u2500 */
.jm-wel{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  border:1px solid var(--ln);border-radius:var(--r3);padding:var(--s4) var(--s5);
  margin-top:var(--s6);flex-wrap:wrap;}
.jm-wel b{display:block;font-size:17px;font-weight:600;color:var(--tx);letter-spacing:-.5px;
  margin-bottom:3px;}
.jm-wel em{font-style:normal;font-size:13px;color:var(--tx2);}
.jm-wel button{background:var(--pt);color:#fff;border:none;border-radius:var(--pill);
  padding:12px 22px;font-size:14px;font-weight:600;white-space:nowrap;}
.jm-wel button:hover{background:var(--pt2);}

/* \u2500\u2500 footer \u2500\u2500 */
.jm-ft{border-top:1px solid var(--ln);margin-top:var(--s7);position:relative;}
.jm-ft-mark{background:#fff;padding:var(--s6) var(--pad) var(--s4);text-align:center;
  border-bottom:1px solid var(--ln2);}
.jm-ft-mark span{display:block;font-size:clamp(26px,4.2vw,44px);font-weight:700;color:var(--tx);
  letter-spacing:-1.6px;line-height:1.1;}
.jm-ft-mark em{display:block;font-style:normal;font-size:var(--t-xs);color:var(--tx3);
  letter-spacing:1px;margin-top:var(--s2);}
.jm-ft-hex{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:14px;height:14px;background:var(--pt);border-radius:var(--r1);}
.jm-ft-in{max-width:1200px;margin:0 auto;padding:46px var(--pad) 40px;display:grid;
  grid-template-columns:1.1fr 1.15fr .75fr 1.5fr;}
.jm-ft-col{padding:0 var(--s5);border-right:1px solid var(--ln2);}
.jm-ft-col:first-child{padding-left:0;}
.jm-ft-col:last-child{border-right:0;padding-right:0;position:relative;}
.jm-ft h4{font-size:15px;letter-spacing:.4px;color:var(--tx);font-weight:600;margin:0 0 18px;}
.jm-cs{font-size:clamp(20px,2vw,28px);color:var(--tx);font-weight:700;letter-spacing:-1px;line-height:1.25;white-space:nowrap;}
.jm-cs-l{font-size:14px;color:var(--tx2);margin:14px 0 2px;}
.jm-hr{width:32px;height:3px;background:var(--pt);border-radius:var(--pill);margin:18px 0 14px;}
.jm-ft-sm{font-size:12px;color:var(--tx2);line-height:2;}
.jm-bank{font-size:12px;color:var(--tx2);line-height:1.95;margin-top:8px;}
.jm-ibank{border:1px solid var(--ln);background:#fff;border-radius:var(--pill);padding:11px 16px;
  margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-size:12px;color:var(--tx2);width:100%;white-space:nowrap;}
.jm-ibank:hover{border-color:var(--pt);color:var(--pt);}
.jm-gicons{display:flex;gap:9px;margin-bottom:26px;}
.jm-gicons i{width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;
  align-items:center;justify-content:center;color:var(--tx2);font-style:normal;}
.jm-ntabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px;}
.jm-ntabs button{background:none;border:none;padding:8px 14px;font-size:12px;color:var(--tx3);
  border-radius:var(--r1) var(--r1) 0 0;}
.jm-ntabs button[data-on="1"]{background:var(--paper);color:var(--tx);font-weight:600;}
.jm-nlist{list-style:none;margin:0;padding:0;}
.jm-nlist li{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--tx2);
  line-height:2.15;}
.jm-nlist li span{color:var(--tx3);font-size:11px;flex-shrink:0;}
.jm-nlist li b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jm-ilinks{display:flex;flex-direction:column;gap:8px;}
.jm-ilinks i{font-style:normal;border:1px solid var(--ln);border-radius:var(--r1);
  padding:11px 15px;font-size:13px;color:var(--tx2);}
.jm-ilinks i[data-on="1"]{color:var(--pt);font-weight:700;border-color:var(--pt);}
.jm-co{font-size:12px;color:var(--tx2);line-height:2.05;}
.jm-co em{font-style:normal;color:var(--pt);}
.jm-rex{margin-top:22px;}
.jm-rex h4{margin-bottom:12px;}
.jm-rbt{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.jm-rbt i{font-style:normal;font-size:12px;padding:8px 14px;border:1px solid var(--ln);
  border-radius:var(--pill);color:var(--tx2);display:flex;align-items:center;gap:6px;}
.jm-rbt i:first-child{background:var(--pt);color:#fff;border-color:var(--pt);}
.jm-ft-up{position:absolute;right:0;top:0;background:none;border:1px solid var(--ln);
  border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--tx2);}
.jm-ft-up:hover{border-color:var(--pt);color:var(--pt);}
.jm-ft-bot{border-top:1px solid var(--ln2);padding:26px 0 40px;}
.jm-ft-bot-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);display:flex;
  justify-content:space-between;align-items:flex-start;gap:30px;flex-wrap:wrap;}
.jm-pays-lg{display:flex;gap:12px;align-items:center;}
.jm-paypal{border:1px solid var(--ln);border-radius:var(--r1);padding:9px 18px;font-size:15px;
  font-weight:700;font-style:italic;}
.jm-paypal span{color:#253B80;}
.jm-paypal em{color:#179BD7;font-style:italic;}
.jm-katalk{background:#FEE500;border-radius:var(--r1);padding:10px 16px;font-size:13px;
  color:#3C1E1E;display:flex;align-items:center;gap:7px;}
.jm-certs{text-align:right;font-size:11px;color:var(--tx3);line-height:2;}
.jm-certs .jm-kg{background:var(--paper);padding:2px 8px;border-radius:var(--r1);color:var(--tx2);}
.jm-certs button{border:1px solid var(--ln);background:none;border-radius:var(--pill);
  font-size:11px;color:var(--tx2);padding:4px 11px;}

/* \u2500\u2500 \uBCA0\uC2A4\uD2B8 \uC21C\uC704 \u2500\u2500 */
.jm-best{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln);}
.jm-best li{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s2);
  border-bottom:1px solid var(--ln2);transition:background .16s;}
.jm-best li:hover{background:var(--paper2);}
.jm-best-r{width:34px;flex-shrink:0;text-align:center;font-size:20px;font-weight:700;
  color:var(--tx3);letter-spacing:-1px;}
.jm-best-r[data-top="1"]{color:var(--pt);}
.jm-best-th{background:none;border:none;padding:0;flex-shrink:0;line-height:0;
  transition:transform .22s;}
.jm-best-th svg{border-radius:var(--r1);box-shadow:0 3px 10px rgba(0,0,0,.14);}
.jm-best li:hover .jm-best-th{transform:scale(1.05);}
.jm-best-tx{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;}
.jm-best-tx b{display:block;font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.4px;
  margin-bottom:3px;}
.jm-best-tx:hover b{color:var(--pt);}
.jm-best-tx em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-bottom:6px;}
.jm-best-tags{display:flex;gap:4px;flex-wrap:wrap;}
.jm-best-tags i{font-style:normal;font-size:11px;color:var(--tx2);background:var(--paper);
  padding:3px 9px;border-radius:var(--pill);}
.jm-best-m{flex-shrink:0;font-size:11px;font-weight:600;width:44px;text-align:center;}
.jm-best-m[data-k="up"]{color:var(--red);}
.jm-best-m[data-k="dn"]{color:#1F6FD0;}
.jm-best-m[data-k="same"]{color:var(--tx3);}
.jm-best-m[data-k="new"]{color:#fff;background:var(--pt);border-radius:var(--pill);
  padding:3px 0;font-size:11px;letter-spacing:.4px;}
.jm-best-p{flex-shrink:0;font-size:15px;font-weight:700;color:var(--tx);width:82px;text-align:right;}
.jm-best-bt{flex-shrink:0;background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:9px 18px;font-size:13px;font-weight:600;color:var(--tx);}
.jm-best-bt:hover{background:var(--pt);border-color:var(--pt);color:#fff;}
.jm-best-none{padding:var(--s6);text-align:center;color:var(--tx3);font-size:13px;
  border-top:1px solid var(--ln);}
.jm-best-note{font-size:12px;color:var(--tx3);margin:var(--s3) 0 0;line-height:1.8;}

/* \u2500\u2500 \uCD5C\uCD08 \uC5F0\uB3D9 \uB3D9\uC758 \u2500\u2500 */
.c2-give{background:var(--paper);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s4);}
.c2-give>b{display:block;font-size:13px;color:var(--tx);font-weight:700;margin-bottom:var(--s3);}
.c2-give div{display:flex;justify-content:space-between;gap:var(--s3);padding:7px 0;
  border-bottom:1px solid var(--ln2);font-size:13px;}
.c2-give div:last-of-type{border-bottom:0;}
.c2-give span{color:var(--tx3);}
.c2-give em{font-style:normal;color:var(--tx);font-weight:500;}
.c2-give p{font-size:12px;color:var(--tx3);margin:var(--s3) 0 0;line-height:1.7;}
.c2-all{display:flex;align-items:center;gap:10px;width:100%;background:#fff;
  border:1px solid var(--ln);border-radius:var(--r2);padding:16px;font-family:inherit;
  margin-bottom:var(--s2);transition:border-color .16s;}
.c2-all[data-on="1"]{border-color:var(--pt);background:var(--pt-tint);}
.c2-all i{width:22px;height:22px;border-radius:50%;border:1px solid var(--ln);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-style:normal;}
.c2-all[data-on="1"] i{background:var(--pt);border-color:var(--pt);}
.c2-all b{font-size:15px;font-weight:700;color:var(--tx);}
.c2-agrees{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--s5);}
.c2-agree{display:flex;align-items:center;gap:var(--s2);}
.c2-agree>button:first-child{flex:1;display:flex;align-items:flex-start;gap:10px;background:none;
  border:none;padding:11px 4px;font-family:inherit;text-align:left;}
.c2-agree i{width:18px;height:18px;border-radius:50%;border:1px solid var(--ln);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  font-style:normal;margin-top:1px;}
.c2-agree>button[data-on="1"] i{background:var(--pt);border-color:var(--pt);}
.c2-agree b{display:block;font-size:13px;font-weight:500;color:var(--tx);margin-bottom:2px;}
.c2-agree em{font-style:normal;font-size:12px;color:var(--tx3);line-height:1.6;}
.c2-view{background:none;border:none;font-size:12px;color:var(--tx3);font-family:inherit;
  text-decoration:underline;text-underline-offset:3px;padding:6px;flex-shrink:0;}
.c2-view:hover{color:var(--pt);}
.c2-need{font-size:12px;color:var(--rd);text-align:center;margin:var(--s3) 0 0;}
.c2-note{background:var(--paper);border-radius:var(--r2);padding:12px 14px;margin-top:var(--s3);
  font-size:13px;color:var(--tx2);line-height:1.7;}
.c2-note b{color:var(--tx);font-weight:600;}
.c2-note span{display:block;font-size:12px;color:var(--tx3);margin-top:4px;}
.c2-doc-veil{position:fixed;inset:0;background:rgba(18,41,45,.42);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:var(--s4);}
.c2-doc{background:#fff;border-radius:var(--r3);max-width:460px;width:100%;padding:var(--s5);
  box-shadow:0 24px 60px rgba(0,0,0,.18);max-height:86vh;overflow:auto;}
.c2-doc-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:var(--s3);}
.c2-doc-h b{display:block;font-size:17px;color:var(--tx);letter-spacing:-.5px;line-height:1.4;}
.c2-doc-h span{display:block;font-size:12px;color:var(--tx3);margin-top:2px;}
.c2-doc-h button{margin-left:auto;background:none;border:none;color:var(--tx3);cursor:pointer;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.c2-doc-h button:hover{background:var(--paper);color:var(--tx);}
.c2-doc ol{margin:0 0 var(--s4);padding-left:18px;font-size:13px;color:var(--tx2);line-height:1.8;}
.c2-doc li{margin-bottom:8px;}
.jm-hd-name{background:none;border:none;font:inherit;font-size:13px;color:var(--tx);cursor:pointer;
  padding:6px 4px;border-radius:var(--r1);text-decoration:underline;text-decoration-color:transparent;
  text-underline-offset:4px;transition:text-decoration-color .15s;}
.jm-hd-name:hover{text-decoration-color:currentColor;}
.jm-me-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-bottom:var(--s4);}
.jm-me-card{border:1px solid var(--ln);border-radius:var(--r3);padding:var(--s5);background:#fff;}
.jm-me-card h3{font-size:17px;margin:0 0 var(--s3);letter-spacing:-.4px;color:var(--tx);}
.jm-me-card dl{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;margin:0 0 var(--s3);font-size:14px;}
.jm-me-card dt{color:var(--tx3);}
.jm-me-card dd{margin:0;color:var(--tx);word-break:break-all;}
.jm-me-card dd em{font-style:normal;color:var(--tx3);font-size:12px;margin-left:6px;}
.jm-me-hint{font-size:12px;color:var(--tx3);line-height:1.7;margin:0 0 var(--s3);}
.jm-me-note{font-size:12px;color:var(--pt);margin:var(--s2) 0 0;}
.jm-me-tb{width:100%;border-collapse:collapse;margin-bottom:var(--s3);}
.jm-me-tb td{border-bottom:1px solid var(--ln2);padding:10px 0;vertical-align:middle;}
.jm-me-tb td:last-child{text-align:right;width:52px;}
.jm-me-tb b{display:block;font-size:13px;font-weight:500;color:var(--tx);}
.jm-me-tb span{font-size:12px;color:var(--tx3);}
.jm-me-out p{font-size:13px;color:var(--tx2);margin:0 0 var(--s2);line-height:1.75;}
.jm-me-out ul{margin:0 0 var(--s4);padding-left:18px;font-size:13px;color:var(--tx2);line-height:1.8;}
.jm-me-danger{color:var(--rd)!important;border-color:#E9C9D2!important;}
.jm-me-confirm{border-top:1px solid var(--ln2);padding-top:var(--s3);}
.jm-me .jm-bt-sm{height:38px;font-size:13px;padding:0 16px;}
.jm-me-acts{display:flex;gap:8px;margin-top:var(--s3);}
.jm-me-danger-go{background:var(--rd)!important;border-color:var(--rd)!important;}
.jm-me-danger-go:disabled{opacity:.4;cursor:not-allowed;}
.jm-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:250;background:var(--tx);
  color:#fff;border-radius:var(--pill);padding:12px 14px 12px 20px;font-size:13px;display:flex;
  align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);max-width:calc(100% - 32px);}
.jm-toast button{background:rgba(255,255,255,.14);border:none;color:#fff;width:28px;height:28px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
@media (max-width:760px){.jm-me-grid{grid-template-columns:1fr;}.jm-me-card{padding:var(--s4);}
  .jm-me-card dl{grid-template-columns:84px 1fr;}}

/* \u2500\u2500 \uC0C1\uC138 \uC2A4\uD1A0\uB9AC \uC139\uC158 (ARC \uBC29\uC2DD) \u2500\u2500 */
.jm-spec3{list-style:none;margin:var(--s4) 0;padding:var(--s4) 0;
  border-top:1px solid var(--ln2);border-bottom:1px solid var(--ln2);}
.jm-spec3 li{display:flex;align-items:baseline;gap:var(--s3);padding:6px 0;}
.jm-spec3 b{font-size:14px;font-weight:600;color:var(--tx);min-width:170px;}
.jm-spec3 span{font-size:13px;color:var(--tx3);}
.jm-spec3 li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--pt);
  flex-shrink:0;transform:translateY(-2px);}

.jm-story{margin-top:var(--s8);border-top:1px solid var(--ln);}
.jm-st{display:grid;grid-template-columns:220px 1fr;gap:var(--s6);
  padding:var(--s7) 0;border-bottom:1px solid var(--ln2);}
.jm-st:last-child{border-bottom:0;}
.jm-st-h{position:sticky;top:120px;align-self:start;}
.jm-st-h span{display:block;font-size:var(--t-xs);letter-spacing:1.6px;color:var(--pt);
  font-weight:600;margin-bottom:8px;}
.jm-st-h h3{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.9px;margin:0;
  line-height:1.35;}
.jm-st-b p{font-size:15px;color:var(--tx2);line-height:2;margin:0 0 var(--s3);}
.jm-st-b p:last-of-type{margin-bottom:0;}
.jm-st-b b{color:var(--tx);font-weight:600;}
.jm-st-sub{font-size:13px !important;color:var(--tx3) !important;}
.jm-st-q{font-size:17px !important;color:var(--tx) !important;font-weight:500;
  line-height:1.85 !important;padding-left:var(--s4);border-left:3px solid var(--pt);}
.jm-st-spec{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(2,1fr);gap:1px;background:var(--ln2);
  border:1px solid var(--ln2);border-radius:var(--r2);overflow:hidden;}
.jm-st-spec li{background:#fff;padding:15px 18px;}
.jm-st-spec b{display:block;font-size:var(--t-xs);letter-spacing:.8px;color:var(--tx3);
  font-weight:500;margin-bottom:5px;}
.jm-st-spec em{display:block;font-style:normal;font-size:15px;font-weight:600;color:var(--tx);}
.jm-st-spec span{display:block;font-size:12px;color:var(--tx3);margin-top:2px;}
.jm-st-sku{font-size:12px !important;color:var(--tx3) !important;letter-spacing:.4px;
  margin-top:var(--s3) !important;}
.jm-st-more{background:none;border:none;padding:var(--s3) 0 0;font-size:14px;font-weight:600;
  color:var(--pt);display:flex;align-items:center;gap:7px;}
.jm-st-more span{transition:transform .22s;display:inline-block;}
.jm-st-more:hover span{transform:translateX(4px);}

/* \u2500\u2500 \uCEEC\uB809\uC158 \u2500\u2500 */
.jm-colls{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);}
.jm-coll{position:relative;height:230px;border:none;border-radius:var(--r3);overflow:hidden;
  padding:0;display:block;text-align:left;transition:transform .24s,box-shadow .24s;}
.jm-coll:hover{transform:translateY(-3px);box-shadow:var(--sh2);}
.jm-coll svg{transition:transform .5s cubic-bezier(.2,.7,.2,1);}
.jm-coll:hover svg{transform:scale(1.05);}
.jm-coll-tx{position:absolute;left:0;right:0;bottom:0;padding:var(--s4);z-index:2;}
.jm-coll-tx em{display:block;font-style:normal;font-size:var(--t-xs);letter-spacing:1.8px;
  margin-bottom:6px;}
.jm-coll-tx b{display:block;font-size:24px;font-weight:700;letter-spacing:-1px;margin-bottom:6px;}
.jm-coll-tx i{font-style:normal;font-size:12px;}
.jm-coll[data-tone="night"] .jm-coll-tx{background:linear-gradient(transparent,rgba(8,14,26,.85) 55%);}
.jm-coll[data-tone="night"] em{color:#F0D89A;}
.jm-coll[data-tone="night"] b{color:#fff;}
.jm-coll[data-tone="night"] i{color:#B9C4D8;}
.jm-coll[data-tone="dawn"] .jm-coll-tx{background:linear-gradient(transparent,rgba(255,255,255,.9) 55%);}
.jm-coll[data-tone="dawn"] em{color:#B07A3E;}
.jm-coll[data-tone="dawn"] b{color:var(--tx);}
.jm-coll[data-tone="dawn"] i{color:var(--tx2);}
.jm-coll[data-tone="plain"] .jm-coll-tx{background:linear-gradient(transparent,rgba(255,255,255,.92) 55%);}
.jm-coll[data-tone="plain"] em{color:var(--pt);}
.jm-coll[data-tone="plain"] b{color:var(--tx);}
.jm-coll[data-tone="plain"] i{color:var(--tx2);}

.jm-collhero{position:relative;min-height:340px;display:flex;align-items:flex-end;overflow:hidden;}
.jm-collhero-in{position:relative;z-index:2;max-width:1200px;width:100%;margin:0 auto;
  padding:var(--s7) var(--pad) var(--s6);}
.jm-collhero-en{display:block;font-size:var(--t-xs);letter-spacing:2.4px;font-weight:600;
  margin-bottom:var(--s2);}
.jm-collhero h2{font-size:clamp(30px,4.2vw,50px);font-weight:700;letter-spacing:-2px;
  margin:0 0 var(--s3);line-height:1.15;}
.jm-collhero p{font-size:15px;line-height:1.85;margin:0 0 var(--s4);max-width:520px;}
.jm-collhero-n{display:inline-block;font-size:var(--t-xs);font-weight:600;padding:8px 16px;
  border-radius:var(--pill);}
.jm-collhero[data-tone="night"]{background:#0A1220;}
.jm-collhero[data-tone="night"] .jm-collhero-en{color:#F0D89A;}
.jm-collhero[data-tone="night"] h2{color:#fff;}
.jm-collhero[data-tone="night"] p{color:#B9C4D8;}
.jm-collhero[data-tone="night"] .jm-collhero-n{background:rgba(255,255,255,.16);color:#fff;}
.jm-collhero[data-tone="night"] .jm-crumb,
.jm-collhero[data-tone="night"] .jm-crumb button{color:rgba(255,255,255,.6);}
.jm-collhero[data-tone="dawn"]{background:#E4D8C8;}
.jm-collhero[data-tone="dawn"] .jm-collhero-en{color:#B07A3E;}
.jm-collhero[data-tone="dawn"] h2,.jm-collhero[data-tone="plain"] h2{color:var(--tx);}
.jm-collhero[data-tone="dawn"] p,.jm-collhero[data-tone="plain"] p{color:var(--tx2);}
.jm-collhero[data-tone="dawn"] .jm-collhero-n,
.jm-collhero[data-tone="plain"] .jm-collhero-n{background:#fff;color:var(--tx);box-shadow:var(--sh1);}
.jm-collhero[data-tone="plain"]{background:#F2F2F4;}
.jm-collhero[data-tone="plain"] .jm-collhero-en{color:var(--pt);}
.jm-coll-sum{text-align:right;flex-shrink:0;}
.jm-coll-sum span{display:block;font-size:12px;color:var(--tx3);margin-bottom:3px;}
.jm-coll-sum b{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.6px;}

/* \u2500\u2500 \uACE1\uC9D1 \uB2E4\uC911 \uC120\uD0DD \u2500\u2500 */
.jm-sck{width:20px;height:20px;border:1.5px solid var(--ln-i);border-radius:var(--r1);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .14s;}
.jm-sck:hover{border-color:var(--pt);}
.jm-sck[data-on="1"]{background:var(--pt);border-color:var(--pt);}
.jm-booktbl tr[data-on="1"] td{background:var(--pt-tint);}
.jm-selbar{position:sticky;bottom:var(--s3);z-index:30;margin-top:var(--s4);
  background:#fff;border:1px solid var(--pt);border-radius:var(--r3);
  box-shadow:0 12px 34px rgba(20,40,160,.16);animation:jm-selup .22s ease both;}
@keyframes jm-selup{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.jm-selbar-in{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);flex-wrap:wrap;}
.jm-sel-l{flex:1;min-width:200px;}
.jm-sel-l b{display:block;font-size:15px;font-weight:700;color:var(--pt);margin-bottom:3px;}
.jm-sel-l span{display:block;font-size:12px;color:var(--tx3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:340px;}
.jm-sel-q{display:flex;align-items:center;gap:var(--s2);flex-shrink:0;}
.jm-sel-q>span:first-child{font-size:13px;color:var(--tx2);}
.jm-sel-p{text-align:right;flex-shrink:0;}
.jm-sel-p span{display:block;font-size:12px;color:var(--tx3);margin-bottom:2px;}
.jm-sel-p b{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.7px;}
.jm-sel-a{display:flex;gap:6px;flex-shrink:0;}
.jm-sel-a .jm-bt{height:44px;padding:0 20px;flex:none;}
.jm-sel-done{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;
  color:var(--pt);flex-shrink:0;}
.jm-sel-done button{background:none;border:none;font-size:13px;color:var(--tx2);
  text-decoration:underline;text-underline-offset:3px;padding:0;}
.jm-sel-done button:hover{color:var(--pt);}
.jm-sel-note{font-size:12px;color:var(--tx3);margin:0;padding:0 var(--s4) var(--s3);
  border-top:1px solid var(--ln2);padding-top:var(--s3);line-height:1.7;}

/* \uBCA0\uC2A4\uD2B8 \uC9D1\uACC4\uC77C */
.jm-best-upd{display:inline-block;margin-left:9px;padding-left:9px;
  border-left:1px solid var(--ln);color:var(--tx3);font-size:12px;}
/* \uACE1\uC9D1 \uB2E4\uC911 \uC120\uD0DD \u2014 \uACE1\uBCC4 \uBD80\uC218 */
.jm-qty-sm{height:32px;padding:0 3px;}
.jm-qty-sm button{width:26px;height:26px;}
.jm-qty-sm input{width:34px;font-size:13px;}
