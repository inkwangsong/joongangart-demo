.jm-pw-inst button{flex:1;border:1px solid var(--ln);background:#fff;border-radius:var(--r1);
  padding:10px 4px;font-size:12.5px;color:var(--tx2);}
.jm-pw-inst button[data-on="1"]{border-color:var(--pt);background:var(--pt-tint);
  color:var(--pt);font-weight:700;}
.jm-pw-inst button:disabled{opacity:.4;}
.jm-pw-hint{font-size:11.5px;color:var(--tx3);margin:9px 0 0;line-height:1.7;}
.jm-pw-warn{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--warn);
  background:#FDF6EA;border-radius:var(--r1);padding:10px 12px;margin:12px 0 0;line-height:1.7;}
.jm-pw-warn svg{flex-shrink:0;margin-top:2px;}
.jm-pw-f{padding:14px 18px;border-top:1px solid var(--ln);display:flex;gap:7px;flex-shrink:0;}
.jm-pw-go{flex:1;background:var(--pt);color:#fff;border:none;border-radius:var(--r1);
  padding:14px;font-size:14.5px;font-weight:700;}
.jm-pw-go:hover:not(:disabled){background:var(--pt2);}
.jm-pw-go:disabled{background:#C6C6C6;}
.jm-pw-back{background:#fff;border:1px solid var(--ln);border-radius:var(--r1);
  padding:14px 20px;font-size:14px;color:var(--tx2);}
.jm-pw-note{font-size:10.5px;color:var(--tx3);text-align:center;padding:0 0 12px;margin:0;}

/* \u2500\u2500 \uACB0\uC81C \uC2E4\uD328 \u2500\u2500 */
.jm-fail{max-width:520px;margin:var(--s6) auto;text-align:center;}
.jm-fail-ic{width:56px;height:56px;border-radius:50%;background:var(--red-tint,#FAEDF1);
  color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s4);}
.jm-fail h2{font-size:24px;font-weight:750;letter-spacing:-1.2px;margin:0 0 var(--s2);}
.jm-fail-r{font-size:14px;color:var(--red);font-weight:600;margin:0 0 var(--s3);}
.jm-fail-d{font-size:13.5px;color:var(--tx2);line-height:1.9;margin:0 0 var(--s5);}
.jm-fail-a{display:flex;gap:8px;justify-content:center;margin-bottom:var(--s6);}
.jm-fail-a .jm-bt{flex:none;padding:0 26px;}
.jm-fail-help{background:var(--paper);border-radius:var(--r2);padding:18px 20px;text-align:left;}
.jm-fail-help b{display:block;font-size:13px;margin-bottom:9px;}
.jm-fail-help ul{margin:0 0 12px;padding-left:17px;font-size:12.5px;color:var(--tx2);
  line-height:1.9;}
.jm-fail-help p{font-size:12.5px;color:var(--tx2);margin:0;line-height:1.85;}

/* \u2500\u2500 \uC8FC\uBB38 \uB0B4\uC5ED \u2500\u2500 */
.jm-ords{display:flex;flex-direction:column;gap:var(--s3);}
.jm-ord{border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden;background:#fff;}
.jm-ord-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:13px var(--s4);background:var(--paper);border-bottom:1px solid var(--ln);}
.jm-ord-no{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--tx);
  margin-right:9px;}
.jm-ord-h em{font-style:normal;font-size:11.5px;color:var(--tx3);}
.jm-ord-st{font-size:11px;font-weight:700;padding:5px 12px;border-radius:var(--pill);}
.jm-ord-st[data-s="\uACB0\uC81C\uC644\uB8CC"]{background:var(--pt-tint);color:var(--pt);}
.jm-ord-st[data-s="\uC785\uAE08\uB300\uAE30"]{background:#FDF6EA;color:#B5761A;}
.jm-ord-st[data-s="\uD658\uBD88\uC644\uB8CC"]{background:var(--card);color:var(--tx2);}
.jm-ord-b{padding:var(--s3) var(--s4);}
.jm-ord-i{display:flex;align-items:center;gap:12px;padding:9px 0;}
.jm-ord-cv{flex-shrink:0;line-height:0;}
.jm-ord-cv svg{border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.14);}
.jm-ord-tx{flex:1;min-width:0;}
.jm-ord-tx b{display:block;font-size:13.5px;font-weight:600;color:var(--tx);}
.jm-ord-tx em{display:block;font-style:normal;font-size:11.5px;color:var(--tx3);margin-top:2px;}
.jm-ord-q{font-size:12.5px;color:var(--tx2);flex-shrink:0;}
.jm-ord-p{font-size:13.5px;font-weight:700;color:var(--tx);flex-shrink:0;width:88px;
  text-align:right;}
.jm-ord-f{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
  padding:var(--s3) var(--s4);border-top:1px solid var(--ln2);flex-wrap:wrap;}
.jm-ord-pay{margin:0;display:flex;gap:var(--s5);flex-wrap:wrap;}
.jm-ord-pay div{display:flex;flex-direction:column;gap:2px;}
.jm-ord-pay dt{font-size:11px;color:var(--tx3);margin:0;}
.jm-ord-pay dd{font-size:12.5px;color:var(--tx);margin:0;}
.jm-ord-pay dd b{font-size:15px;font-weight:700;}
.jm-ord-a{display:flex;gap:6px;flex-shrink:0;}
.jm-ord-a .jm-bt{flex:none;}
.jm-ord-note{font-size:11.5px;color:var(--tx2);background:var(--paper);margin:0;
  padding:12px var(--s4);border-top:1px solid var(--ln2);line-height:1.8;}
.jm-ord-note[data-k="warn"]{background:#FDF6EA;color:#7A5A18;}

/* \u2500\u2500 \uD658\uBD88 \uC694\uCCAD \u2500\u2500 */
.jm-rf{background:#fff;border-radius:var(--r3);width:100%;max-width:440px;overflow:hidden;
  display:flex;flex-direction:column;max-height:88vh;}
.jm-rf-h{padding:var(--s4);border-bottom:1px solid var(--ln);display:flex;
  align-items:center;justify-content:space-between;}
.jm-rf-h b{font-size:17px;font-weight:700;letter-spacing:-.4px;}
.jm-rf-h button{background:none;border:none;color:var(--tx3);display:flex;padding:4px;
  border-radius:50%;}
.jm-rf-h button:hover{background:var(--paper);color:var(--tx);}
.jm-rf-b{padding:var(--s4);overflow-y:auto;}
.jm-rf-box{background:var(--pt-tint);border-radius:var(--r2);padding:14px 16px;
  margin-bottom:var(--s4);}
.jm-rf-box b{display:block;font-size:13px;color:var(--pt);margin-bottom:6px;}
.jm-rf-box p{font-size:12.5px;color:var(--tx2);line-height:1.85;margin:0;}
.jm-rf-spec{margin:0 0 var(--s3);border:1px solid var(--ln);border-radius:var(--r2);
  overflow:hidden;}
.jm-rf-spec div{display:flex;justify-content:space-between;gap:var(--s3);padding:11px 16px;
  border-bottom:1px solid var(--ln2);font-size:12.5px;}
.jm-rf-spec div:last-child{border-bottom:0;}
.jm-rf-spec dt{color:var(--tx3);margin:0;}
.jm-rf-spec dd{color:var(--tx);margin:0;font-weight:500;}
.jm-rf-spec dd b{font-size:15px;font-weight:700;}
.jm-rf-note{font-size:11.5px;color:var(--tx3);line-height:1.8;margin:0;}
.jm-rf-f{padding:var(--s3) var(--s4);border-top:1px solid var(--ln);display:flex;
  justify-content:flex-end;gap:7px;}
.jm-rf-f .jm-bt{flex:none;padding:0 22px;}
.jm-bt-d{border-color:var(--red) !important;color:var(--red) !important;}
.jm-bt-d:hover{background:var(--red) !important;color:#fff !important;}

.jm-pt{font-size:clamp(26px,3.4vw,38px);font-weight:750;letter-spacing:-1.8px;
  margin:0 0 var(--s2);line-height:1.15;}
.jm-psub{font-size:14px;color:var(--tx2);margin:0 0 var(--s5);line-height:1.85;}


/* \u2500\u2500 \uC800\uC791\uAD8C \uACE0\uC9C0 (\uC8FC\uBB38\uC11C) \u2500\u2500
   \uC57D\uAD00 \uBAA9\uB85D\uC5D0 \uBB3B\uD788\uC9C0 \uC54A\uB3C4\uB85D \uB3C5\uB9BD\uB41C \uBE14\uB85D\uC73C\uB85C \uB461\uB2C8\uB2E4.
   \uD615\uC0AC \uCC98\uBC8C \uAC00\uB2A5\uC131\uAE4C\uC9C0 \uBA85\uC2DC\uD558\uB294 \uAC83\uC774 \uC774 \uACE0\uC9C0\uC758 \uBAA9\uC801\uC785\uB2C8\uB2E4. */
.jm-copy{border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden;
  margin-top:var(--s5);background:#fff;}
.jm-copy-b{display:flex;gap:var(--s4);padding:var(--s4);align-items:flex-start;}
.jm-copy-ic{width:46px;height:46px;border-radius:var(--r2);background:var(--pt-tint);
  color:var(--pt);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.jm-copy-tx{flex:1;min-width:0;}
.jm-copy-tx p{font-size:13px;color:var(--tx2);line-height:1.9;margin:0 0 8px;}
.jm-copy-tx p:last-child{margin-bottom:0;}
.jm-copy-tx b{color:var(--tx);font-weight:600;}
.jm-copy-mark{padding-top:9px;border-top:1px dashed var(--ln);margin-top:11px !important;
  font-size:12.5px !important;color:var(--tx3) !important;}
.jm-copy-mark b{color:var(--pt) !important;}
.jm-copy-ck{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:14px;
  padding:14px var(--s4);border:none;border-top:1px solid var(--ln2);background:var(--paper);
  font-size:13.5px;color:var(--tx2);transition:background .16s;}
.jm-copy-ck:hover{background:var(--pt-tint);}
.jm-copy-ck em{font-style:normal;font-size:12px;color:var(--pt);font-weight:600;}
.jm-copy-ck i{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln-i);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  transition:background .16s,border-color .16s;}
.jm-copy-ck:hover i{border-color:var(--pt);}
.jm-copy-ck[data-on="1"]{background:var(--pt-tint);color:var(--tx);font-weight:600;}
.jm-copy-ck[data-on="1"] i{background:var(--pt);border-color:var(--pt);}


/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   \uC881\uC740 \uD654\uBA74 \uB300\uC751

   \uC545\uBCF4\uB294 \uACB0\uAD6D PC\uC5D0\uC11C \uC778\uC1C4\uD558\uB294 \uBD84\uC774 \uB9CE\uC9C0\uB9CC, \uB458\uB7EC\uBCF4\uACE0 \uB2F4\uB294 \uC77C\uC740
   \uD734\uB300\uD3F0\uC73C\uB85C \uD558\uB294 \uBD84\uC774 \uB9CE\uC2B5\uB2C8\uB2E4. \uADF8\uB798\uC11C "\uAD6C\uACBD\uD558\uACE0 \uACE0\uB974\uB294" \uD654\uBA74\uC744
   \uBA3C\uC800 \uB9DE\uCD94\uACE0, \uD45C\uAC00 \uB9CE\uC740 \uD654\uBA74\uC740 \uCE74\uB4DC\uB85C \uBC14\uAFC9\uB2C8\uB2E4.

   \uB04A\uB294 \uC9C0\uC810
     1100px  2\uB2E8 \u2192 1\uB2E8 (\uC0C1\uC138\xB7\uACE1\uC9D1\xB7\uD788\uC5B4\uB85C)
      860px  4\uC5F4 \u2192 2\uC5F4, \uD478\uD130 \uC138\uB85C\uB85C
      640px  \uD734\uB300\uD3F0. \uD45C\uB97C \uCE74\uB4DC\uB85C, \uD5E4\uB354 \uD55C \uC904\uB85C
   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

/* \uC5B4\uB290 \uD3ED\uC5D0\uC11C\uB3C4 \uAC00\uB85C\uB85C \uC090\uC838\uB098\uAC00\uC9C0 \uC54A\uAC8C \uD558\uB294 \uC548\uC804\uC7A5\uCE58 */
.jm{overflow-x:hidden;}
.jm img,.jm svg{max-width:100%;}

@media (max-width:1100px){
  /* \uC545\uBCF4 \uC774\uBBF8\uC9C0\uC640 \uC124\uBA85\uC744 \uC704\uC544\uB798\uB85C */
  .jm-dt{grid-template-columns:1fr;gap:var(--s5);}
  .jm-dt-img{max-width:420px;margin:0 auto;}
  .jm-dt-pv{max-width:420px;margin-left:auto;margin-right:auto;}
  .jm-hero-in{grid-template-columns:1fr;gap:var(--s4);}
  .jm-bookhero-in{grid-template-columns:1fr;justify-items:start;gap:var(--s4);}
  .jm-st{grid-template-columns:1fr;gap:var(--s4);}
  .jm-books{grid-template-columns:repeat(3,1fr);}
  .jm-colls{grid-template-columns:repeat(2,1fr);}
  .jm-mega-cols{grid-template-columns:repeat(3,1fr);gap:16px;}

  .jm-pv-body{grid-template-columns:1fr;}

  /* \uD478\uD130 4\uCE78\uC740 1100px\uBD80\uD130 \uC774\uBBF8 \uC881\uC2B5\uB2C8\uB2E4. 2\uCE78\uC529 \uB450 \uC904\uB85C. */

  .jm-ft-col:nth-child(2n){border-right:0;padding-right:0;}
  .jm-ft-col:nth-child(-n+2){border-bottom:1px solid var(--ln2);padding-bottom:24px;}
  .jm-ft-col:nth-child(n+3){padding-top:24px;}
}

@media (max-width:860px){
  .jm-grid{grid-template-columns:repeat(2,1fr);gap:var(--s4) var(--s3);}
  .jm-books{grid-template-columns:repeat(2,1fr);}
  .jm-colls{grid-template-columns:1fr;}
  .jm-steps3{grid-template-columns:1fr;}
  .jm-facts{grid-template-columns:repeat(3,1fr);gap:6px;}

  .jm-mega-cols{grid-template-columns:repeat(2,1fr);}
  .jm-pick-g{grid-template-columns:repeat(2,1fr);}

  /* \uD478\uD130 \u2014 4\uCE78\uC744 \uC138\uB85C\uB85C \uC313\uACE0 \uCE78 \uC0AC\uC774 \uC120\uC744 \uAC00\uB85C\uC120\uC73C\uB85C */
  .jm-ft-in{grid-template-columns:1fr;padding:34px var(--pad) 30px;}
  .jm-ft-col{padding:22px 0;border-right:0;border-bottom:1px solid var(--ln2);}

  .jm-ft-col:last-child{border-bottom:0;padding-bottom:0;}
  .jm-cs{font-size:24px;}

@media (max-width:640px){
  /* \uC88C\uC6B0 \uC5EC\uBC31\uC744 16px\uB85C \uC904\uC5EC \uD654\uBA74\uC744 \uB113\uAC8C \uC501\uB2C8\uB2E4 */
  :root,.jm{--pad:16px;}

  /* \uC0C1\uB2E8 \uC720\uD2F8\uBC14 \u2014 \uC11C\uBE44\uC2A4 \uD0ED\uB9CC \uB0A8\uAE30\uACE0 \uC6B0\uCE21 \uB9C1\uD06C\uB294 \uC228\uAE41\uB2C8\uB2E4.
     \uAC19\uC740 \uAE30\uB2A5\uC774 \uD5E4\uB354 \uC544\uC774\uCF58\uACFC \uD478\uD130\uC5D0 \uC788\uC2B5\uB2C8\uB2E4. */
  .jm-svc-r{display:none;}
  .jm-svc-t button{padding:0 12px;font-size:11.5px;}

  /* \uD5E4\uB354 \u2014 \uB85C\uACE0\uC640 \uC544\uC774\uCF58\uB9CC \uD55C \uC904, \uAC80\uC0C9\uC740 \uADF8 \uC544\uB798 \uC904\uB85C \uB0B4\uB9BD\uB2C8\uB2E4 */
  .jm-hd-in{height:auto;padding:12px var(--pad);flex-wrap:wrap;gap:10px;}
  .jm-hd[data-shrink="1"] .jm-hd-in{height:auto;}
  .jm-lg-tx b{font-size:17px;}
  .jm-srchwrap{order:3;flex-basis:100%;max-width:none;}
  .jm-hd-div{display:none;}

  .jm-gnb{height:46px;gap:0;}
  .jm-gnb button{padding:8px 11px;font-size:13.5px;}

  /* \uD788\uC5B4\uB85C \u2014 \uAE00\uC790\uB97C \uC904\uC774\uACE0 \uC7A5\uC2DD \uB3C4\uD615\uC740 \uBE8D\uB2C8\uB2E4 */
  .jm-hero-in{padding:var(--s5) var(--pad) var(--s6);}
  .jm-hero-art{display:none;}
  .jm-hero h2,.jm-hero-t{font-size:clamp(24px,7vw,32px);letter-spacing:-1px;}
  .jm-hero-ctl{position:static;padding:0 var(--pad) var(--s4);}
  .jm-hero-cta{align-self:stretch;justify-content:center;}

  /* \uC0C1\uD488 \uADF8\uB9AC\uB4DC\uB294 2\uC5F4 \uC720\uC9C0 \u2014 1\uC5F4\uB85C \uB9CC\uB4E4\uBA74 \uD45C\uC9C0\uAC00 \uC9C0\uB098\uCE58\uAC8C \uCEE4\uC9D1\uB2C8\uB2E4 */
  .jm-grid{gap:var(--s4) 10px;}
  /* 1\uC5F4\uB85C \uC138\uC6B0\uBA74 6\uAC1C\uAC00 \uD654\uBA74 \uD55C \uC7A5\uC744 \uB2E4 \uBA39\uC2B5\uB2C8\uB2E4 */
  .jm-facts{grid-template-columns:repeat(2,1fr);}
  .jm-pick-g{grid-template-columns:1fr;}
  .jm-pw-cards{grid-template-columns:repeat(2,1fr);}
  .jm-st-spec{grid-template-columns:1fr;}
  .jm-books,.jm-mega-cols{grid-template-columns:1fr;}

  /* \uD45C \u2192 \uCE74\uB4DC
     \uC881\uC740 \uD654\uBA74\uC5D0\uC11C \uD45C\uB97C \uAC00\uB85C\uB85C \uBC00\uBA74 \uD5E4\uB354\uAC00 \uC0AC\uB77C\uC838 \uBB34\uC2A8 \uAC12\uC778\uC9C0 \uC54C \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.
     \uD589 \uD558\uB098\uB97C \uCE74\uB4DC \uD558\uB098\uB85C \uC138\uC6B0\uACE0, \uAC01 \uCE78 \uC55E\uC5D0 \uC81C\uBAA9\uC744 \uBD99\uC785\uB2C8\uB2E4. */
  .jm-otb,.jm-otb tbody,.jm-otb tr,.jm-otb td{display:block;width:100%;}
  .jm-otb thead{display:none;}
  .jm-otb tr{border:1px solid var(--ln);border-radius:var(--r2);
    margin-bottom:10px;padding:4px 14px 12px;background:#fff;}
  .jm-otb td{border:0;padding:8px 0;text-align:left !important;
    display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .jm-otb td::before{content:attr(data-th);flex-shrink:0;
    font-size:11.5px;color:var(--tx3);font-weight:600;}
  .jm-otb td:not([data-th])::before{display:none;}
  .jm-otb td[data-th="\uC0C1\uD488\uC815\uBCF4"]{display:block;padding-top:12px;}
  .jm-otb td[data-th="\uC0C1\uD488\uC815\uBCF4"]::before{display:block;margin-bottom:7px;}

  /* \uBAA8\uB2EC\xB7\uACB0\uC81C\uCC3D\uC744 \uD654\uBA74 \uC544\uB798\uC5D0\uC11C \uC62C\uB77C\uC624\uB294 \uC2DC\uD2B8\uB85C */
  .jm-veil,.jm-pwveil{align-items:flex-end;justify-content:stretch;padding:0;}
  .jm-md,.jm-pw{max-width:none;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;}
  .jm-md-acts{flex-direction:column-reverse;}

  .jm-crumb{justify-content:flex-start;margin-bottom:22px;}
  .jm-ttl h2{font-size:24px;}
  .jm-coll{height:180px;}
  .jm-ord-h{flex-wrap:wrap;}

  /* \uD569\uACC4 \u2014 \uC881\uC740 \uD3ED\uC5D0\uC11C\uB294 \uC124\uBA85\uACFC \uAE08\uC561\uC744 \uC704\uC544\uB798\uB85C */
  .jm-sum{flex-direction:column;align-items:flex-start;gap:6px;padding:16px 14px;}
  .jm-sum span{display:flex;flex-direction:column;gap:3px;}
  .jm-sum b{font-size:26px;align-self:flex-end;}
  /* \uACC4\uC18D \uC1FC\uD551\uD558\uAE30 / \uC8FC\uBB38\uD558\uAE30 \u2014 \uCD5C\uC18C\uD3ED 180px\uC774\uB77C \uB450 \uAC1C\uAC00 \uD55C \uC904\uC5D0 \uC548 \uB4E4\uC5B4\uAC11\uB2C8\uB2E4 */
  .jm-mid{flex-direction:column;gap:8px;margin-top:22px;}
  .jm-mid .jm-bt{min-width:0;width:100%;}

  /* \uC139\uC158 \uC81C\uBAA9\uACFC \uD0ED\uC744 \uD55C \uC904\uC5D0 \uB450\uBA74 \uD0ED\uC774 \uD3ED\uC744 \uB2E4 \uAC00\uC838\uAC00
     \uC81C\uBAA9\uC774 \uD55C \uAE00\uC790\uC529 \uC138\uB85C\uB85C \uCABC\uAC1C\uC9D1\uB2C8\uB2E4. \uC704\uC544\uB798\uB85C \uB098\uB215\uB2C8\uB2E4. */
  .jm-sect{flex-direction:column;align-items:stretch;gap:var(--s3);}
  .jm-sect h3{font-size:19px;letter-spacing:-.8px;}
  .jm-sect-l{align-items:center;}

  /* \uD0ED\uC774 \uD55C \uC904\uC5D0 \uB2E4 \uC548 \uB4E4\uC5B4\uAC00\uBA74 \uC606\uC73C\uB85C \uBC00\uC5B4 \uBCFC \uC218 \uC788\uAC8C \uD569\uB2C8\uB2E4.
     \uC2A4\uD06C\uB864\uBC14\uB294 \uC228\uAE30\uACE0, \uC798\uB9B0 \uB290\uB08C\uC774 \uB098\uB3C4\uB85D \uC624\uB978\uCABD \uC5EC\uBC31\uC744 \uB461\uB2C8\uB2E4. */
  .jm-best-tabs,.jm-ntabs{overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding-right:var(--pad);}
  .jm-best-tabs::-webkit-scrollbar,.jm-ntabs::-webkit-scrollbar,
  .jm-gnb::-webkit-scrollbar{display:none;}
  .jm-gnb{scrollbar-width:none;}
  .jm-best-tabs button,.jm-ntabs button{flex-shrink:0;}

  /* \uD478\uD130 '\uC811\uAE30'\uB294 \uB9C8\uC9C0\uB9C9 \uCE78 \uAE30\uC900\uC73C\uB85C \uB5A0 \uC788\uC5B4 \uC138\uB85C\uB85C \uC313\uC73C\uBA74 \uC790\uB9AC\uB97C \uC783\uC2B5\uB2C8\uB2E4 */
  .jm-ft-up{position:static;margin-top:14px;}
}
