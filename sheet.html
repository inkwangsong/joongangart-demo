@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap');

.jm{
  /* \u2500\u2500 color \u2500\u2500 */
  /* B3 \u2014 CI \uBE14\uB8E8 + \uC560\uC2DC\uB4DC \uB77C\uC784 \xB7 60 \uC624\uD504\uD654\uC774\uD2B8 / 30 \uBE14\uB8E8 / 10 \uB77C\uC784 */
  --ink:#12292D;--tx:#12292D;--tx2:#4C6165;--tx3:#667577;--ln:#E0E5E6;--ln2:#EEF2F2;--ln-i:#7C8B8D;--warn:#B5761A;
  --teal:#1E4A50;--teal2:#163A3F;--teal-tint:#EAF1F2;
  --pt:#203BA1;--pt2:#16297C;--pt-tint:#EEF0FA;--pt-deep:#131E52;
  --lime:#C7F04A;--lime-soft:#F3FAE0;
  /* \uCE74\uBBFC \uBC84\uAC74\uB514 \u2014 \uAE4A\uC740 \uC790\uC8FC. \uBC1D\uC740 \uBA74 \uC704 \uAE00\uC790 \xB7 \uC9D9\uC740 \uBA74\uC73C\uB85C\uB3C4 \uC0AC\uC6A9 */
  --red:#8A1F3D;--red2:#6E1730;--red-tint:#FAEDF1;--rd:#8A1F3D;
  --paper:#F9FBFB;--paper2:#FCFDFD;--card:#F1F4F4;
  /* \u2500\u2500 radius \u2500\u2500 */
  --r1:6px;--r2:10px;--r3:14px;--r4:20px;--pill:999px;
  /* \u2500\u2500 shadow \u2500\u2500 */
  --sh1:0 1px 2px rgba(18,41,45,.06),0 4px 14px rgba(18,41,45,.06);--sh2:0 2px 6px rgba(18,41,45,.06),0 18px 40px rgba(18,41,45,.12);
  /* \u2500\u2500 type \u2500\u2500 */
  --t-display:clamp(34px,4.6vw,58px);--t-h1:clamp(24px,2.8vw,36px);--t-h2:20px;
  --t-body:15px;--t-sm:13px;--t-xs:12px;
  --serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* \u2500\u2500 space \u2500\u2500 */
  --s1:4px;--s2:8px;--s3:14px;--s4:22px;--s5:34px;--s6:52px;--s7:78px;--s8:112px;
  --pad:clamp(24px,5vw,64px);
  font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',
    -apple-system,'Apple SD Gothic Neo',sans-serif;
  color:var(--tx);background:#fff;font-size:var(--t-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;letter-spacing:-.2px;}
.jm *,.jm *::before,.jm *::after{box-sizing:border-box;}
.jm button{font-family:inherit;cursor:pointer;}
/* \uD0A4\uBCF4\uB4DC \uD3EC\uCEE4\uC2A4 \u2014 \uBC1D\uC740 \uBA74\uC5D0\uC11C\uB294 CI \uBE14\uB8E8, \uC9D9\uC740 \uBA74\uC5D0\uC11C\uB294 \uB77C\uC784.
   \uD55C \uAC00\uC9C0 \uC0C9\uB9CC \uC4F0\uBA74 \uD30C\uB780 \uBC30\uB108 \uC704\uC5D0\uC11C \uB9C1\uC774 \uBCF4\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. */
.jm :focus-visible{outline:2px solid var(--pt);outline-offset:2px;border-radius:var(--r1);}
.jm-hero :focus-visible,.jm-svc :focus-visible,.jm-up[data-tone] :focus-visible,
.jm-coll :focus-visible,.jm-cathero[data-dark="1"] :focus-visible,
.jm-pw-h :focus-visible{outline-color:var(--lime);}
.jm-w{max-width:1200px;margin:0 auto;padding:0 var(--pad);}

/* \u2500\u2500 \uBE0C\uB79C\uB4DC \uBC14 (CI \uBE14\uB8E8) \u2500\u2500 */
.jm-svc{background:var(--pt);overflow:hidden;max-height:38px;
  transition:max-height .26s cubic-bezier(.2,.7,.2,1),opacity .2s;}
.jm-hd[data-shrink="1"] .jm-svc{max-height:0;opacity:0;}
.jm-svc-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:38px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.jm-svc-t{display:flex;align-items:stretch;height:38px;}
.jm-svc-t button,.jm-svc-t a{background:none;border:none;padding:0 17px;font-size:13px;
  color:rgba(255,255,255,.72);white-space:nowrap;position:relative;transition:color .16s;}
.jm-svc-t button:hover,.jm-svc-t a:hover{color:#fff;}
.jm-svc-t a{display:flex;align-items:center;text-decoration:none;}
.jm-svc-t button[data-on="1"]{color:var(--lime);font-weight:700;}
.jm-svc-t button[data-on="1"]::after{content:'';position:absolute;left:17px;right:17px;
  bottom:0;height:2px;background:var(--lime);}
.jm-svc-r{display:flex;align-items:center;gap:var(--s2);font-size:12px;
  color:rgba(255,255,255,.45);}
/* \uC790\uC8FC \uC4F0\uB294 \uC774\uB3D9 \uB9C1\uD06C\uC785\uB2C8\uB2E4. \uAE00\uC790 \uB192\uC774(15px)\uB9CC\uD07C\uB9CC \uB20C\uB9AC\uBA74 \uBE57\uB098\uAC00\uAE30 \uC26C\uC6CC
   \uC904 \uC804\uCCB4 \uB192\uC774\uB97C \uB204\uB97C \uC218 \uC788\uAC8C \uD569\uB2C8\uB2E4. \uAE00\uC790 \uD06C\uAE30\uB294 \uADF8\uB300\uB85C\uC785\uB2C8\uB2E4. */
.jm-svc-r button{background:none;border:none;font-size:12px;
  color:rgba(255,255,255,.88);padding:0 7px;height:38px;
  display:flex;align-items:center;white-space:nowrap;}
.jm-svc-r button:hover{color:#fff;}

.jm-link{background:none;border:none;padding:0;font:inherit;color:var(--tx2);
  text-decoration:underline;text-underline-offset:3px;}
.jm-link:hover{color:var(--pt);}

/* \u2500\u2500 \uBCF8 \uD5E4\uB354 \u2500\u2500 */
.jm-hd{background:#fff;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--ln);}
html,body{overflow-anchor:none;}
.jm-hd-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:80px;
  display:flex;align-items:center;gap:var(--s5);
  transition:height .26s cubic-bezier(.2,.7,.2,1);}
.jm-hd[data-shrink="1"] .jm-hd-in{height:62px;}
.jm-hd[data-shrink="1"]{box-shadow:0 2px 12px rgba(18,41,45,.07);}

/* \uB85C\uACE0 */
.jm-lg{background:none;border:none;padding:0;display:flex;align-items:center;gap:12px;
  flex-shrink:0;}
.jm-lg-tx{text-align:left;line-height:1.1;}
.jm-lg-tx b{display:block;font-size:20px;font-weight:750;letter-spacing:-1px;color:var(--tx);
  transition:font-size .26s;}
.jm-lg-tx em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--tx3);letter-spacing:1.4px;margin-top:3px;overflow:hidden;
  transition:max-height .26s,opacity .2s,margin-top .26s;max-height:14px;}
.jm-hd[data-shrink="1"] .jm-lg-tx b{font-size:17px;}
.jm-hd[data-shrink="1"] .jm-lg-tx em{max-height:0;opacity:0;margin-top:0;}

/* \uAC80\uC0C9 */
.jm-hd[data-shrink="1"] .jm-srch{height:42px;}
.jm-srch-sc{position:relative;flex-shrink:0;}
.jm-srch-sc>button{height:100%;background:none;border:none;padding:0 14px 0 20px;
  display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);
  white-space:nowrap;border-radius:24px 0 0 24px;}
.jm-srch-sc>button:hover{color:var(--pt);}
.jm-srch-sc::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:1px;height:18px;background:var(--ln);}
.jm-srch-menu{position:absolute;top:calc(100% + 10px);left:8px;min-width:150px;
  background:#fff;border:1px solid var(--ln);border-radius:var(--r2);box-shadow:var(--sh2);
  list-style:none;margin:0;padding:6px;z-index:50;}
.jm-srch-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:none;border:none;padding:9px 12px;font-size:13px;color:var(--tx2);
  border-radius:var(--r1);text-align:left;}
.jm-srch-menu button:hover{background:var(--paper);color:var(--tx);}
.jm-srch-menu button[data-on="1"]{color:var(--pt);font-weight:700;background:var(--pt-tint);}
.jm-srch input{flex:1;border:none;outline:none;background:none;padding:0 14px;
  font-size:15px;font-family:inherit;color:var(--tx);cursor:pointer;min-width:0;}
.jm-srch input::placeholder{color:var(--tx3);}
.jm-srch-go{flex-shrink:0;width:50px;background:none;border:none;display:flex;
  align-items:center;justify-content:center;color:var(--pt);
  border-radius:0 24px 24px 0;}
.jm-srch-go:hover{background:var(--pt-tint);}

/* \uAE30\uB2A5 */
.jm-hd-ac{display:flex;align-items:center;gap:var(--s1);flex-shrink:0;}
.jm-hd-ic{width:40px;height:40px;background:none;border:none;border-radius:50%;
  position:relative;display:flex;align-items:center;justify-content:center;color:var(--tx2);
  transition:background .16s,color .16s;}
.jm-hd-ic:hover{background:var(--paper);color:var(--pt);}
.jm-hd-ic em{position:absolute;top:2px;right:1px;font-style:normal;background:var(--red);
  color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;
  border-radius:var(--pill);display:flex;align-items:center;justify-content:center;padding:0 5px;}
.jm-hd-login{background:var(--pt);color:#fff;border:none;font-size:14px;font-weight:600;
  padding:11px 20px;border-radius:var(--pill);margin-left:var(--s2);transition:background .16s;}
.jm-hd-login:hover{background:var(--pt2);}
.jm-hd-me{display:flex;align-items:center;gap:var(--s2);margin-left:var(--s2);}
.jm-hd-me span{font-size:13px;color:var(--tx);font-weight:600;white-space:nowrap;}
.jm-hd-out{background:none;border:1px solid var(--ln);color:var(--tx2);font-size:12px;
  padding:8px 14px;border-radius:var(--pill);white-space:nowrap;}
.jm-hd-out:hover{border-color:var(--pt);color:var(--pt);}

/* 2\uB2E8 \uBD84\uB958 */
.jm-hd-r2{border-top:1px solid var(--ln2);overflow:hidden;max-height:50px;
  transition:max-height .26s cubic-bezier(.2,.7,.2,1),opacity .2s;}
.jm-hd[data-shrink="1"] .jm-hd-r2{max-height:0;opacity:0;border-top-color:transparent;}
.jm-gnb{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:50px;
  display:flex;align-items:center;gap:2px;overflow-x:auto;}
.jm-gnb button{background:none;border:none;padding:8px 14px;font-size:15px;color:var(--tx2);
  white-space:nowrap;border-radius:var(--pill);font-weight:500;letter-spacing:-.3px;
  transition:background .16s,color .16s;}
.jm-gnb button:hover{background:var(--paper);color:var(--tx);}
.jm-gnb button[data-on="1"]{background:var(--pt-tint);color:var(--pt);font-weight:700;}
.jm-bg{display:flex;align-items:center;gap:7px;font-weight:700 !important;color:var(--tx) !important;}
.jm-bg[data-on="1"]{background:var(--pt) !important;color:#fff !important;}
.jm-hd-div{width:1px;height:16px;background:var(--ln);flex-shrink:0;margin:0 8px;}
.jm-gnb-sp{flex:1;}
.jm-gnb a.jm-gnb-a{display:flex;align-items:center;padding:8px 14px;font-size:15px;color:var(--tx2);text-decoration:none;border-radius:var(--r2);white-space:nowrap;}
.jm-gnb a.jm-gnb-a:hover{background:var(--paper);color:var(--tx);}
.jm-gnb-new{font-style:normal;margin-left:5px;padding:1px 5px;border-radius:999px;background:var(--lime,#C7F04A);color:#12292D;
  font-size:10px;font-weight:700;letter-spacing:.02em;vertical-align:1px;}
/* SNB \u2014 \uBD84\uB958 \uD654\uBA74 \uC548\uC758 \uD558\uC704 \uD0ED */
.jm-snb{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s4);padding-bottom:var(--s4);border-bottom:1px solid var(--ln2);}
.jm-snb button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--card);
  color:var(--tx2);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;}
.jm-snb button i{font-style:normal;color:var(--tx3);font-size:12px;margin-left:3px;font-variant-numeric:tabular-nums;}
.jm-snb button:hover{border-color:var(--tx3);color:var(--tx);}
.jm-snb button[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;font-weight:700;}
.jm-snb button[data-on="1"] i{color:rgba(255,255,255,.75);}
@media (max-width:640px){
  .jm-snb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad);}
  .jm-snb::-webkit-scrollbar{display:none;}
}

@media (prefers-reduced-motion:reduce){
  .jm-svc,.jm-hd-in,.jm-hd-r2,.jm-srch,.jm-lg-tx b,.jm-lg-tx em,
  .jm-srch-panel,.jm-srch-inner,.jm-srch-box{transition:none;}
  .jm-srch-veil{animation:none;}
}


/* \u2500\u2500 \uAC80\uC0C9 \uD328\uB110 \u2500\u2500
   \uC790\uB9AC(jm-srchwrap)\uB294 \uAC80\uC0C9\uCC3D \uB192\uC774\uB9CC \uCC28\uC9C0\uD558\uACE0,
   \uD14C\uB450\uB9AC\uB97C \uC9C0\uB2CC \uBC15\uC2A4(jm-srch-box)\uAC00 \uADF8 \uC704\uC5D0 \uB5A0\uC11C \uC544\uB798\uB85C \uD3BC\uCCD0\uC9D1\uB2C8\uB2E4.
   \uC774\uB807\uAC8C \uD574\uC57C \uD328\uB110\uC774 \uC5F4\uB824\uB3C4 \uD5E4\uB354 \uB192\uC774\uAC00 \uBCC0\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \u2500\u2500 */
.jm-srchwrap{flex:1;max-width:600px;position:relative;height:44px;
  transition:height .26s;}
.jm-hd[data-shrink="1"] .jm-srchwrap{height:38px;}
.jm-srchwrap[data-open="1"]{height:44px;transition:none;}
.jm-srch-box{position:absolute;top:0;left:0;right:0;z-index:52;
  border:2px solid var(--pt);border-radius:var(--r4);background:#fff;
  box-shadow:0 0 0 rgba(18,41,45,0);
  transition:border-radius .28s cubic-bezier(.2,.75,.25,1),
    box-shadow .3s ease;}
.jm-srchwrap[data-open="1"] .jm-srch-box{border-radius:26px 26px 20px 20px;
  box-shadow:0 18px 40px rgba(18,41,45,.16);}
.jm-srch{display:flex;align-items:stretch;height:40px;background:none;}
.jm-hd[data-shrink="1"] .jm-srch{height:34px;}
.jm-srchwrap[data-open="1"] .jm-srch{height:40px;}
.jm-srch-x{flex-shrink:0;width:34px;background:none;border:none;display:flex;
  align-items:center;justify-content:center;color:var(--tx3);}
.jm-srch-x:hover{color:var(--tx);}
.jm-srch input{cursor:text;}

.jm-srch-veil{position:fixed;inset:0;z-index:51;background:rgba(11,11,12,.18);
  animation:jm-veil .26s ease both;}
@keyframes jm-veil{from{opacity:0;}to{opacity:1;}}
/* \uD328\uB110\uC740 \uD56D\uC0C1 \uC790\uB9AC\uC5D0 \uB450\uACE0 \uB192\uC774\uB85C \uC5EC\uB2EB\uC2B5\uB2C8\uB2E4 \u2014 \uADF8\uB798\uC57C \uBD80\uB4DC\uB7FD\uAC8C \uD3BC\uCCD0\uC9D1\uB2C8\uB2E4 */
.jm-srch-panel{max-height:0;overflow:hidden;border-radius:0 0 18px 18px;
  visibility:hidden;pointer-events:none;
  transition:max-height .3s cubic-bezier(.2,.75,.25,1),visibility 0s .3s;}
.jm-srch-panel[data-open="1"]{max-height:66vh;overflow-y:auto;
  visibility:visible;pointer-events:auto;transition:max-height .3s cubic-bezier(.2,.75,.25,1);}
.jm-srch-inner{border-top:1px solid var(--ln2);padding:var(--s4) var(--s4) 0;
  opacity:0;transform:translateY(-6px);
  transition:opacity .22s ease .06s,transform .28s cubic-bezier(.2,.75,.25,1) .04s;}
.jm-srch-panel[data-open="1"] .jm-srch-inner{opacity:1;transform:none;}
.jm-sp-h{display:block;font-size:13px;font-weight:700;color:var(--tx);margin-bottom:12px;}

/* \uCD94\uCC9C \uAC80\uC0C9\uC5B4 */
.jm-sp-sug{padding-bottom:var(--s4);border-bottom:1px solid var(--ln2);}
.jm-sp-sug div{display:flex;gap:6px;flex-wrap:wrap;}
.jm-sp-sug button{background:var(--paper);border:1px solid var(--ln);border-radius:var(--pill);
  padding:8px 15px;font-size:13px;color:var(--tx2);}
.jm-sp-sug button:hover{background:var(--pt-tint);border-color:var(--pt);color:var(--pt);}

/* 3\uB2E8 */
.jm-sp-cols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:var(--s4);
  padding:var(--s4) 0;}
.jm-sp-col{min-width:0;}
.jm-sp-ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin-bottom:11px;}
.jm-sp-ch b{font-size:13px;font-weight:700;color:var(--tx);}
.jm-sp-ch span{font-size:11px;color:var(--tx3);}
.jm-sp-ch button{background:none;border:none;font-size:12px;color:var(--tx3);padding:0;}
.jm-sp-ch button:hover{color:var(--red);}
.jm-sp-empty{font-size:12px;color:var(--tx3);margin:0;padding:8px 0;}

.jm-sp-rec{display:flex;align-items:center;gap:8px;}
.jm-sp-rec>button:first-child{flex:1;background:none;border:none;text-align:left;
  font-size:13px;color:var(--tx2);padding:7px 0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.jm-sp-rec>button:first-child:hover{color:var(--pt);}
.jm-sp-rec>button:last-child{background:none;border:none;color:var(--tx3);display:flex;
  padding:4px;border-radius:50%;flex-shrink:0;}
.jm-sp-rec>button:last-child:hover{background:var(--paper);color:var(--red);}

.jm-sp-hit{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  padding:7px 6px;border-radius:var(--r1);text-align:left;}
.jm-sp-hit:hover{background:var(--paper);}
.jm-sp-cv{flex-shrink:0;line-height:0;}
.jm-sp-cv svg{border-radius:var(--r1);box-shadow:0 2px 6px rgba(0,0,0,.14);}
.jm-sp-tx{flex:1;min-width:0;}
.jm-sp-tx b{display:block;font-size:13px;font-weight:600;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jm-sp-tx em{display:block;font-style:normal;font-size:11px;color:var(--tx3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jm-sp-pr{flex-shrink:0;font-size:13px;font-weight:700;color:var(--tx);}

.jm-sp-hot{list-style:none;margin:0;padding:0;}
.jm-sp-hot button{display:flex;align-items:center;gap:10px;width:100%;background:none;
  border:none;padding:5px 4px;border-radius:var(--r1);text-align:left;}
.jm-sp-hot button:hover{background:var(--paper);}
.jm-sp-hot i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--tx3);
  width:20px;flex-shrink:0;}
.jm-sp-hot i[data-top="1"]{color:var(--pt);font-weight:700;}
.jm-sp-hot span{flex:1;font-size:13px;color:var(--tx2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.jm-sp-hot em{font-style:normal;font-family:var(--mono);font-size:11px;flex-shrink:0;}
.jm-sp-hot em[data-d="up"]{color:var(--red);}
.jm-sp-hot em[data-d="dn"]{color:var(--pt);}
.jm-sp-hot em[data-d="same"]{color:var(--tx3);}

/* \uC790\uB3D9\uC644\uC131 */
.jm-sp-auto{padding-bottom:var(--s3);}
.jm-sp-none{font-size:13px;color:var(--tx2);margin:0;padding:var(--s3) 6px;line-height:1.8;}
.jm-sp-more{width:100%;background:var(--paper);border:none;border-radius:var(--r1);
  padding:11px;font-size:13px;font-weight:600;color:var(--pt);margin-top:8px;}
.jm-sp-more:hover{background:var(--pt-tint);}

.jm-sp-foot{display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--ln2);margin:0 calc(var(--s4) * -1);padding:12px var(--s4);
  position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px;}
.jm-sp-foot button{background:none;border:none;font-size:13px;color:var(--tx2);padding:4px;}
.jm-sp-foot button:hover{color:var(--pt);}
.jm-sp-foot button:last-child{font-weight:600;color:var(--tx);}

@media (max-width:900px){.jm-sp-cols{grid-template-columns:1fr;gap:var(--s3);}}

/* mega */
.jm-mega{position:absolute;left:0;right:0;top:100%;background:#fff;z-index:40;
  box-shadow:var(--sh2);border-radius:0 0 var(--r3) var(--r3);overflow:hidden;
  animation:jm-fade .2s ease both;}
@keyframes jm-fade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.jm-mega-in{max-width:1200px;margin:0 auto;padding:32px var(--pad) 46px;}
.jm-mega-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
.jm-mega-h b{font-size:20px;font-weight:700;color:var(--tx);display:flex;align-items:center;
  gap:10px;letter-spacing:-.6px;}
.jm-mega-h b::before{content:'';width:4px;height:19px;background:var(--pt);border-radius:var(--pill);}
.jm-mega-h button{background:none;border:none;color:var(--tx3);display:flex;padding:6px;border-radius:50%;}
.jm-mega-h button:hover{background:var(--paper);color:var(--tx);}
.jm-mega-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;}
.jm-mega-cols h5{font-size:14px;font-weight:700;color:var(--tx);margin:0 0 16px;letter-spacing:-.4px;}
.jm-mega-cols ul{list-style:none;margin:0;padding:0;}
.jm-mega-cols li{font-size:13px;color:var(--tx2);line-height:2.1;}
.jm-mega-cols li ul li{padding-left:12px;font-size:13px;color:var(--tx3);}
.jm-mega-cols h5 button,.jm-mega-cols li button{background:none;border:none;padding:0;
  font:inherit;color:inherit;text-align:left;}
.jm-mega-cols h5 button:hover,.jm-mega-cols li button:hover{color:var(--pt);}

/* page */
.jm-page{padding-top:var(--s5);padding-bottom:var(--s8);min-height:46vh;}
.jm-crumb{display:flex;align-items:center;justify-content:flex-end;gap:6px;
  font-size:12px;color:var(--tx3);margin-bottom:36px;flex-wrap:wrap;}
.jm-crumb button{background:none;border:none;padding:6px 4px;margin:-6px -4px;
  font-size:12px;color:var(--tx3);}
.jm-crumb button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px;}
.jm-crumb-l{justify-content:flex-start;margin-bottom:var(--s3);}
.jm-cathero[data-dark="1"] .jm-crumb,
.jm-cathero[data-dark="1"] .jm-crumb button{color:rgba(255,255,255,.6);}
.jm-cathero[data-dark="1"] .jm-crumb button:hover{color:#fff;}
.jm-mega-cols h5 button,.jm-mega-cols li button{background:none;border:none;padding:0;
  font:inherit;color:inherit;text-align:left;}
.jm-mega-cols h5 button:hover,.jm-mega-cols li button:hover{color:var(--pt);
  text-decoration:underline;text-underline-offset:3px;}
.jm-ttl{text-align:center;margin-bottom:38px;}
.jm-ttl h2{font-size:24px;font-weight:700;letter-spacing:-.8px;margin:0 0 10px;color:#1A1A1A;}
.jm-ttl p{font-size:13px;color:var(--tx3);margin:0;}

/* \u2500\u2500 category hero \u2500\u2500 */
.jm-cathero{position:relative;min-height:300px;overflow:hidden;display:flex;align-items:center;}
.jm-cathero-in{position:relative;z-index:2;max-width:1200px;width:100%;margin:0 auto;
  padding:var(--s6) var(--pad);}
.jm-cathero-en{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1.8px;
  color:var(--pt);margin-bottom:var(--s3);font-weight:500;}
.jm-cathero h2{font-size:clamp(32px,4.6vw,58px);font-weight:750;letter-spacing:-2.6px;
  color:var(--tx);margin:0 0 var(--s3);line-height:1.1;}
.jm-cathero p{font-size:15px;color:var(--tx2);margin:0 0 var(--s4);line-height:1.8;}
.jm-cathero-n{display:inline-block;font-size:var(--t-xs);letter-spacing:0;font-weight:600;
  color:var(--tx);background:#fff;padding:8px 16px;border-radius:var(--pill);box-shadow:var(--sh1);}
.jm-cathero[data-dark="1"] .jm-cathero-en{color:#fff;}
.jm-cathero[data-dark="1"] h2{color:#fff;}
.jm-cathero[data-dark="1"] p{color:rgba(255,255,255,.75);}
.jm-cathero[data-dark="1"] .jm-cathero-n{color:var(--pt);background:#fff;}

/* \u2500\u2500 \uACE1\uC9D1 \uD398\uC774\uC9C0 \u2500\u2500 */
.jm-bookhero{background:var(--paper);}
.jm-bookhero-in{max-width:1200px;margin:0 auto;padding:var(--s7) var(--pad);display:grid;
  grid-template-columns:auto 1fr;gap:var(--s6);align-items:center;}
.jm-bookhero-art svg{filter:drop-shadow(0 18px 40px rgba(0,0,0,.2));border-radius:var(--r2);}
.jm-bookhero h2{font-size:40px;font-weight:600;letter-spacing:-1.5px;color:var(--ink);
  margin:var(--s2) 0 var(--s3);line-height:1.35;}
.jm-bookhero p{font-size:15px;color:var(--tx2);line-height:2;margin:0 0 var(--s4);max-width:460px;}
.jm-bookhero-a{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;}
.jm-booktbl{width:100%;border-collapse:collapse;}
.jm-booktbl th{border-top:1px solid var(--ink);border-bottom:1px solid var(--ln);
  background:#FAFAFA;padding:11px 12px;font-size:var(--t-xs);color:var(--tx2);font-weight:400;text-align:left;}
.jm-booktbl td{border-bottom:1px solid var(--ln2);padding:15px 12px;font-size:13px;
  color:var(--tx2);vertical-align:middle;}
.jm-booktbl tr:hover td{background:#FCFCFB;}
.jm-bt-no{font-size:var(--t-xs);color:var(--tx3);letter-spacing:.5px;}
.jm-booktitle{background:none;border:none;padding:0;font-size:15px;color:var(--ink);
  font-weight:500;text-align:left;}
.jm-booktitle:hover{color:var(--pt);text-decoration:underline;text-underline-offset:3px;}

/* \u2500\u2500 \uAC80\uC0C9 \u2500\u2500 */
.jm-srchtabs{display:flex;gap:4px;margin-bottom:var(--s3);flex-wrap:wrap;}
.jm-srchtabs button{background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:9px 17px;font-size:13px;color:var(--tx2);font-weight:500;display:flex;
  align-items:center;gap:7px;}
.jm-srchtabs button:hover{border-color:var(--pt);color:var(--pt);}
.jm-srchtabs button[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;
  font-weight:700;}
.jm-srchtabs em{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.75;}
.jm-srchbig{display:flex;align-items:center;gap:var(--s3);background:#fff;
  border:2px solid var(--pt);border-radius:var(--pill);padding:var(--s3) var(--s4);
  margin-bottom:var(--s5);}
.jm-srchbig input{flex:1;border:none;outline:none;font-size:20px;font-family:inherit;
  color:var(--ink);letter-spacing:-.6px;background:none;}
.jm-srchbig input::placeholder{color:var(--tx3);font-weight:300;}
.jm-srchbig button{background:none;border:none;color:var(--tx3);display:flex;padding:4px;}
.jm-srch-sug{padding:var(--s5) 0;}
.jm-srch-sug>span{display:block;font-size:var(--t-sm);color:var(--tx3);margin-bottom:var(--s3);}
.jm-srch-sug div{display:flex;gap:7px;flex-wrap:wrap;}
.jm-srch-sug button{border:1px solid var(--ln);background:#fff;font-size:13px;color:var(--tx2);
  padding:10px 18px;border-radius:var(--pill);}
.jm-srch-sug button:hover{border-color:var(--pt);color:var(--pt);}
.jm-srch-n{font-size:var(--t-sm);color:var(--tx2);margin:0 0 var(--s2);}
.jm-srch-n b{color:var(--ink);font-weight:600;}

/* \u2500\u2500 \uC774\uC6A9 \uC548\uB0B4 \u2500\u2500 */
.jm-steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s5);}
.jm-steps3>div{padding:var(--s5) var(--s4);background:var(--paper);border-radius:var(--r3);}
.jm-steps3 span{display:block;font-size:var(--t-xs);color:var(--pt);letter-spacing:1.6px;
  font-weight:600;margin-bottom:var(--s2);}
.jm-steps3 b{display:block;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.7px;
  margin-bottom:var(--s2);}
.jm-steps3 p{font-size:var(--t-sm);color:var(--tx2);line-height:1.9;margin:0;}
.jm-faq>div{border-bottom:1px solid var(--ln2);padding:var(--s4) 0;}
.jm-guide-cs{background:var(--paper);border-radius:var(--r4);padding:var(--s6);
  text-align:center;margin-top:var(--s7);}
.jm-guide-cs b{display:block;font-size:20px;font-weight:700;color:var(--ink);
  letter-spacing:-.7px;margin-bottom:var(--s2);}
.jm-guide-cs span{display:block;font-size:var(--t-sm);color:var(--tx2);margin-bottom:var(--s5);
  line-height:1.85;}
.jm-guide-cs-a{display:inline-flex;align-items:center;gap:9px;background:var(--pt);color:#fff;
  border:none;border-radius:var(--pill);height:52px;padding:0 32px;font-size:15px;
  font-weight:600;letter-spacing:-.3px;transition:background .16s,transform .16s,box-shadow .16s;}
.jm-guide-cs-a:hover{background:var(--pt2);transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(20,40,160,.24);}
.jm-guide-cs-a i{font-style:normal;transition:transform .22s;display:inline-block;}
.jm-guide-cs-a:hover i{transform:translateX(4px);}


/* \u2550\u2550 \uD648 \uC2DC\uC548 \uC804\uD658 \uB2E8\uCD94 \u2550\u2550 */
.jm-hsw{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;
  padding:5px 6px 5px 14px;background:rgba(18,22,30,.92);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.jm-hsw span{color:#AEB6C4;font-size:12px;font-weight:600;margin-right:6px;white-space:nowrap;}
.jm-hsw button{height:32px;padding:0 13px;border-radius:999px;border:none;background:transparent;color:#E6E9EF;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.jm-hsw button:hover{background:rgba(255,255,255,.1);}
.jm-hsw button[data-on="1"]{background:var(--lime,#C7F04A);color:#12292D;}
@media (max-width:480px){ .jm-hsw span{display:none;} .jm-hsw{padding:5px;} .jm-hsw button{padding:0 10px;font-size:12px;} }

/* \u2550\u2550 B \uC11C\uC810\uD615 \u2550\u2550 */
.jb{--paper2:#FAF8F3;--ink2:#1B1F24;--rule:#E3DED3;background:var(--paper2);padding-bottom:96px;}
.jb button{font:inherit;color:inherit;background:none;border:none;padding:0;text-align:left;cursor:pointer;}
.jb-mast{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:end;padding:72px 0 56px;border-bottom:2px solid var(--ink2);}
.jb-mast h1{font-size:clamp(36px,5vw,58px);line-height:1.12;font-weight:800;letter-spacing:-.045em;color:var(--ink2);margin:0 0 20px;}
.jb-mast-l > p{font-size:17px;line-height:1.75;color:#4A5058;margin:0 0 28px;max-width:30em;}
.jb-cats{display:flex;flex-wrap:wrap;gap:0;margin-bottom:28px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.jb-cats button{padding:13px 18px 13px 0;margin-right:18px;font-size:15px;font-weight:600;color:var(--ink2);position:relative;}
.jb-cats button:hover{color:var(--pt);}
.jb-cats button + button::before{content:"";position:absolute;left:-18px;top:16px;bottom:16px;width:1px;background:var(--rule);}
.jb-cats button + button{padding-left:0;}
.jb-facts{display:flex;gap:32px;margin:0;}
.jb-facts div{display:flex;flex-direction:column;gap:2px;}
.jb-facts dt{font-size:12px;color:#7A808A;}
.jb-facts dd{margin:0;font-size:20px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.jb-shelf{position:relative;padding:0 8px;}
.jb-shelf-row{display:flex;align-items:flex-end;justify-content:center;gap:0;}
.jb-shelf-b{display:block;margin-left:-26px;transition:transform .35s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 12px 18px rgba(27,31,36,.22));}
.jb-shelf-b:first-child{margin-left:0;}
.jb-shelf-b[data-i="0"]{transform:rotate(-3deg);} .jb-shelf-b[data-i="1"]{transform:translateY(-6px);}
.jb-shelf-b[data-i="2"]{transform:rotate(2deg);} .jb-shelf-b[data-i="3"]{transform:rotate(5deg) translateY(4px);}
.jb-shelf-b:hover{transform:translateY(-12px) !important;z-index:2;}
.jb-shelf-b svg{display:block;width:clamp(96px,11vw,150px);height:auto;}
.jb-shelf-line{display:block;height:10px;margin-top:-2px;background:linear-gradient(#D9D2C3,#EDE8DE);border-radius:2px;box-shadow:0 10px 20px rgba(27,31,36,.12);}
.jb-sec{padding:64px 0 0;}
.jb-h{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid var(--ink2);margin-bottom:28px;}
.jb-h-n{font-size:15px;font-weight:700;color:var(--pt);font-variant-numeric:tabular-nums;}
.jb-h h3{margin:0;font-size:28px;font-weight:800;letter-spacing:-.035em;color:var(--ink2);}
.jb-h p{margin:4px 0 0;font-size:14px;color:#7A808A;}
.jb-more{display:inline-flex;align-items:center;gap:2px;font-size:14px !important;font-weight:600 !important;color:var(--ink2) !important;border-bottom:1px solid currentColor !important;padding-bottom:2px !important;}
.jb-more:hover{color:var(--pt) !important;}
.jb-books{display:grid;grid-template-columns:repeat(4,1fr);gap:44px 32px;}
.jb-book{display:flex;flex-direction:column;gap:6px;}
.jb-book-cv{display:block;margin-bottom:12px;transition:transform .35s cubic-bezier(.2,.8,.2,1);}
.jb-book-cv svg{display:block;width:100%;max-width:170px;height:auto;filter:drop-shadow(0 10px 18px rgba(27,31,36,.18));}
.jb-book:hover .jb-book-cv{transform:translateY(-6px);}
.jb-book b{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink2);}
.jb-book > span{font-size:13px;line-height:1.6;color:#5C626B;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.jb-book em{font-style:normal;font-size:13px;font-weight:600;color:var(--pt);margin-top:4px;}
.jb-season{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:start;margin-top:64px;padding-top:40px;border-top:2px solid var(--ink2);}
.jb-dd{display:block;font-size:64px;line-height:1;font-weight:800;letter-spacing:-.05em;color:var(--pt);font-variant-numeric:tabular-nums;}
.jb-season-l b{display:block;font-size:20px;font-weight:700;margin:10px 0 8px;color:var(--ink2);}
.jb-season-l p{font-size:14px;line-height:1.7;color:#5C626B;margin:0 0 16px;}
.jb-season-l p em{font-style:normal;font-weight:700;color:var(--ink2);}
.jb-rows,.jb-best{list-style:none;margin:0;padding:0;}
.jb-rows li,.jb-best li{display:grid;grid-template-columns:36px 1fr auto auto auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule);}
.jb-rows li:first-child{border-top:1px solid var(--rule);}
.jb-rn,.jb-bn{font-size:15px;font-weight:700;color:#9AA0A8;font-variant-numeric:tabular-nums;}
.jb-rt{display:flex;flex-direction:column;gap:3px;min-width:0;}
.jb-rt b{font-size:16px;font-weight:700;color:var(--ink2);}
.jb-rt:hover b{color:var(--pt);}
.jb-rt em{font-style:normal;font-size:13px;color:#7A808A;}
.jb-rm{font-size:13px;color:#5C626B;white-space:nowrap;}
.jb-rp{font-size:15px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.jb-listen{display:inline-flex !important;align-items:center;gap:5px;height:34px;padding:0 14px !important;border-radius:999px;border:1px solid var(--ink2) !important;font-size:13px !important;font-weight:600 !important;white-space:nowrap;}
.jb-listen:hover{background:var(--ink2) !important;color:#fff !important;}
.jb-best{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;}
.jb-best li{grid-template-columns:44px 1fr auto;}
.jb-best li:nth-child(-n+2){border-top:1px solid var(--rule);}
.jb-bn{font-size:26px;font-weight:800;color:var(--ink2);letter-spacing:-.04em;}
.jb-best li:nth-child(n+4) .jb-bn{color:#9AA0A8;}
.jb-new{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 28px;}
.jb-new-i{display:flex;flex-direction:column;gap:4px;}
.jb-new-th{display:block;margin-bottom:14px;width:100%;}
.jb-new-i b{font-size:16px;font-weight:700;color:var(--ink2);}
.jb-new-i em{font-style:normal;font-size:13px;color:#7A808A;}
.jb-new-i > span:last-child{font-size:13px;color:#5C626B;}
@media (hover:hover){
  .jb-new-i:hover .jm-sth.is-book .jm-sth-cv{transform:translate3d(-3%,1.5%,0) rotate(-5.5deg);}
  .jb-new-i:hover .jm-sth.is-book .jm-sth-pg{transform:translate3d(3%,-6%,0) rotate(1.8deg);}
}
@media (max-width:900px){
  .jb-mast{grid-template-columns:1fr;gap:36px;padding:44px 0 36px;}
  .jb-books,.jb-new{grid-template-columns:repeat(2,1fr);gap:32px 20px;}
  .jb-season{grid-template-columns:1fr;gap:20px;}
  .jb-best{grid-template-columns:1fr;}
  .jb-best li:nth-child(2){border-top:0;}
}
@media (max-width:640px){
  .jb-cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .jb-cats::-webkit-scrollbar{display:none;}
  .jb-cats button{white-space:nowrap;}
  .jb-rows li{grid-template-columns:28px 1fr auto;row-gap:8px;}
  .jb-rows .jb-rm{grid-column:2;grid-row:2;}
  .jb-rows .jb-rp{grid-column:3;grid-row:1;}
  .jb-rows .jb-listen{grid-column:3;grid-row:2;justify-self:end;}
  .jb-h h3{font-size:23px;}
  .jb-dd{font-size:52px;}
  .jb-facts{gap:22px;}
}


/* B: \uC545\uBCF4\uAC00 \uC8FC\uC778\uACF5\uC778 \uBA38\uB9AC \xB7 \uBAA9\uB85D \uC378\uB124\uC77C \xB7 \uC791\uC740 \uC11C\uAC00 */
.jb-mast > *{min-width:0;}
.jb-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.jb-steps li{display:flex;gap:10px;align-items:flex-start;}
.jb-steps b{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink2);}
.jb-steps span{font-size:14px;line-height:1.55;color:#4A5058;}
.jb-stage{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:360px;}
.jb-stage-sheet{display:block;width:100%;max-width:330px;margin-right:110px;}
.jb-memo{position:absolute;right:0;bottom:24px;width:210px;display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px;background:#fff;
  border:1px solid var(--rule);border-radius:4px;box-shadow:0 16px 34px rgba(27,31,36,.14);transform:rotate(2deg);}
.jb-memo-t{font-size:13px;font-weight:700;color:var(--ink2);padding-bottom:8px;border-bottom:1px dashed var(--rule);}
.jb-memo-r,.jb-memo-sum{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;}
.jb-memo-r em,.jb-memo-sum em{font-style:normal;font-size:12px;color:#7A808A;}
.jb-memo-r b{font-size:14px;color:var(--ink2);}
.jb-memo-sum{padding-top:8px;border-top:1.5px solid var(--ink2);}
.jb-memo-sum b{font-size:20px;font-weight:800;color:var(--pt);letter-spacing:-.02em;}
.jb-memo .jb-listen{justify-content:center;margin-top:4px;}
.jb-rows li{grid-template-columns:36px 40px 1fr auto auto auto;}
.jb-rth{display:block;line-height:0;}
.jb-best2 .jb-bn{font-size:24px;}
.jb-best2 li:nth-child(n+4) .jb-bn{color:#9AA0A8;}
.jb-books-s{grid-template-columns:repeat(8,1fr);gap:24px 18px;}
.jb-books-s .jb-book-cv svg{max-width:110px;}
.jb-books-s .jb-book b{font-size:13px;line-height:1.4;}
.jb-books-s .jb-book em{font-size:12px;margin-top:0;}
@media (max-width:900px){
  .jb-stage{min-height:0;justify-content:flex-start;}
  .jb-stage-sheet{max-width:250px;margin-right:0;}
  .jb-memo{right:0;bottom:10px;width:180px;}
  .jb-books-s{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:640px){
  .jb-steps{grid-template-columns:1fr;gap:10px;}
  .jb-steps span br{display:none;}
  .jb-stage-sheet{max-width:200px;}
  .jb-memo{width:160px;padding:14px;}
  .jb-memo-sum b{font-size:17px;}
  .jb-rows li{grid-template-columns:24px 34px 1fr auto;}
  .jb-rows .jb-rm{grid-column:3;grid-row:2;}
  .jb-rows .jb-rp{grid-column:4;grid-row:1;}
  .jb-rows .jb-listen{grid-column:4;grid-row:2;justify-self:end;}
  .jb-rows .jb-rn,.jb-rows .jb-bn{grid-column:1;grid-row:1 / span 2;}
  .jb-rows .jb-rth{grid-column:2;grid-row:1 / span 2;}
  .jb-rows .jb-rt{grid-column:3;grid-row:1;}
  .jb-books-s{grid-template-columns:repeat(3,1fr);}
}


/* B \uCF58\uD150\uCE20: \uB2E4\uAC00\uC624\uB294 \uC8FC\uC77C \xB7 \uC608\uBC30 \uC21C\uC11C \xB7 \uC131\uAC00\uB300 \uB9DE\uCDA4 \xB7 \uCCAB \uC18C\uC808 \xB7 \uD3B8\uACE1\uC790 */
.jb-mast + .jb-season{border-top:0;margin-top:0;padding-top:48px;}
.jb-sun{display:block;font-size:14px;font-weight:700;color:var(--pt);margin-bottom:8px;}
.jb-sunname{font-size:44px !important;line-height:1.15 !important;color:var(--ink2) !important;letter-spacing:-.045em !important;}
.jb-sun-hint{display:block;font-size:13px;color:#7A808A;}
.jb-use{font-size:12px !important;font-weight:700 !important;color:var(--pt) !important;white-space:nowrap;}
.jb-rows li{grid-template-columns:44px 40px 1fr auto auto auto;}
.jb-uses{display:grid;grid-template-columns:repeat(5,1fr);margin-top:-28px;}
.jb-use-c{padding:20px 18px 22px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;}
.jb-use-c:last-child{border-right:0;}
.jb-use-c > b{font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--ink2);}
.jb-use-c > em{font-style:normal;font-size:12px;color:#7A808A;margin-bottom:10px;}
.jb-use-c ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.jb-use-c li button{font-size:14px;color:#3A4048;line-height:1.4;}
.jb-use-c li button:hover{color:var(--pt);text-decoration:underline;}
.jb-fit{display:grid;grid-template-columns:320px 1fr;gap:40px;align-items:start;}
.jb-fit-f{display:flex;flex-direction:column;gap:16px;padding:22px;background:#fff;border:1px solid var(--rule);border-radius:4px;}
.jb-fit-r > span{display:block;font-size:12px;font-weight:700;color:#7A808A;margin-bottom:8px;}
.jb-fit-r > div{display:flex;flex-wrap:wrap;gap:6px;}
.jb-fit-r button{height:34px;padding:0 13px !important;border-radius:999px;border:1px solid var(--rule) !important;font-size:13px !important;color:#3A4048 !important;}
.jb-fit-r button[data-on="1"]{background:var(--ink2) !important;border-color:var(--ink2) !important;color:#fff !important;font-weight:700 !important;}
.jb-fit-n{margin:4px 0 0;padding-top:14px;border-top:1px solid var(--rule);font-size:14px;color:#4A5058;}
.jb-fit-n b{font-size:22px;color:var(--pt);margin-right:2px;font-variant-numeric:tabular-nums;}
.jb-fit-l li:first-child{border-top:0;}
.jb-fit-l{margin-top:-12px;}
.jb-fit-empty{padding:40px 0;color:#7A808A;font-size:14px;border-top:1px solid var(--rule);}
.jb-incs{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px;}
.jb-inc{display:flex;flex-direction:column;gap:10px;}
.jb-inc-sh{position:relative;display:block;width:100%;aspect-ratio:420/178;overflow:hidden;background:#FFFEFB;border:1px solid var(--rule) !important;border-radius:3px;}
.jb-inc-pg{display:block;margin-top:-6.5%;}
.jb-inc-pg .jm-scorepage{display:block;width:100%;height:auto;max-width:none;}
.jb-inc-sh i{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--ink2);color:#fff;display:flex;align-items:center;justify-content:center;
  opacity:.9;transition:transform .25s,background .25s;}
.jb-inc-sh:hover i{background:var(--pt);transform:scale(1.08);}
.jb-inc-t{display:flex;flex-direction:column;gap:3px;}
.jb-inc-t b{font-size:16px;font-weight:700;color:var(--ink2);}
.jb-inc-t:hover b{color:var(--pt);}
.jb-inc-t em{font-style:normal;font-size:13px;color:#7A808A;}
.jb-arrs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:-28px;}
.jb-arr{display:flex;gap:14px;padding:20px 18px 20px 0;border-bottom:1px solid var(--rule);}
.jb-arr-i{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:#EDE8DE;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;}
.jb-arr b{display:block;font-size:17px;font-weight:700;color:var(--ink2);}
.jb-arr em{display:block;font-style:normal;font-size:12px;color:#7A808A;margin:2px 0 8px;}
.jb-arr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.jb-arr li button{font-size:14px;color:#3A4048;}
.jb-arr li button:hover{color:var(--pt);text-decoration:underline;}
@media (max-width:900px){
  .jb-uses{grid-template-columns:repeat(2,1fr);}
  .jb-use-c{border-bottom:1px solid var(--rule);}
  .jb-use-c:nth-child(2n){border-right:0;}
  .jb-fit{grid-template-columns:1fr;gap:20px;}
  .jb-incs{grid-template-columns:repeat(2,1fr);}
  .jb-arrs{grid-template-columns:repeat(2,1fr);}
  .jb-sunname{font-size:36px !important;}
}
@media (max-width:640px){
  .jb-rows li{grid-template-columns:44px 34px 1fr auto;}
  .jb-incs,.jb-arrs{grid-template-columns:1fr;}
}

/* \u2550\u2550 B \uB9E4\uAC70\uC9C4\uD615(2026.11 \uAC1C\uD3B8) \u2014 CI \uD30C\uB791 \xB7 \uB77C\uC784 \xB7 \uBA39\uC0C9 \uC138 \uBA74 \u2550\u2550 */
.jx{--ink:#0B1030;--lime:#C7F04A;--ci:#203BA1;padding-bottom:96px;}
.jx button{font:inherit;cursor:pointer;}
.jx-label{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.jx-label.is-lime{color:var(--lime);opacity:1;}
.jx-acts{display:flex;flex-wrap:wrap;gap:10px;}
.jx-bt{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:700;
  border:2px solid transparent;transition:transform .2s,background .2s,color .2s;}
.jx-bt:hover{transform:translateY(-2px);}
.jx-bt.is-lime{background:var(--lime);color:var(--ink);}
.jx-bt.is-line{background:transparent;border-color:rgba(255,255,255,.7);color:#fff;}
.jx-bt.is-line:hover{background:#fff;color:var(--ink);}

/* 1. \uD45C\uC9C0 */
.jx-hero{position:relative;overflow:hidden;background:var(--ci);color:#fff;}
.jx-hero-in{position:relative;z-index:2;padding-top:64px;padding-bottom:132px;}
.jx-h1{margin:0;display:flex;flex-direction:column;line-height:.9;font-weight:900;letter-spacing:-.06em;}
.jx-h1-s{font-size:clamp(28px,4vw,48px);letter-spacing:-.04em;margin-bottom:10px;}
.jx-big{position:relative;display:inline-flex;align-items:baseline;align-self:flex-start;gap:.06em;}
/* \uC624\uC120 \uB2E4\uC12F \uC904 \u2014 \uD070 \uC22B\uC790\uAC00 \uC624\uC120 \uC704\uC5D0 \uC549\uAC8C. \uD45C\uC9C0 \uBC16\uC73C\uB85C \uB05D\uAE4C\uC9C0 \uADF8\uC5B4 \uD654\uBA74 \uC804\uCCB4\uAC00 \uC545\uBCF4\uCC98\uB7FC */
.jx-big::before{content:"";position:absolute;left:-100vw;right:-100vw;top:14%;height:72%;z-index:-1;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.32) 0 1px,transparent 1px 25%);border-bottom:1px solid rgba(255,255,255,.32);}
.jx-big b{font-size:clamp(150px,24vw,340px);font-weight:900;color:var(--lime);font-variant-numeric:tabular-nums;}
.jx-big small{font-size:clamp(40px,6vw,88px);font-weight:900;}
.jx-big.is-word b{font-size:clamp(56px,10vw,140px);line-height:1;color:#fff;}
.jx-lead{margin:26px 0 30px;font-size:clamp(16px,1.6vw,20px);line-height:1.6;max-width:30em;color:rgba(255,255,255,.88);}
.jx-lead b{color:#fff;}
.jx-stats{display:flex;flex-wrap:wrap;gap:0;margin:44px 0 0;max-width:560px;border-top:1px solid rgba(255,255,255,.35);}
.jx-stats > div{flex:1 1 0;padding:16px 18px 0 0;}
.jx-stats > div + div{padding-left:18px;border-left:1px solid rgba(255,255,255,.25);}
.jx-stats dt{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);}
.jx-stats dd{margin:4px 0 0;font-size:40px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;}
.jx-stats small{font-size:15px;font-weight:700;margin-left:2px;letter-spacing:0;}
.jx-hero-pg{position:absolute;z-index:1;right:-3%;top:56px;width:min(36vw,500px);padding:0;border:none;background:#fff;
  transform:rotate(5deg);box-shadow:0 40px 80px rgba(5,10,40,.45);transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.jx-hero-pg svg{display:block;width:100%;height:auto;}
.jx-hero-pg:hover{transform:rotate(2deg) translateY(-10px);}
.jx-tick{position:absolute;z-index:3;left:0;right:0;bottom:0;background:var(--lime);color:var(--ink);overflow:hidden;border-top:2px solid var(--ink);}
.jx-tick-in{display:flex;width:max-content;animation:jx-tick 48s linear infinite;}
.jx-tick:hover .jx-tick-in{animation-play-state:paused;}
.jx-tick span{display:inline-flex;align-items:center;gap:22px;padding:14px 0 14px 22px;font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;}
.jx-tick i{display:inline-block;width:9px;height:9px;background:var(--ink);transform:rotate(45deg);}
@keyframes jx-tick{to{transform:translateX(-50%);}}

/* \uC139\uC158 \uBA38\uB9AC \u2014 \uBC88\uD638 \xB7 \uD070 \uC81C\uBAA9 \xB7 \uD55C \uC904 */
.jx-sec{padding-top:96px;}
.jx-sh{display:grid;grid-template-columns:auto 1fr;column-gap:18px;align-items:end;padding-bottom:18px;margin-bottom:0;border-bottom:3px solid var(--ink);}
.jx-sn{grid-row:span 2;align-self:start;font-family:var(--mono);font-size:14px;font-weight:700;padding:6px 10px;background:var(--ink);color:var(--lime);}
.jx-sh h2{margin:0;font-size:clamp(32px,4.4vw,56px);font-weight:900;letter-spacing:-.05em;line-height:1.05;color:var(--ink);}
.jx-sh p{margin:6px 0 0;font-size:14px;color:var(--tx2);}
.jx-sh.is-ink{border-color:var(--ink);}
.jx-sh.is-ink p{color:var(--ink);opacity:.75;}

/* 2. \uBC88\uD638 \uBAA9\uB85D */
.jx-list{position:relative;list-style:none;margin:0;padding:0;}
.jx-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto 56px;align-items:center;gap:20px;padding:22px 12px;
  border-bottom:1px solid var(--ink);transition:background .2s;}
.jx-n{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--tx3);}
.jx-mth{display:none;}
.jx-t{background:none;border:none;padding:0;text-align:left;min-width:0;color:var(--ink);}
.jx-t b{display:block;font-size:clamp(24px,3.4vw,48px);font-weight:800;letter-spacing:-.045em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jx-t em{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;font-style:normal;font-size:13px;color:var(--tx2);}
.jx-new{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;background:var(--ci);color:#fff;}
.jx-pr{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;}
.jx-play{width:56px;height:56px;border-radius:50%;border:none;background:var(--ink);color:var(--lime);display:grid;place-items:center;
  transition:transform .2s;}
.jx-play:hover{transform:scale(1.08);}
@media (hover:hover){.jx-row:hover .jx-play{transform:translateY(-3px);box-shadow:0 8px 16px rgba(11,16,48,.3);}}
.jx-play svg{margin-left:2px;}
.jx-play.is-ink{width:48px;height:48px;}
.jx-float{display:none;}
@media (hover:hover) and (min-width:901px){
  .jx-row:hover{background:var(--lime);}
  .jx-row:hover .jx-n{color:var(--ink);}
  .jx-float{display:block;position:absolute;left:0;top:0;width:190px;pointer-events:none;z-index:5;
    opacity:0;transition:opacity .2s;will-change:transform;}
  .jx-float[data-on="1"]{opacity:1;}
  .jx-float span{display:none;background:#fff;box-shadow:0 24px 48px rgba(11,16,48,.28);transform:rotate(-4deg);}
  .jx-float span[data-on="1"]{display:block;}
  .jx-float svg{display:block;width:100%;height:auto;}
  .jx-row .jx-t,.jx-row .jx-pr{position:relative;z-index:6;}
}

/* 3. \uC774 \uC8FC\uC758 \uD55C \uACE1 */
/* Spotify\uC2DD \u2014 \uACE1\uC9D1 \uD45C\uC9C0 \uC0C9\uC5D0\uC11C \uBA39\uC0C9\uC73C\uB85C \uB0B4\uB824\uC624\uB294 \uBC14\uD0D5(\uACE1\uC774 \uBC14\uB00C\uBA74 \uBC14\uD0D5\uC0C9\uB3C4 \uBC14\uB01D\uB2C8\uB2E4) */
.jx-feat{position:relative;overflow:hidden;margin-top:112px;background:linear-gradient(155deg,var(--tone,var(--ci)) 0%,var(--ink) 58%);color:#fff;}
.jx-feat-pg{position:absolute;right:-6%;top:-18%;width:58%;opacity:.95;transform:rotate(-6deg);background:#fff;}
.jx-feat-pg svg{display:block;width:100%;height:auto;}
.jx-feat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,16,48,.55) 40%,rgba(11,16,48,.35) 62%,rgba(11,16,48,0) 100%);}
.jx-feat-in{position:relative;z-index:2;padding-top:96px;padding-bottom:96px;}
.jx-feat-tx{max-width:560px;}
.jx-feat-tx h2{margin:0 0 26px;font-size:clamp(40px,6vw,80px);font-weight:900;letter-spacing:-.055em;line-height:1;}
.jx-feat-tx blockquote{margin:0 0 22px;font-size:clamp(20px,2.4vw,30px);font-weight:700;line-height:1.45;letter-spacing:-.03em;}
.jx-feat-tx cite{display:block;margin-top:12px;font-style:normal;font-size:13px;font-weight:700;color:var(--lime);}
.jx-meta{margin:0 0 30px;font-size:14px;color:rgba(255,255,255,.7);}

/* 4. \uC21C\uC704 \u2014 \uB77C\uC784 \uBA74 */
.jx-chart{background:var(--lime);padding:88px 0 96px;}
.jx-chart .jx-sh h2{color:var(--ink);}
.jx-chart .jx-sn{background:var(--ink);color:var(--lime);}
.jx-top{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));}
.jx-top li{display:flex;flex-direction:column;gap:14px;padding:26px 18px 0 0;border-right:1px solid rgba(11,16,48,.25);padding-left:18px;}
.jx-top li:first-child{padding-left:0;}
.jx-top li:last-child{border-right:none;}
.jx-top-n{font-size:clamp(96px,11vw,168px);font-weight:900;line-height:.82;letter-spacing:-.06em;color:var(--ink);font-variant-numeric:tabular-nums;}
.jx-top-n[data-first="1"]{color:var(--ci);}
.jx-top-t{background:none;border:none;padding:0;text-align:left;color:var(--ink);min-width:0;}
.jx-top-t b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.3;}
.jx-top-t:hover b{text-decoration:underline;text-underline-offset:4px;}
.jx-top-t em{display:block;margin-top:4px;font-style:normal;font-size:13px;color:rgba(11,16,48,.7);}
.jx-top-o{display:inline-block;margin-bottom:6px;padding:3px 7px;background:var(--ink);color:var(--lime);font-size:11px;font-weight:700;}
.jx-top-s{display:block;margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);}
.jx-top .jx-play{margin-top:auto;}

/* 5. \uC606\uC73C\uB85C \uB118\uAE30\uB294 \uCEEC\uB809\uC158 */
.jx-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:28px max(24px,calc((100vw - 1200px) / 2)) 8px;
  scroll-padding:0 max(24px,calc((100vw - 1200px) / 2));scrollbar-width:thin;}
.jx-cc{position:relative;flex:0 0 min(420px,80vw);height:480px;overflow:hidden;border:none;padding:0;text-align:left;color:#fff;
  scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;}
.jx-cc svg{transition:transform .7s cubic-bezier(.2,.8,.2,1);}
.jx-cc:hover svg{transform:scale(1.06);}
.jx-cc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 30%,rgba(8,12,32,.72) 100%);}
.jx-cc-n{position:relative;z-index:1;padding:22px 24px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.1em;}
.jx-cc-tx{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:28px 24px;}
.jx-cc-tx em{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--lime);}
.jx-cc-tx b{font-size:clamp(34px,3.6vw,46px);font-weight:900;letter-spacing:-.05em;line-height:1.05;}
.jx-cc-tx i{font-style:normal;font-size:15px;line-height:1.6;opacity:.92;}
/* \uB113\uC740 \uD654\uBA74\uC740 3\uCE78 \uACA9\uC790(\uCCAB \uBB36\uC74C\uC740 2\uCE78), \uC881\uC740 \uD654\uBA74\uC740 \uC606\uC73C\uB85C \uB118\uAE41\uB2C8\uB2E4 */
@media (min-width:901px){
  .jx-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;max-width:1200px;margin:0 auto;padding:28px var(--pad) 0;}
  /* \uD06C\uAE30\uB97C \uB2EC\uB9AC\uD55C \uBAA8\uB4C8 \u2014 \uCCAB \uBB36\uC74C\uC744 \uB450 \uCE78\uC73C\uB85C \uD06C\uAC8C */
  .jx-rail > :first-child{grid-column:span 2;}
}

@media (max-width:900px){
  .jx-hero-in{padding-top:40px;padding-bottom:300px;}
  .jx-stats{margin-top:32px;}
  .jx-stats dd{font-size:30px;}
  .jx-stats > div + div{padding-left:12px;}
  .jx-stats > div{padding-right:12px;}
  .jx-hero-pg{top:auto;bottom:-40px;right:-6%;width:54%;max-width:280px;}
  .jx-sec{padding-top:72px;}
  .jx-row{grid-template-columns:44px minmax(0,1fr) 48px;gap:12px;padding:16px 0;}
  .jx-n{display:none;}
  .jx-mth{display:block;}
  .jx-mth .jm-sth{box-shadow:0 1px 4px rgba(0,0,0,.18);}
  .jx-pr{display:none;}
  .jx-play{width:48px;height:48px;}
  .jx-t b{font-size:21px;white-space:normal;}
  .jx-feat-pg{width:110%;right:-40%;top:-6%;opacity:.35;}
  .jx-feat::after{background:linear-gradient(180deg,rgba(11,16,48,.5) 0%,var(--ink) 55%);}
  .jx-feat-in{padding-top:72px;padding-bottom:72px;}
  .jx-top{grid-template-columns:1fr;}
  .jx-top li{flex-direction:row;align-items:center;gap:16px;padding:16px 0;border-right:none;border-bottom:1px solid rgba(11,16,48,.25);}
  .jx-top li:first-child{padding-left:0;}
  .jx-top-n{font-size:64px;width:64px;flex:0 0 64px;}
  .jx-top-t{flex:1;}
  .jx-top .jx-play{margin-top:0;}
  .jx-cc{height:420px;}
  .jx-rail{padding:24px var(--pad) 8px;scroll-padding:0 var(--pad);}
}
@media (prefers-reduced-motion:reduce){
  .jx-tick-in{animation:none;}
  .jx-hero-pg,.jx-cc svg,.jx-bt,.jx-play{transition:none;}
}

/* \u2500\u2500 product card \u2500\u2500 */
.jm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s5) var(--s3);
  padding-top:var(--s4);}
.jm-card{display:block;position:relative;}
.jm-thumb{display:block;width:100%;position:relative;overflow:hidden;background:var(--card);
  padding:var(--s5) var(--s4);margin-bottom:var(--s3);border:none;border-radius:var(--r3);
  transition:box-shadow .45s cubic-bezier(.22,.8,.24,1),transform .45s cubic-bezier(.22,.8,.24,1);}
.jm-card:hover .jm-thumb{box-shadow:var(--sh2);transform:translateY(-3px);}
.jm-thumb svg{filter:drop-shadow(0 10px 24px rgba(0,0,0,.16));border-radius:var(--r1);
  transition:transform .45s cubic-bezier(.2,.7,.2,1);margin:0 auto;}
.jm-card:hover .jm-thumb svg{transform:scale(1.05);}
.jm-thumb-wrap{position:relative;}
.jm-pv-pnote[data-warn="1"]{color:#B42318;font-weight:600;}
/* \uB0B1\uACE1 \uC378\uB124\uC77C: \uC545\uBCF4 1\uBA74\uC774 \uC8FC\uC778\uACF5. \uC2A4\uD2F0\uCEE4 \uC5C6\uC774 \uC885\uC774\uB9CC, \uBA54\uD0C0\uB294 \uCE74\uB4DC \uC67C\uCABD \uC704 \uAE00\uC790\uB85C */
.jm-sth{position:relative;display:block;margin:0 auto;}
.jm-sth .jm-scorepage{display:block;width:100%;height:auto;max-width:none;}
.jm-thumb .jm-sth svg{filter:none;border-radius:0;}
.jm-sth.is-mini .jm-scorepage{height:100%;border-radius:2px;box-shadow:0 0 0 1px rgba(18,41,45,.10),0 2px 6px rgba(18,41,45,.10);}
.jm-sth-pg{display:block;position:relative;background:#FFFEFB;}
/* crop: \uC704\uCABD\uB9CC \uD06C\uAC8C. \uC885\uC774 \uC717\uBCC0\uC740 \uACE1\uC9D1 \uD45C\uC9C0 \uC0C9 \uB760, \uC544\uB798\uB294 \uCE74\uB4DC \uBC14\uD0D5\uC73C\uB85C \uC0AC\uB77C\uC9D0 */
.jm-sth.is-crop{overflow:hidden;padding:0 10px;margin:0 -10px;box-sizing:content-box;
  -webkit-mask-image:linear-gradient(#000 58%,transparent 98%);mask-image:linear-gradient(#000 58%,transparent 98%);}
.jm-sth.is-crop .jm-sth-pg{border-top:3px solid #203BA1;border-radius:3px 3px 0 0;
  box-shadow:0 1px 2px rgba(18,41,45,.08),0 8px 20px rgba(18,41,45,.10);}
/* book: \uACE1\uC9D1 \uD45C\uC9C0(\uB4A4) + \uC545\uBCF4 1\uBA74(\uC55E).
   \uD3C9\uC18C\uC5D0\uB294 \uBC18\uB4EF\uD558\uAC8C \uACB9\uCCD0 \uCC28\uBD84\uD558\uAC8C(B), \uB9C8\uC6B0\uC2A4\uB97C \uC62C\uB9AC\uBA74 \uD45C\uC9C0\uAC00 \uBE44\uC2A4\uB4EC\uD788 \uBE60\uC9C0\uBA70 \uC545\uBCF4\uAC00 \uC55E\uC73C\uB85C \uB098\uC635\uB2C8\uB2E4(A) \u2014
   '\uACE1\uC9D1\uC5D0\uC11C \uC545\uBCF4 \uD55C \uC7A5\uC744 \uAEBC\uB0B4\uB294' \uB3D9\uC791\uC785\uB2C8\uB2E4. \uC190\uAC00\uB77D\uC73C\uB85C \uC4F0\uB294 \uAE30\uAE30\uC5D0\uB294 \uB9C8\uC6B0\uC2A4 \uC62C\uB9BC\uC774 \uC5C6\uC5B4 B\uB85C \uB461\uB2C8\uB2E4.
   \uC6C0\uC9C1\uC784\uC744 \uC904\uC5EC \uB2EC\uB77C\uACE0 \uC124\uC815\uD55C \uBD84\uAED8\uB294 \uC6C0\uC9C1\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. */
.jm-sth.is-book{aspect-ratio:1/1.02;}
/* \uC6C0\uC9C1\uC784\uC740 transform(\uC774\uB3D9 \xB7 \uD68C\uC804 \xB7 \uD655\uB300)\uC73C\uB85C\uB9CC \u2014 \uC704\uCE58 \xB7 \uD06C\uAE30 \uC18D\uC131\uC744 \uBC14\uAFB8\uBA74 \uB9E4 \uD504\uB808\uC784 \uC545\uBCF4 \uADF8\uB9BC\uC744 \uB2E4\uC2DC \uADF8\uB824 \uB04A\uAE41\uB2C8\uB2E4.
   \uADF8\uB9BC\uC790\uB294 \uC6C0\uC9C1\uC774\uC9C0 \uC54A\uACE0, \uB450 \uC7A5\uC740 \uAC01\uC790 \uD55C \uACB9(layer)\uC73C\uB85C \uC62C\uB824 GPU\uAC00 \uC62E\uAE30\uAC8C \uD569\uB2C8\uB2E4. */
.jm-sth.is-book .jm-sth-cv{position:absolute;left:4%;top:0;width:54%;
  transform:rotate(-3deg);transform-origin:50% 50%;
  filter:drop-shadow(0 8px 14px rgba(18,41,45,.2));
  will-change:transform;backface-visibility:hidden;
  transition:transform .55s cubic-bezier(.22,.8,.24,1);}
.jm-sth.is-book .jm-sth-cv svg{display:block;width:100%;height:auto;border-radius:2px;}
.jm-sth.is-book .jm-sth-pg{position:absolute;right:2%;bottom:0;width:64%;aspect-ratio:420/594;overflow:hidden;border-radius:2px;
  box-shadow:-6px 0 14px rgba(18,41,45,.10),0 1px 2px rgba(18,41,45,.10),0 14px 28px rgba(18,41,45,.15);
  transform:translate3d(0,0,0);transform-origin:50% 100%;
  will-change:transform;backface-visibility:hidden;
  transition:transform .55s cubic-bezier(.22,.8,.24,1);}
.jm-sth.is-book .jm-sth-pg .jm-scorepage{height:100%;}
@media (hover:hover){
  /* '\uACE1\uC9D1\uC5D0\uC11C \uC545\uBCF4 \uD55C \uC7A5\uC744 \uAEBC\uB0B4\uB294' \uB3D9\uC791 \u2014 \uD45C\uC9C0\uB294 \uC81C\uC790\uB9AC\uC5D0\uC11C \uC870\uAE08\uB9CC \uC816\uD600\uC9C0\uACE0,
     \uC545\uBCF4\uB294 \uC704 \xB7 \uC624\uB978\uCABD\uC73C\uB85C \uBE60\uC838\uB098\uC635\uB2C8\uB2E4. \uCE74\uB4DC \uC0C1\uC790\uB294 \uC6C0\uC9C1\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4(\uC6C0\uC9C1\uC784\uC774 \uACB9\uCE58\uBA74 \uC5B4\uC0C9\uD574\uC9D1\uB2C8\uB2E4). */
  .jm-card:hover .jm-sth.is-book .jm-sth-cv,
  .jm-thumb:focus-visible .jm-sth.is-book .jm-sth-cv{transform:translate3d(-3%,1.5%,0) rotate(-5.5deg);}
  .jm-card:hover .jm-sth.is-book .jm-sth-pg,
  .jm-thumb:focus-visible .jm-sth.is-book .jm-sth-pg{transform:translate3d(3%,-6%,0) rotate(1.8deg);}
  .jm-card:hover .jm-thumb.is-book{transform:none;}
  /* \uC62C\uB9B4 \uB54C\uB294 0.45\uCD08\uB85C \uCC9C\uCC9C\uD788, \uB5C4 \uB54C\uB294 0.3\uCD08\uB85C \uBE68\uB9AC \uB3CC\uC544\uAC11\uB2C8\uB2E4 */
  .jm-sth.is-book .jm-sth-cv,.jm-sth.is-book .jm-sth-pg{transition:transform .3s cubic-bezier(.3,.7,.3,1);}
  .jm-card:hover .jm-sth.is-book .jm-sth-cv,.jm-card:hover .jm-sth.is-book .jm-sth-pg{transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  /* \uBBF8\uB9AC\uBCF4\uAE30 \uBC84\uD2BC\uC740 \uC885\uC774\uAC00 \uB2E4 \uB098\uC628 \uB4A4\uC5D0 */
  .jm-card:hover .jm-thumb.is-book + .jm-thumb-ov{transition-delay:.15s;}
}
@media (prefers-reduced-motion:reduce){
  .jm-sth.is-book .jm-sth-cv,.jm-sth.is-book .jm-sth-pg{transition:none;}
}
/* stack: \uC885\uC774 \uC804\uCCB4 + \uB4A4\uB85C \uB450 \uC7A5\uC774 \uBE44\uCF1C \uBCF4\uC5EC \uC5EC\uB7EC \uBA74\uC9DC\uB9AC PDF\uB85C \uC77D\uD798 */
.jm-sth.is-stack{aspect-ratio:420/594;}
.jm-sth.is-stack .jm-sth-pg{height:100%;overflow:hidden;border-top:3px solid #203BA1;border-radius:2px;box-shadow:0 1px 2px rgba(18,41,45,.10),0 10px 22px rgba(18,41,45,.12);}
.jm-sth-sh{position:absolute;inset:0;background:#FBFAF6;border-radius:2px;box-shadow:0 1px 3px rgba(18,41,45,.12);}
.jm-sth-sh:nth-child(1){transform:translate(9px,7px) rotate(2.2deg);background:#F4F2EC;}
.jm-sth-sh:nth-child(2){transform:translate(5px,3.5px) rotate(1deg);}
.jm-card:hover .jm-thumb .jm-sth svg{transform:none;}
.jm-card:hover .jm-thumb .jm-sth.is-stack{transform:translateY(-3px);}
.jm-card .jm-thumb .jm-sth.is-stack{transition:transform .45s cubic-bezier(.2,.7,.2,1);}
.jm-thumb-meta{position:absolute;top:14px;left:16px;z-index:1;font-size:11px;font-weight:600;color:var(--tx3);
  letter-spacing:.02em;pointer-events:none;font-variant-numeric:tabular-nums;}
.jm-thumb-ov{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:var(--s3);opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .22s,transform .22s;}
.jm-card:hover .jm-thumb-ov,
.jm-thumb-ov:focus-within{opacity:1;transform:none;pointer-events:auto;}
/* \uD130\uCE58 \uAE30\uAE30\uC5D0\uB294 hover\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4. \uD56D\uC0C1 \uBCF4\uC774\uAC8C \uB450\uC9C0 \uC54A\uC73C\uBA74
   \uD734\uB300\uD3F0\xB7\uD0DC\uBE14\uB9BF\uC5D0\uC11C\uB294 \uBBF8\uB9AC\uBCF4\uAE30 \uBC84\uD2BC\uC5D0 \uC601\uC6D0\uD788 \uB2FF\uC744 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4. */
@media (hover:none){
  .jm-thumb-ov{opacity:1;transform:none;pointer-events:auto;}
}
.jm-pv-bt{background:#fff;color:var(--tx);font-size:13px;font-weight:600;padding:11px 20px;
  border-radius:var(--pill);border:none;box-shadow:var(--sh2);letter-spacing:-.2px;
  white-space:nowrap;cursor:pointer;font-family:inherit;}
.jm-pv-bt:hover{background:var(--pt);color:#fff;}
.jm-pv-bt:hover{background:var(--pt);color:#fff;}
.jm-card-tx{display:block;width:100%;text-align:left;background:none;border:none;padding:0 var(--s1);}
.jm-nm{display:block;font-size:15px;color:var(--tx);font-weight:600;line-height:1.45;
  margin-bottom:4px;letter-spacing:-.4px;transition:color .16s;}
.jm-card:hover .jm-nm{color:var(--pt);}
.jm-sub{display:block;font-size:12px;color:var(--tx3);
  margin-bottom:9px;letter-spacing:0;}
.jm-tags{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.jm-tags i{font-style:normal;font-size:11px;color:var(--tx2);background:var(--paper);
  padding:4px 10px;line-height:1.5;border-radius:var(--pill);}
.jm-pr{display:block;font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.5px;}
.jm-bd{display:flex;gap:5px;margin-bottom:var(--s2);}
.jm-bd i{font-style:normal;font-size:11px;letter-spacing:0;padding:4px 10px;line-height:1.5;
  font-weight:600;border-radius:var(--pill);}
.jm-bd i[data-k="new"]{background:var(--red-tint);color:var(--red);}
.jm-bd i[data-k="\uCD94\uCC9C"]{background:var(--teal-tint);color:var(--teal);}
.jm-bd i[data-k="PDF"]{background:var(--pt-tint);color:var(--pt);}

/* \u2500\u2500 filters \u2500\u2500 */
.jm-lbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  border-bottom:1px solid var(--ln);padding-bottom:var(--s3);flex-wrap:wrap;}
.jm-lbar-l{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;min-width:0;}
.jm-lbar-r{display:flex;align-items:center;gap:var(--s4);}
.jm-fbt{display:flex;align-items:center;gap:7px;border:1px solid var(--ln);background:#fff;
  font-size:13px;color:var(--tx2);padding:10px 18px;border-radius:var(--pill);
  transition:all .16s;font-weight:500;}
.jm-fbt:hover{border-color:var(--pt);color:var(--pt);}
.jm-fbt[data-on="1"]{border-color:var(--pt);color:var(--pt);background:var(--pt-tint);}
.jm-fbt[data-on="1"] .jm-fbt-c{transform:rotate(180deg);}
.jm-fbt-c{transition:transform .22s;}
.jm-fbt em{font-style:normal;background:var(--pt);color:#fff;font-size:11px;font-weight:600;
  min-width:17px;height:17px;border-radius:var(--pill);display:flex;align-items:center;
  justify-content:center;padding:0 5px;}
.jm-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.jm-chips button{display:flex;align-items:center;gap:6px;background:var(--pt-tint);
  border:none;color:var(--pt);font-size:12px;padding:8px 14px;border-radius:var(--pill);
  font-weight:500;}
.jm-chips button:hover{background:#E2E7F8;}
.jm-chips .jm-chip-all{background:none;border:none;color:var(--tx3);text-decoration:underline;
  text-underline-offset:2px;padding:6px 4px;}
.jm-fpanel{background:var(--paper);border-radius:var(--r2);padding:var(--s3) var(--s4);
  margin-top:var(--s3);animation:jm-fdown .2s ease both;}
@keyframes jm-fdown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.jm-frow{display:flex;align-items:center;gap:var(--s4);padding:7px 0;}
.jm-flab{font-size:var(--t-xs);color:var(--tx3);letter-spacing:1px;width:46px;flex-shrink:0;}
.jm-fopts{display:flex;gap:6px;flex-wrap:wrap;}
.jm-fopts button{border:1px solid var(--ln);background:#fff;font-size:13px;color:var(--tx2);
  padding:8px 16px;border-radius:var(--pill);transition:all .16s;}
.jm-fopts button:hover{border-color:var(--pt);color:var(--pt);}
.jm-fopts button[data-on="1"]{background:var(--pt);border-color:var(--pt);color:#fff;}
.jm-lcount{font-size:13px;color:var(--tx2);}
.jm-lcount b{color:var(--ink);font-weight:600;}
.jm-lsort{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--tx3);}
.jm-lsort button{background:none;border:none;padding:8px 4px;margin:-8px 0;
  font-size:12px;color:var(--tx3);white-space:nowrap;}
.jm-lsort button[data-on="1"]{color:var(--ink);font-weight:600;}
.jm-lsort i{font-style:normal;color:#DDD;}
.jm-empty{padding:var(--s8) var(--s4);text-align:center;}
.jm-empty b{display:block;font-size:17px;color:var(--ink);font-weight:600;margin-bottom:var(--s2);}
.jm-empty span{display:block;font-size:var(--t-sm);color:var(--tx2);margin-bottom:var(--s4);}
.jm-empty button{background:#fff;border:1px solid var(--ln);font-size:var(--t-sm);
  color:var(--tx);padding:11px 24px;border-radius:var(--pill);}

/* \u2500\u2500 preview modal \u2500\u2500 */
.jm-pv{background:#fff;width:100%;max-width:900px;max-height:90vh;display:flex;
  flex-direction:column;border-radius:var(--r4);overflow:hidden;}
.jm-pv-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  padding:var(--s4);border-bottom:1px solid var(--ln);}
.jm-pv-h b{display:block;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.jm-pv-h span{font-size:var(--t-sm);color:var(--tx2);}
.jm-pv-h button{background:none;border:none;color:var(--tx3);display:flex;padding:4px;}
.jm-pv-h button:hover{color:var(--ink);}
.jm-pv-body{display:grid;grid-template-columns:1fr 268px;gap:0;overflow:hidden;flex:1;min-height:0;}
.jm-pv-stage{background:var(--card);padding:var(--s5);display:flex;align-items:center;
  justify-content:center;position:relative;overflow-y:auto;}
.jm-scorepage{width:100%;max-width:330px;height:auto;display:block;
  box-shadow:0 12px 36px rgba(0,0,0,.16);background:#fff;border-radius:var(--r1);}
.jm-pv-lock{position:absolute;inset:var(--s4);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--s2);text-align:center;color:var(--ink);}
.jm-pv-lock b{font-size:14px;font-weight:600;}
.jm-pv-lock span{font-size:var(--t-xs);color:var(--tx2);max-width:230px;line-height:1.8;}
.jm-pv-side{padding:var(--s4);border-left:1px solid var(--ln);overflow-y:auto;
  display:flex;flex-direction:column;}
.jm-pv-pages{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:var(--s4);}
.jm-pv-pages button{width:34px;height:34px;border:1px solid var(--ln);background:#fff;
  font-size:12px;color:var(--tx2);border-radius:50%;}
.jm-pv-pages button[data-on="1"]{border-color:var(--ink);color:var(--ink);font-weight:600;}
.jm-pv-pages button[data-lock="1"]{color:var(--tx3);background:#FAFAFA;}
.jm-pv-spec{margin:0 0 var(--s4);}
.jm-pv-spec div{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--ln2);}
.jm-pv-spec dt{font-size:var(--t-sm);color:var(--tx3);margin:0;}
.jm-pv-spec dd{font-size:var(--t-sm);color:var(--ink);margin:0;}
.jm-pv-tip{background:var(--pt-tint);border-radius:var(--r2);padding:15px 17px;
  font-size:var(--t-sm);color:var(--tx2);line-height:1.85;margin:0 0 var(--s4);}
.jm-pv-tip b{display:block;color:var(--ink);font-size:var(--t-xs);letter-spacing:.6px;margin-bottom:5px;}
.jm-pv-side .jm-bt{margin-top:auto;flex:none;width:100%;}

/* \u2500\u2500 detail \u2500\u2500 */
.jm-dt{display:grid;grid-template-columns:390px 1fr;gap:var(--s6);align-items:start;}
.jm-dt-img{display:block;width:100%;background:var(--card);padding:var(--s5);border:none;
  border-radius:var(--r4);position:relative;overflow:hidden;}
.jm-dt-img .jm-scorepage{max-width:none;transition:transform .4s cubic-bezier(.2,.7,.2,1);}
.jm-dt-img:hover .jm-scorepage{transform:scale(1.02);}
.jm-dt-imgov{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-size:var(--t-xs);padding:11px;opacity:0;transition:opacity .22s;}
.jm-dt-img:hover .jm-dt-imgov{opacity:1;}
.jm-dt-pv{margin-top:var(--s2);width:100%;}
.jm-dt-h{font-size:30px;font-weight:600;color:var(--ink);letter-spacing:-1.2px;margin:0 0 6px;}
.jm-dt-sub{font-size:var(--t-sm);color:var(--tx2);margin:0 0 var(--s4);}
.jm-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);
  margin:0 0 var(--s4);}
.jm-facts div{background:var(--paper);padding:15px 17px;border-radius:var(--r2);}
.jm-facts dt{font-size:var(--t-xs);color:var(--tx3);margin:0 0 4px;}
.jm-facts dd{font-size:14px;color:var(--ink);margin:0;font-weight:500;}
.jm-dt-desc{font-size:var(--t-body);color:var(--tx2);line-height:1.95;margin:0 0 var(--s4);}

.jm-buy{background:var(--paper);border-radius:var(--r3);padding:var(--s5) var(--s4);}
.jm-buy-h{margin-bottom:var(--s3);}
.jm-buy-h span{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:3px;}
.jm-buy-h b{font-size:var(--t-xs);color:var(--tx2);font-weight:400;}
.jm-buy-qty{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3);}
.jm-buy-presets{display:flex;gap:5px;}
.jm-buy-presets button{border:1px solid var(--ln);background:#fff;font-size:13px;
  color:var(--tx2);padding:9px 16px;border-radius:var(--pill);}
.jm-buy-presets button:hover{border-color:var(--pt);color:var(--pt);}
.jm-buy-presets button[data-on="1"]{border-color:var(--pt);color:#fff;background:var(--pt);}
.jm-buy-note{font-size:13px;color:var(--tx2);line-height:1.8;margin:0 0 var(--s3);
  background:#fff;padding:13px 15px;border-radius:var(--r2);}
.jm-buy-note b{color:var(--pt);font-weight:600;}
.jm-buy-total{display:flex;align-items:baseline;justify-content:space-between;
  padding:var(--s3) 0;border-top:1px solid var(--ln2);margin-bottom:var(--s3);}
.jm-buy-total span{font-size:var(--t-sm);color:var(--tx2);}
.jm-buy-total b{font-size:24px;color:var(--ink);font-weight:600;}
.jm-bt-icon{flex:0 0 52px;}
.jm-assure{list-style:none;margin:var(--s4) 0 0;padding:0;}
.jm-assure li{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--tx2);
  padding:6px 0;}
.jm-assure svg{color:var(--pt);flex-shrink:0;}

.jm-faq{margin:0;}
.jm-faq dt{font-size:var(--t-body);color:var(--ink);font-weight:600;margin-bottom:6px;}
.jm-faq dd{font-size:var(--t-sm);color:var(--tx2);margin:0 0 var(--s4);line-height:1.9;}
.jm-pg{display:flex;justify-content:center;gap:5px;margin-top:64px;}
.jm-pg button{width:34px;height:34px;border:none;background:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2);
  transition:background .16s,color .16s;}
.jm-pg button:hover{background:var(--paper);}
.jm-pg button[data-on="1"]{background:var(--pt);color:#fff;font-weight:600;}

/* detail */
.jm-qty{display:inline-flex;align-items:center;border:1px solid var(--ln);height:40px;
  background:#fff;border-radius:var(--pill);padding:0 4px;}
.jm-qty button{width:32px;height:32px;background:none;border:none;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--tx2);transition:background .16s;}
.jm-qty button:hover:not(:disabled){background:var(--paper);color:var(--pt);}
.jm-qty button:disabled{color:#CCC;}
.jm-qty span{width:46px;text-align:center;font-size:14px;}
.jm-acts{display:flex;gap:6px;margin-top:16px;}
/* \uBC84\uD2BC \uC774\uB984\uC740 \uD56D\uC0C1 \uD55C \uC904\uB85C \uB461\uB2C8\uB2E4. \uB450 \uC904\uB85C \uC811\uD788\uBA74 \uC54C\uC57D \uBAA8\uC591\uC774 \uBB34\uB108\uC9C0\uACE0
   \uBB34\uC5C7\uC744 \uD558\uB294 \uBC84\uD2BC\uC778\uC9C0 \uD55C\uB208\uC5D0 \uC77D\uD788\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uC881\uC544\uC9C0\uBA74 \uAE00\uC790\uAC00 \uC544\uB2C8\uB77C
   \uBC84\uD2BC \uD3ED\uC774 \uC904\uB3C4\uB85D min-width:0\uC744 \uD568\uAED8 \uB461\uB2C8\uB2E4. */
.jm-bt{height:52px;border:1px solid var(--ln);background:#fff;color:var(--tx);font-size:15px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;flex:1;
  min-width:0;white-space:nowrap;padding:0 16px;
  border-radius:var(--pill);letter-spacing:-.3px;
  transition:border-color .16s,color .16s,background .16s,box-shadow .16s;}
.jm-bt:hover{border-color:var(--pt);color:var(--pt);}
.jm-bt-main{background:var(--pt);border-color:var(--pt);color:#fff;flex:1.7;}
.jm-bt-main:hover{background:var(--pt2);border-color:var(--pt2);color:#fff;
  box-shadow:0 8px 20px rgba(20,40,160,.24);}
.jm-bt-main:disabled{background:#C6C6C6;border-color:#C6C6C6;color:#fff;cursor:default;box-shadow:none;}
.jm-bt-sm{height:30px;font-size:12px;padding:0 13px;flex:none;}
.jm-flash{border:1px solid #C9CEE6;background:#F5F6FC;padding:13px 15px;margin-top:16px;
  font-size:12px;display:flex;gap:9px;align-items:flex-start;line-height:1.75;}
.jm-flash button{background:none;border:none;padding:0;font-size:12px;color:var(--pt);
  text-decoration:underline;text-underline-offset:2px;}

/* tabs */
.jm-songs{width:100%;border-collapse:collapse;margin-top:18px;}
.jm-songs th{background:#5B6B7C;color:#fff;font-size:12px;font-weight:400;padding:9px 12px;text-align:left;}
.jm-songs td{border-bottom:1px solid var(--ln2);padding:9px 12px;font-size:12px;color:#555;}
.jm-songs tr[data-me="1"] td{background:#F5F6FC;color:var(--pt);font-weight:500;}

/* order tables */
.jm-otb{width:100%;border-collapse:collapse;margin-top:24px;}
.jm-otb thead th{border-top:1px solid #333;border-bottom:1px solid var(--ln);background:#FAFAFA;
  padding:11px 10px;font-size:12px;color:#666;font-weight:400;}
.jm-otb td{border-bottom:1px solid var(--ln2);padding:16px 10px;font-size:13px;vertical-align:middle;}
.jm-c{text-align:center;} .jm-r{text-align:right;}
.jm-mini{display:flex;gap:14px;align-items:center;}
.jm-mth{width:54px;flex-shrink:0;}
.jm-mth svg{filter:drop-shadow(2px 3px 5px rgba(0,0,0,.14));}
.jm-mnm{font-size:13px;color:#333;margin-bottom:3px;}
.jm-msb{font-size:11px;color:var(--tx3);}
.jm-x{background:none;border:1px solid #DDD;color:#999;font-size:11px;padding:4px 9px;}
.jm-x:hover{border-color:#AAA;color:#666;}
.jm-sum{border-top:1px solid #333;background:#FAFAFA;padding:20px 18px;display:flex;
  align-items:baseline;justify-content:flex-end;gap:14px;}
.jm-sum span{font-size:12px;color:var(--tx2);}
.jm-sum b{font-size:24px;color:var(--pt);}
.jm-mid{display:flex;justify-content:center;gap:6px;margin-top:34px;}
.jm-mid .jm-bt{flex:none;min-width:180px;}
.jm-blank{border:1px solid var(--ln);padding:76px 20px;text-align:center;color:var(--tx3);
  font-size:13px;margin-top:24px;line-height:2.1;}
.jm-blank button{background:none;border:none;color:var(--pt);font-size:13px;
  text-decoration:underline;text-underline-offset:3px;padding:9px 8px;margin-top:4px;}
.jm-steps{display:flex;justify-content:center;gap:32px;margin:0 0 40px;font-size:12px;color:var(--tx3);}
.jm-steps b{color:var(--pt);font-weight:500;}
.jm-sec{font-size:14px;font-weight:500;color:#222;margin:44px 0 0;padding-bottom:12px;
  border-bottom:1px solid #333;letter-spacing:-.3px;}
.jm-ftb{width:100%;border-collapse:collapse;}
.jm-ftb th{width:130px;border-bottom:1px solid var(--ln2);padding:13px 4px;font-size:12px;
  color:var(--tx3);font-weight:400;text-align:left;}
.jm-ftb td{border-bottom:1px solid var(--ln2);padding:13px 4px;font-size:13px;color:#444;}
.jm-pays{display:flex;flex-wrap:wrap;gap:6px;padding:22px 0 6px;}
.jm-pay{border:1px solid #DDD;background:#fff;padding:11px 18px;font-size:13px;color:#555;
  display:flex;align-items:center;gap:7px;}
.jm-pay[data-on="1"]{border-color:var(--pt);color:var(--pt);font-weight:500;background:#F7F8FD;}
.jm-rd{width:12px;height:12px;border:1px solid #CCC;border-radius:50%;display:flex;
  align-items:center;justify-content:center;}
.jm-pay[data-on="1"] .jm-rd{border-color:var(--pt);}
.jm-pay[data-on="1"] .jm-rd::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--pt);}
.jm-agree{border:1px solid var(--ln);background:#FCFCFC;padding:15px 16px;margin-top:24px;
  display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#555;line-height:1.85;
  width:100%;text-align:left;}
.jm-ck{width:14px;height:14px;border:1px solid #BBB;flex-shrink:0;margin-top:2px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;}
.jm-agree[data-on="1"] .jm-ck{background:var(--pt);border-color:var(--pt);}
.jm-hint{font-size:11px;color:var(--tx3);margin-top:9px;line-height:1.8;}
.jm-done{border:1px solid var(--ln);background:#FCFCFC;padding:46px 20px;text-align:center;}
.jm-done-i{width:44px;height:44px;border:1px solid var(--pt);border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;color:var(--pt);}
.jm-done h3{font-size:17px;font-weight:500;color:#222;margin:0 0 8px;}
.jm-done p{font-size:12px;color:var(--tx2);margin:0;}

/* overlays */
.jm-veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px;}
@keyframes jm-rot{to{transform:rotate(360deg);}}

/* cafe24 login */
/* \u2500\u2500 \uAE30\uC874 \uC1FC\uD551\uBAB0 \uB85C\uADF8\uC778 \uD398\uC774\uC9C0 (\uC804\uCCB4 \uD654\uBA74 \uC774\uB3D9) \u2500\u2500 */
.c2{position:fixed;inset:0;background:#fff;z-index:70;overflow-y:auto;}
.c2-hd{border-bottom:1px solid var(--ln);background:#fff;}
.c2-hd-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.c2-brand{display:flex;align-items:center;gap:9px;}
.c2-brand b{font-size:15px;font-weight:700;letter-spacing:-.5px;color:var(--tx);}
.c2-back{background:none;border:1px solid var(--ln);border-radius:var(--pill);
  padding:9px 16px;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px;
  white-space:nowrap;}
.c2-back:hover{border-color:var(--pt);color:var(--pt);}
.c2-body{max-width:390px;margin:0 auto;padding:var(--s7) var(--pad) var(--s8);}
.c2-from{background:var(--pt-tint);color:var(--pt);border-radius:var(--r2);
  padding:13px 16px;font-size:13px;line-height:1.75;margin-bottom:var(--s5);}
.c2-h{font-size:30px;font-weight:700;letter-spacing:-1.2px;color:var(--tx);margin:0 0 var(--s2);}
.c2-sub{font-size:14px;color:var(--tx2);margin:0 0 var(--s5);}
.c2-lb{display:block;font-size:13px;color:var(--tx2);margin-bottom:7px;font-weight:500;}
.c2-in{width:100%;border:1px solid var(--ln);border-radius:var(--r2);padding:14px 15px;
  font-size:14px;font-family:inherit;margin-bottom:var(--s3);color:var(--tx);}
.c2-in:focus{outline:none;border-color:var(--pt);}
.c2-in::placeholder{color:#B8B8B8;}
.c2-err{font-size:13px;color:var(--rd);margin:-8px 0 var(--s3);}
.c2-keep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);
  background:none;border:none;padding:0 0 var(--s4);font-family:inherit;}
.c2-kb{width:16px;height:16px;border:1px solid var(--ln);border-radius:var(--r1);display:flex;
  align-items:center;justify-content:center;color:#fff;}
.c2-keep[data-on="1"] .c2-kb{background:var(--pt);border-color:var(--pt);}
.c2-go{width:100%;background:var(--pt);color:#fff;border:none;border-radius:var(--pill);
  padding:16px;font-size:15px;font-weight:600;font-family:inherit;transition:background .16s;}
.c2-go:hover{background:var(--pt2);}
.c2-go:disabled{background:#C6C6C6;}
.c2-links{display:flex;justify-content:center;align-items:center;gap:var(--s3);margin-top:var(--s4);}
.c2-links button{background:none;border:none;color:var(--tx2);font-size:13px;font-family:inherit;padding:0;}
.c2-links button:hover{color:var(--pt);}
.c2-links i{width:1px;height:11px;background:var(--ln);}
.c2-scope{background:var(--paper);border-radius:var(--r2);padding:15px 17px;margin-top:var(--s5);
