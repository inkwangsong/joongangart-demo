  font-size:12px;color:var(--tx2);line-height:1.85;}
.c2-scope b{color:var(--tx);font-weight:600;}
.c2-test{border:1px dashed #C5CAE2;background:#fff;border-radius:var(--r2);padding:14px 16px;
  margin-top:var(--s3);font-size:12px;color:var(--tx2);line-height:1.85;text-align:center;}
.c2-test b{display:block;color:var(--pt);font-size:11px;font-weight:700;margin-bottom:5px;}
.c2-test button{border:1px solid var(--pt);background:#fff;color:var(--pt);font-size:12px;
  padding:7px 16px;border-radius:var(--pill);margin-top:10px;font-family:inherit;display:block;
  margin-left:auto;margin-right:auto;}
.c2-test button:hover{background:var(--pt);color:#fff;}
.c2-cancel{display:block;width:100%;background:none;border:none;color:var(--tx3);font-size:13px;
  font-family:inherit;margin-top:var(--s5);padding:8px;text-decoration:underline;
  text-underline-offset:3px;}
.c2-cancel:hover{color:var(--tx);}

/* download modal */
.jm-md{background:#fff;width:100%;max-width:392px;border-radius:var(--r4);overflow:hidden;}
.jm-md-h{border-bottom:1px solid var(--ln);padding:14px 18px;display:flex;
  align-items:center;justify-content:space-between;}
.jm-md-h b{font-size:13px;font-weight:500;}
.jm-md-h button{background:none;border:none;color:var(--tx3);display:flex;padding:3px;
  border-radius:50%;}
.jm-md-h button:hover{background:var(--paper);color:var(--tx);}
.jm-md-stage{background:var(--card);padding:var(--s4);display:flex;justify-content:center;}
.jm-md-f{padding:var(--s3) var(--s4) 0;font-size:var(--t-xs);color:var(--tx3);
  line-height:1.85;text-align:center;}
.jm-md-f b{color:var(--tx);font-weight:600;}
.jm-md-acts{display:flex;gap:10px;padding:var(--s3) var(--s4) var(--s4);}

/* \u2500\u2500 \uC778\uC1C4 \u2500\u2500
   \uD654\uBA74\uC5D0\uC11C\uB294 \uC228\uAE30\uACE0 \uC778\uC1C4\uD560 \uB54C\uB9CC \uAEBC\uB0C5\uB2C8\uB2E4. \uD55C \uBA74\uC529 \uB04A\uC5B4 A4\uB85C \uB098\uAC11\uB2C8\uB2E4.
   \uC774 \uC778\uC1C4 CSS\uB294 "\uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uC9C0"\uB97C \uC704\uD55C \uAC83\uC774\uACE0, \uC2E4\uC81C \uBCF4\uD638\uB294
   \uB0B4\uB824\uBC1B\uB294 \uC2DC\uC810\uC5D0 \uC11C\uBC84\uAC00 PDF \uC548\uC5D0 \uC6CC\uD130\uB9C8\uD06C\uB97C \uAD6C\uC6CC \uB123\uB294 \uAC83\uC73C\uB85C \uD569\uB2C8\uB2E4. */
.jm-print{display:none;}
@media print{
  /* position:fixed/absolute \uC548\uC5D0\uC11C\uB294 \uBA74 \uB098\uB214\uC774 \uC0DD\uAE30\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
     \uC778\uC1C4\uD560 \uB54C\uB294 \uB36E\uAC1C\uB97C \uD3C9\uBC94\uD55C \uD750\uB984\uC73C\uB85C \uB418\uB3CC\uB824\uC57C \uD55C \uBA74\uC529 \uB04A\uAE41\uB2C8\uB2E4. */
  .jm > *{display:none !important;}
  .jm > .jm-veil{display:block !important;position:static !important;inset:auto !important;
    background:none !important;padding:0 !important;overflow:visible !important;}
  .jm-veil > .jm-md{display:none !important;}
  .jm-print{display:block !important;width:100% !important;}
  .jm-print-pg{break-after:page;page-break-after:always;width:100%;}
  .jm-print-pg:last-child{break-after:auto;page-break-after:auto;}
  /* \uD654\uBA74\uC6A9 .jm-scorepage\uC758 max-width:330px\uC640 \uADF8\uB9BC\uC790\uB97C \uC885\uC774\uC5D0\uC11C\uB294 \uD489\uB2C8\uB2E4 */
  .jm-print-pg .jm-scorepage{display:block;width:100% !important;max-width:none !important;
    height:auto;box-shadow:none !important;border-radius:0 !important;}
  @page{size:A4 portrait;margin:8mm;}
}


/* \u2500\u2500 1. \uBA54\uC778 \uBC30\uB108 \uCE90\uB7EC\uC140 \u2500\u2500 */
.jm-hero{position:relative;overflow:hidden;transition:background .5s ease;}
.jm-hero[data-tone="blue"]{background:linear-gradient(150deg,#2A47B8,#141F5E);}
.jm-hero[data-tone="wine"]{background:linear-gradient(150deg,#9E2547,#5E1428);}
.jm-hero[data-tone="teal"]{background:linear-gradient(150deg,#26616A,#12333A);}
.jm-hero-in{max-width:1200px;margin:0 auto;padding:var(--s7) var(--pad) var(--s8);
  display:grid;grid-template-columns:1.06fr .94fr;gap:var(--s6);align-items:center;
  min-height:340px;
  animation:jm-slidein .5s cubic-bezier(.2,.7,.2,1) both;}
.jm-hero-tx{min-height:250px;display:flex;flex-direction:column;justify-content:center;}
@keyframes jm-slidein{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.jm-hero-k{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:1.6px;
  color:var(--lime);margin-bottom:var(--s4);}
.jm-hero-tx h1{font-size:clamp(32px,4.4vw,54px);font-weight:750;letter-spacing:-2.6px;
  color:#fff;margin:0 0 var(--s3);line-height:1.14;}
.jm-hero-tx p{font-size:17px;color:rgba(255,255,255,.72);margin:0 0 var(--s5);line-height:1.8;
  max-width:440px;}
/* \uBD80\uBAA8(.jm-hero-tx)\uAC00 \uC138\uB85C flex\uB77C \uADF8\uB0E5 \uB450\uBA74 \uAE00\uC790 \uD3ED\uC774 \uC544\uB2C8\uB77C \uCE78 \uD3ED(541px)\uC73C\uB85C
   \uB298\uC5B4\uB0A9\uB2C8\uB2E4. align-self\uB85C \uAE00\uC790\uB9CC\uD07C\uB9CC \uCC28\uC9C0\uD558\uAC8C \uD569\uB2C8\uB2E4.
   \uD734\uB300\uD3F0\uC5D0\uC11C\uB294 \uC544\uB798 640px \uADDC\uCE59\uC5D0\uC11C \uC77C\uBD80\uB7EC \uAF49 \uCC44\uC6C1\uB2C8\uB2E4 \u2014 \uC5C4\uC9C0\uB85C \uB204\uB974\uAE30 \uC27D\uAC8C. */
.jm-hero-cta{background:var(--lime);color:var(--ink);border:none;border-radius:var(--pill);
  padding:16px 36px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;
  justify-content:center;min-width:240px;
  gap:10px;transition:background .16s,transform .16s;align-self:flex-start;white-space:nowrap;}
.jm-hero-cta:hover{background:#D6F76B;transform:translateY(-1px);}
.jm-hero-cta i{font-style:normal;transition:transform .22s;display:inline-block;}
.jm-hero-cta:hover i{transform:translateX(4px);}

/* \uC2AC\uB77C\uC774\uB4DC\uB9C8\uB2E4 \uADF8\uB9BC \uB192\uC774\uAC00 \uB2EC\uB77C \uD654\uBA74\uC774 \uBC00\uB9AC\uC9C0 \uC54A\uB3C4\uB85D \uACE0\uC815\uD569\uB2C8\uB2E4 */
.jm-hero-art{display:flex;align-items:center;justify-content:center;
  height:340px;flex-shrink:0;}
.jm-hero-art-svg{width:100%;max-width:460px;height:100%;display:block;}
.jm-hero-img{width:100%;max-width:460px;height:100%;object-fit:cover;
  border-radius:var(--r3);display:block;box-shadow:0 18px 44px rgba(0,0,0,.3);}
.jm-hero-covers{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;}
.jm-hero-covers .a{position:relative;z-index:2;
  filter:drop-shadow(0 20px 46px rgba(0,0,0,.42));}
.jm-hero-covers .b{position:absolute;left:16%;top:8%;transform:rotate(-7deg);opacity:.85;
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.34));}

/* \uCEE8\uD2B8\uB864 */
.jm-hero-ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;max-width:1200px;
  margin:0 auto;padding:0 var(--pad) var(--s5);display:flex;align-items:center;
  justify-content:space-between;gap:var(--s4);pointer-events:none;}
.jm-hero-ctl>*{pointer-events:auto;}
.jm-hero-idx{display:flex;align-items:center;gap:var(--s3);}
.jm-hero-idx button{background:none;border:none;padding:9px 5px;font-family:var(--mono);
  font-size:11px;color:rgba(255,255,255,.62);transition:color .2s;}
.jm-hero-idx button[data-on="1"]{color:var(--lime);font-weight:700;}
.jm-hero-idx button:hover{color:#fff;}
.jm-hero-idx i{width:86px;height:3px;background:rgba(255,255,255,.2);display:block;
  overflow:hidden;border-radius:var(--pill);}
.jm-hero-idx i em{display:block;height:100%;width:100%;background:var(--lime);
  transform-origin:left;transform:scaleX(0);border-radius:var(--pill);}
.jm-hero-idx i em[data-play="1"]{animation:jm-prog 6.5s linear forwards;}
@keyframes jm-prog{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.jm-hero-arws{display:flex;gap:6px;}
.jm-arw{width:40px;height:40px;border:1px solid rgba(255,255,255,.32);background:none;
  color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;
  justify-content:center;border-radius:50%;transition:background .16s,color .16s;}
.jm-arw:hover{background:#fff;color:var(--ink);}

/* \uC808\uAE30 \uC120\uD0DD \uBC14 */
.jm-quick{background:var(--paper);border-bottom:1px solid var(--ln);}
/* \uBC14\uB85C \uCC3E\uAE30 \u2014 \uC774\uC815\uD45C. \uCF58\uD150\uCE20\uCC98\uB7FC \uBCF4\uC774\uC9C0 \uC54A\uAC8C \uC587\uC740 \uD55C \uC904 */
.jm-quick-in{display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap;}
.jm-quick-q{font-size:13px;font-weight:700;color:var(--tx);margin-right:6px;white-space:nowrap;}
.jm-quick-g{display:flex;gap:6px;flex-wrap:wrap;}
.jm-quick-g button{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--ln);
  border-radius:var(--pill);padding:8px 14px;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;
  transition:border-color .16s,color .16s;}
.jm-quick-g button:hover{border-color:var(--pt);color:var(--pt);}
.jm-quick-g button svg{flex-shrink:0;}
.jm-quick-g button em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--tx3);font-weight:500;}
.jm-quick-g button[data-k="cond"]{font-weight:500;color:var(--tx2);}
.jm-quick-div{width:1px;height:20px;background:var(--ln);margin:0 4px;}

/* \u2500\u2500 \uC774\uBC88 \uC808\uAE30 \uC900\uBE44 \u2500\u2500 \uB760(D-day) + \uC544\uB798 \uB450 \uCE78(\uC911\uC559\uC544\uD2B8 \uCD94\uCC9C \xB7 \uC9C0\uB09C \uC808\uAE30 \uB9CE\uC774 \uBD80\uB978 \uACE1) */
.jm-season{margin-top:var(--s6);}
.jm-season .jm-up{margin-top:0;}
.jm-season .jm-up:not(:last-child){border-radius:var(--r3) var(--r3) 0 0;}
.jm-now{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-top:0;
  border-radius:0 0 var(--r3) var(--r3);background:#fff;}
.jm-now[data-cols="1"]{grid-template-columns:1fr;}
@media (min-width:901px){
  .jm-now[data-cols="1"] .jm-now-col{display:grid;grid-template-columns:300px minmax(0,1fr);column-gap:48px;
    grid-template-areas:"h list" "lead list" "more list";align-content:start;}
  .jm-now[data-cols="1"] .jm-now-h{grid-area:h;flex-direction:column;align-items:flex-start;gap:4px;}
  .jm-now[data-cols="1"] .jm-now-lead{grid-area:lead;}
  .jm-now[data-cols="1"] .jm-now-list{grid-area:list;margin:0;}
  .jm-now[data-cols="1"] .jm-now-more{grid-area:more;align-self:start;justify-self:start;}
}
.jm-now-ls{margin-left:auto;padding:7px 13px !important;font-size:12px !important;}
.jm-now-col{padding:var(--s4) var(--s5) var(--s5);min-width:0;}
.jm-now-col + .jm-now-col{border-left:1px solid var(--ln2);}
.jm-now-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.jm-now-h b{font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.4px;}
.jm-now-h span{font-size:12px;color:var(--tx3);}
.jm-now-lead{font-size:13px;color:var(--tx2);line-height:1.7;margin:0 0 10px;}
.jm-now-list{list-style:none;margin:0;padding:0;}
.jm-now-list li{display:grid;grid-template-columns:18px 36px 1fr auto;align-items:center;gap:12px;
  padding:9px 0;border-top:1px solid var(--ln2);}
.jm-now-n{font-family:var(--mono);font-size:12px;color:var(--tx3);text-align:center;}
.jm-now-cv{background:none;border:none;padding:0;display:block;border-radius:var(--r1);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.14);}
.jm-now-tx{background:none;border:none;padding:0;text-align:left;min-width:0;}
.jm-now-tx b{display:block;font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.jm-now-tx:hover b{color:var(--pt);}
.jm-now-tx em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-top:1px;}
.jm-now-r{font-family:var(--mono);font-size:12px;color:var(--tx2);white-space:nowrap;}
.jm-now-more{background:none;border:none;padding:10px 0 0;text-align:left;font-size:13px;font-weight:600;color:var(--pt);}
.jm-now-more i{font-style:normal;display:inline-block;transition:transform .2s;}
.jm-now-more:hover i{transform:translateX(3px);}

.jm-bk-bt{background:var(--pt);color:#fff;border:none;border-radius:var(--pill);
  padding:14px 28px;font-size:14px;font-weight:600;transition:background .16s;}
.jm-bk-bt:hover{background:var(--pt2);}
.jm-bk-link{background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:14px 24px;font-size:14px;font-weight:600;color:var(--tx);display:flex;
  align-items:center;gap:8px;text-decoration:none;}
.jm-bk-link:hover{border-color:var(--pt);color:var(--pt);}
.jm-bk-link span{transition:transform .22s;display:inline-block;}
.jm-bk-link:hover span{transform:translateX(4px);}



/* \u2500\u2500 \uB2E4\uAC00\uC624\uB294 \uC808\uAE30 (D-day) \u2500\u2500
   \uBA54\uC778 \uBC30\uB108\uB294 \uC0C9\uC774 \uAF49 \uCC2C \uB113\uC740 \uBA74\uC774\uBBC0\uB85C, \uC5EC\uAE30\uB294 \uBC1D\uC740 \uCE74\uB4DC\uB85C \uD615\uC2DD\uC744 \uB2EC\uB9AC\uD569\uB2C8\uB2E4.
   \uBC30\uB108\uAC00 \uC5B4\uB5A4 \uC0C9\uC73C\uB85C \uBC14\uB00C\uC5B4\uB3C4 \uACB9\uCCD0 \uBCF4\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \u2500\u2500 */
.jm-up{position:relative;overflow:hidden;border-radius:var(--r3);margin-top:var(--s6);
  padding:var(--s5);background:#fff;border:1px solid var(--ln);box-shadow:var(--sh1);}
.jm-up-bg{position:absolute;right:0;top:0;bottom:0;width:46%;height:100%;
  pointer-events:none;}
.jm-up-in{position:relative;z-index:2;display:flex;align-items:flex-end;
  justify-content:space-between;gap:var(--s5);flex-wrap:wrap;}
.jm-up-l{display:flex;align-items:flex-end;gap:var(--s4);}
.jm-up-d{font-family:var(--mono);font-size:clamp(38px,5.2vw,66px);font-weight:700;
  letter-spacing:-3px;line-height:.84;flex-shrink:0;}
.jm-up[data-tone="xmas"] .jm-up-d{color:var(--red);}
.jm-up[data-tone="easter"] .jm-up-d{color:var(--teal);}
.jm-up-tag{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1.4px;
  margin-bottom:8px;}
.jm-up[data-tone="xmas"] .jm-up-tag{color:var(--red);}
.jm-up[data-tone="easter"] .jm-up-tag{color:var(--teal);}
.jm-up-l b{display:block;font-size:clamp(18px,2vw,24px);font-weight:700;color:var(--tx);
  letter-spacing:-1px;margin-bottom:6px;line-height:1.2;}
.jm-up-l em{font-style:normal;font-size:14px;color:var(--tx2);line-height:1.75;
  display:block;max-width:430px;}
.jm-up-bt{border:none;border-radius:var(--pill);color:#fff;
  padding:14px 26px;font-size:14px;font-weight:700;white-space:nowrap;display:flex;
  align-items:center;gap:9px;transition:background .16s,transform .16s;flex-shrink:0;}
.jm-up[data-tone="xmas"] .jm-up-bt{background:var(--red);}
.jm-up[data-tone="xmas"] .jm-up-bt:hover{background:var(--red2);}
.jm-up[data-tone="easter"] .jm-up-bt{background:var(--teal);}
.jm-up[data-tone="easter"] .jm-up-bt:hover{background:var(--teal2);}
.jm-up-bt:hover{transform:translateY(-1px);}
.jm-up-bt i{font-style:normal;transition:transform .22s;display:inline-block;}
.jm-up-bt:hover i{transform:translateX(4px);}

/* \u2500\u2500 sections \u2500\u2500 */
.jm-sect{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
  margin:var(--s8) 0 var(--s4);}
.jm-sect-l{display:flex;align-items:flex-start;gap:var(--s3);}
.jm-sect-n{font-size:var(--t-xs);color:var(--pt);background:var(--pt-tint);
  padding:5px 12px;border-radius:var(--pill);flex-shrink:0;margin-top:7px;font-weight:600;}
.jm-sect h3{font-size:var(--t-h1);font-weight:700;color:var(--tx);letter-spacing:-1.4px;
  margin:0 0 5px;line-height:1.25;}
.jm-sect p{font-size:var(--t-sm);color:var(--tx2);margin:0;}
.jm-sect-more{background:#fff;border:1px solid var(--ln);font-size:14px;color:var(--tx);
  padding:11px 20px;border-radius:var(--pill);display:flex;align-items:center;gap:7px;
  white-space:nowrap;font-weight:600;transition:border-color .16s,color .16s;}
.jm-sect-more:hover{border-color:var(--pt);color:var(--pt);}
.jm-sect-more span{transition:transform .22s;display:inline-block;}
.jm-sect-more:hover span{transform:translateX(4px);}

/* \u2500\u2500 \uACE1\uC9D1 \u2500\u2500 */
.jm-books{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);}
.jm-book-c{background:var(--card);border:none;border-radius:var(--r3);padding:var(--s5) var(--s3);
  text-align:center;transition:box-shadow .22s,transform .22s;display:block;}
.jm-book-c:hover{box-shadow:var(--sh2);transform:translateY(-3px);}
.jm-book-img{display:block;margin-bottom:var(--s3);}
.jm-book-img svg{margin:0 auto;border-radius:var(--r1);
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.16));transition:transform .4s cubic-bezier(.2,.7,.2,1);}
.jm-book-c:hover .jm-book-img svg{transform:scale(1.04);}
.jm-book-c b{display:block;font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.4px;
  line-height:1.45;margin-bottom:4px;}
.jm-book-c em{font-style:normal;font-size:12px;color:var(--tx2);}

/* \u2500\u2500 \uC7AC\uBC29\uBB38 \uC778\uC0AC \u2500\u2500 */
.jm-wel{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  border:1px solid var(--ln);border-radius:var(--r3);padding:var(--s4) var(--s5);
  margin-top:var(--s6);flex-wrap:wrap;}
.jm-wel b{display:block;font-size:17px;font-weight:600;color:var(--tx);letter-spacing:-.5px;
  margin-bottom:3px;}
.jm-wel em{font-style:normal;font-size:13px;color:var(--tx2);}
.jm-wel button{background:var(--pt);color:#fff;border:none;border-radius:var(--pill);
  padding:12px 22px;font-size:14px;font-weight:600;white-space:nowrap;}
.jm-wel button:hover{background:var(--pt2);}

/* \u2500\u2500 footer \u2500\u2500 */
.jm-ft{border-top:1px solid var(--ln);margin-top:var(--s7);position:relative;}
.jm-ft-mark{background:#fff;padding:var(--s6) var(--pad) var(--s4);text-align:center;
  border-bottom:1px solid var(--ln2);}
.jm-ft-mark span{display:block;font-size:clamp(26px,4.2vw,44px);font-weight:700;color:var(--tx);
  letter-spacing:-1.6px;line-height:1.1;}
.jm-ft-mark em{display:block;font-style:normal;font-size:var(--t-xs);color:var(--tx3);
  letter-spacing:1px;margin-top:var(--s2);}
.jm-ft-hex{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:14px;height:14px;background:var(--pt);border-radius:var(--r1);}
.jm-ft-in{max-width:1200px;margin:0 auto;padding:46px var(--pad) 40px;display:grid;
  grid-template-columns:1.1fr 1.15fr .75fr 1.5fr;}
.jm-ft-col{padding:0 var(--s5);border-right:1px solid var(--ln2);}
.jm-ft-col:first-child{padding-left:0;}
.jm-ft-col:last-child{border-right:0;padding-right:0;position:relative;}
.jm-ft h4{font-size:15px;letter-spacing:.4px;color:var(--tx);font-weight:600;margin:0 0 18px;}
.jm-cs{font-size:clamp(20px,2vw,28px);color:var(--tx);font-weight:700;letter-spacing:-1px;line-height:1.25;white-space:nowrap;}
.jm-cs-l{font-size:14px;color:var(--tx2);margin:14px 0 2px;}
.jm-hr{width:32px;height:3px;background:var(--pt);border-radius:var(--pill);margin:18px 0 14px;}
.jm-ft-sm{font-size:12px;color:var(--tx2);line-height:2;}
.jm-bank{font-size:12px;color:var(--tx2);line-height:1.95;margin-top:8px;}
.jm-ibank{border:1px solid var(--ln);background:#fff;border-radius:var(--pill);padding:11px 16px;
  margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-size:12px;color:var(--tx2);width:100%;white-space:nowrap;}
.jm-ibank:hover{border-color:var(--pt);color:var(--pt);}
.jm-gicons{display:flex;gap:9px;margin-bottom:26px;}
.jm-gicons i{width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;
  align-items:center;justify-content:center;color:var(--tx2);font-style:normal;}
.jm-ntabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px;}
.jm-ntabs button{background:none;border:none;padding:8px 14px;font-size:12px;color:var(--tx3);
  border-radius:var(--r1) var(--r1) 0 0;}
.jm-ntabs button[data-on="1"]{background:var(--paper);color:var(--tx);font-weight:600;}
.jm-nlist{list-style:none;margin:0;padding:0;}
.jm-nlist li{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--tx2);
  line-height:2.15;}
.jm-nlist li span{color:var(--tx3);font-size:11px;flex-shrink:0;}
.jm-nlist li b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jm-ilinks{display:flex;flex-direction:column;gap:8px;}
.jm-ilinks i{font-style:normal;border:1px solid var(--ln);border-radius:var(--r1);
  padding:11px 15px;font-size:13px;color:var(--tx2);}
.jm-ilinks i[data-on="1"]{color:var(--pt);font-weight:700;border-color:var(--pt);}
.jm-co{font-size:12px;color:var(--tx2);line-height:2.05;}
.jm-co em{font-style:normal;color:var(--pt);}
.jm-rex{margin-top:22px;}
.jm-rex h4{margin-bottom:12px;}
.jm-rbt{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.jm-rbt i{font-style:normal;font-size:12px;padding:8px 14px;border:1px solid var(--ln);
  border-radius:var(--pill);color:var(--tx2);display:flex;align-items:center;gap:6px;}
.jm-rbt i:first-child{background:var(--pt);color:#fff;border-color:var(--pt);}
.jm-ft-up{position:absolute;right:0;top:0;background:none;border:1px solid var(--ln);
  border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--tx2);}
.jm-ft-up:hover{border-color:var(--pt);color:var(--pt);}
.jm-ft-bot{border-top:1px solid var(--ln2);padding:26px 0 40px;}
.jm-ft-bot-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);display:flex;
  justify-content:space-between;align-items:flex-start;gap:30px;flex-wrap:wrap;}
.jm-pays-lg{display:flex;gap:12px;align-items:center;}
.jm-paypal{border:1px solid var(--ln);border-radius:var(--r1);padding:9px 18px;font-size:15px;
  font-weight:700;font-style:italic;}
.jm-paypal span{color:#253B80;}
.jm-paypal em{color:#179BD7;font-style:italic;}
.jm-katalk{background:#FEE500;border-radius:var(--r1);padding:10px 16px;font-size:13px;
  color:#3C1E1E;display:flex;align-items:center;gap:7px;}
.jm-certs{text-align:right;font-size:11px;color:var(--tx3);line-height:2;}
.jm-certs .jm-kg{background:var(--paper);padding:2px 8px;border-radius:var(--r1);color:var(--tx2);}
.jm-certs button{border:1px solid var(--ln);background:none;border-radius:var(--pill);
  font-size:11px;color:var(--tx2);padding:4px 11px;}

/* \u2500\u2500 \uBCA0\uC2A4\uD2B8 \uC21C\uC704 \u2500\u2500 */
.jm-best{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln);}
.jm-best li{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s2);
  border-bottom:1px solid var(--ln2);transition:background .16s;}
.jm-best li:hover{background:var(--paper2);}
.jm-best-r{width:34px;flex-shrink:0;text-align:center;font-size:20px;font-weight:700;
  color:var(--tx3);letter-spacing:-1px;}
.jm-best-r[data-top="1"]{color:var(--pt);}
.jm-best-th{background:none;border:none;padding:0;flex-shrink:0;line-height:0;
  transition:transform .22s;}
.jm-best-th svg{border-radius:var(--r1);box-shadow:0 3px 10px rgba(0,0,0,.14);}
.jm-best li:hover .jm-best-th{transform:scale(1.05);}
.jm-best-tx{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;}
.jm-best-tx b{display:block;font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.4px;
  margin-bottom:3px;}
.jm-best-tx:hover b{color:var(--pt);}
.jm-best-tx em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-bottom:6px;}
.jm-best-tags{display:flex;gap:4px;flex-wrap:wrap;}
.jm-best-tags i{font-style:normal;font-size:11px;color:var(--tx2);background:var(--paper);
  padding:3px 9px;border-radius:var(--pill);}
.jm-best-m{flex-shrink:0;font-size:11px;font-weight:600;width:44px;text-align:center;}
.jm-best-m[data-k="up"]{color:var(--red);}
.jm-best-m[data-k="dn"]{color:#1F6FD0;}
.jm-best-m[data-k="same"]{color:var(--tx3);}
.jm-best-m[data-k="new"]{color:#fff;background:var(--pt);border-radius:var(--pill);
  padding:3px 0;font-size:11px;letter-spacing:.4px;}
.jm-best-p{flex-shrink:0;font-size:15px;font-weight:700;color:var(--tx);width:82px;text-align:right;}
.jm-best-bt{flex-shrink:0;background:#fff;border:1px solid var(--ln);border-radius:var(--pill);
  padding:9px 18px;font-size:13px;font-weight:600;color:var(--tx);}
.jm-best-bt:hover{background:var(--pt);border-color:var(--pt);color:#fff;}
.jm-best-acts{display:flex;gap:6px;flex-shrink:0;}
.jm-best-ls{display:inline-flex;align-items:center;gap:5px;background:var(--lime);border:1px solid var(--lime);border-radius:var(--pill);
  padding:9px 15px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;}
.jm-best-ls:hover{filter:brightness(.95);}
.jm-best-none{padding:var(--s6);text-align:center;color:var(--tx3);font-size:13px;
  border-top:1px solid var(--ln);}
.jm-best-note{font-size:12px;color:var(--tx3);margin:var(--s3) 0 0;line-height:1.8;}

/* \u2500\u2500 \uCD5C\uCD08 \uC5F0\uB3D9 \uB3D9\uC758 \u2500\u2500 */
.c2-give{background:var(--paper);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s4);}
.c2-give>b{display:block;font-size:13px;color:var(--tx);font-weight:700;margin-bottom:var(--s3);}
.c2-give div{display:flex;justify-content:space-between;gap:var(--s3);padding:7px 0;
  border-bottom:1px solid var(--ln2);font-size:13px;}
.c2-give div:last-of-type{border-bottom:0;}
.c2-give span{color:var(--tx3);}
.c2-give em{font-style:normal;color:var(--tx);font-weight:500;}
.c2-give p{font-size:12px;color:var(--tx3);margin:var(--s3) 0 0;line-height:1.7;}
.c2-all{display:flex;align-items:center;gap:10px;width:100%;background:#fff;
  border:1px solid var(--ln);border-radius:var(--r2);padding:16px;font-family:inherit;
  margin-bottom:var(--s2);transition:border-color .16s;}
.c2-all[data-on="1"]{border-color:var(--pt);background:var(--pt-tint);}
.c2-all i{width:22px;height:22px;border-radius:50%;border:1px solid var(--ln);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-style:normal;}
.c2-all[data-on="1"] i{background:var(--pt);border-color:var(--pt);}
.c2-all b{font-size:15px;font-weight:700;color:var(--tx);}
.c2-agrees{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--s5);}
.c2-agree{display:flex;align-items:center;gap:var(--s2);}
.c2-agree>button:first-child{flex:1;display:flex;align-items:flex-start;gap:10px;background:none;
  border:none;padding:11px 4px;font-family:inherit;text-align:left;}
.c2-agree i{width:18px;height:18px;border-radius:50%;border:1px solid var(--ln);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  font-style:normal;margin-top:1px;}
.c2-agree>button[data-on="1"] i{background:var(--pt);border-color:var(--pt);}
.c2-agree b{display:block;font-size:13px;font-weight:500;color:var(--tx);margin-bottom:2px;}
.c2-agree em{font-style:normal;font-size:12px;color:var(--tx3);line-height:1.6;}
.c2-view{background:none;border:none;font-size:12px;color:var(--tx3);font-family:inherit;
  text-decoration:underline;text-underline-offset:3px;padding:6px;flex-shrink:0;}
.c2-view:hover{color:var(--pt);}
.c2-need{font-size:12px;color:var(--rd);text-align:center;margin:var(--s3) 0 0;}
.c2-note{background:var(--paper);border-radius:var(--r2);padding:12px 14px;margin-top:var(--s3);
  font-size:13px;color:var(--tx2);line-height:1.7;}
.c2-note b{color:var(--tx);font-weight:600;}
.c2-note span{display:block;font-size:12px;color:var(--tx3);margin-top:4px;}
.c2-doc-veil{position:fixed;inset:0;background:rgba(18,41,45,.42);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:var(--s4);}
.c2-doc{background:#fff;border-radius:var(--r3);max-width:460px;width:100%;padding:var(--s5);
  box-shadow:0 24px 60px rgba(0,0,0,.18);max-height:86vh;overflow:auto;}
.c2-doc-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:var(--s3);}
.c2-doc-h b{display:block;font-size:17px;color:var(--tx);letter-spacing:-.5px;line-height:1.4;}
.c2-doc-h span{display:block;font-size:12px;color:var(--tx3);margin-top:2px;}
.c2-doc-h button{margin-left:auto;background:none;border:none;color:var(--tx3);cursor:pointer;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.c2-doc-h button:hover{background:var(--paper);color:var(--tx);}
.c2-doc ol{margin:0 0 var(--s4);padding-left:18px;font-size:13px;color:var(--tx2);line-height:1.8;}
.c2-doc li{margin-bottom:8px;}
.jm-hd-name{background:none;border:none;font:inherit;font-size:13px;color:var(--tx);cursor:pointer;
  padding:6px 4px;border-radius:var(--r1);text-decoration:underline;text-decoration-color:transparent;
  text-underline-offset:4px;transition:text-decoration-color .15s;}
.jm-hd-name:hover{text-decoration-color:currentColor;}
.jm-me-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-bottom:var(--s4);}
.jm-me-card{border:1px solid var(--ln);border-radius:var(--r3);padding:var(--s5);background:#fff;}
.jm-me-card h3{font-size:17px;margin:0 0 var(--s3);letter-spacing:-.4px;color:var(--tx);}
.jm-me-card dl{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;margin:0 0 var(--s3);font-size:14px;}
.jm-me-card dt{color:var(--tx3);}
.jm-me-card dd{margin:0;color:var(--tx);word-break:break-all;}
.jm-me-card dd em{font-style:normal;color:var(--tx3);font-size:12px;margin-left:6px;}
.jm-me-hint{font-size:12px;color:var(--tx3);line-height:1.7;margin:0 0 var(--s3);}
.jm-me-note{font-size:12px;color:var(--pt);margin:var(--s2) 0 0;}
.jm-me-tb{width:100%;border-collapse:collapse;margin-bottom:var(--s3);}
.jm-me-tb td{border-bottom:1px solid var(--ln2);padding:10px 0;vertical-align:middle;}
.jm-me-tb td:last-child{text-align:right;width:52px;}
.jm-me-tb b{display:block;font-size:13px;font-weight:500;color:var(--tx);}
.jm-me-tb span{font-size:12px;color:var(--tx3);}
.jm-me-out p{font-size:13px;color:var(--tx2);margin:0 0 var(--s2);line-height:1.75;}
.jm-me-out ul{margin:0 0 var(--s4);padding-left:18px;font-size:13px;color:var(--tx2);line-height:1.8;}
.jm-me-danger{color:var(--rd)!important;border-color:#E9C9D2!important;}
.jm-me-confirm{border-top:1px solid var(--ln2);padding-top:var(--s3);}
.jm-me .jm-bt-sm{height:38px;font-size:13px;padding:0 16px;}
.jm-me-acts{display:flex;gap:8px;margin-top:var(--s3);}
.jm-me-danger-go{background:var(--rd)!important;border-color:var(--rd)!important;}
.jm-me-danger-go:disabled{opacity:.4;cursor:not-allowed;}
.jm-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:250;background:var(--tx);
  color:#fff;border-radius:var(--pill);padding:12px 14px 12px 20px;font-size:13px;display:flex;
  align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);max-width:calc(100% - 32px);}
.jm-toast button{background:rgba(255,255,255,.14);border:none;color:#fff;width:28px;height:28px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
@media (max-width:760px){.jm-me-grid{grid-template-columns:1fr;}.jm-me-card{padding:var(--s4);}
  .jm-me-card dl{grid-template-columns:84px 1fr;}}

/* \u2500\u2500 \uC0C1\uC138 \uC2A4\uD1A0\uB9AC \uC139\uC158 (ARC \uBC29\uC2DD) \u2500\u2500 */
.jm-spec3{list-style:none;margin:var(--s4) 0;padding:var(--s4) 0;
  border-top:1px solid var(--ln2);border-bottom:1px solid var(--ln2);}
.jm-spec3 li{display:flex;align-items:baseline;gap:var(--s3);padding:6px 0;}
.jm-spec3 b{font-size:14px;font-weight:600;color:var(--tx);min-width:170px;}
.jm-spec3 span{font-size:13px;color:var(--tx3);}
.jm-spec3 li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--pt);
  flex-shrink:0;transform:translateY(-2px);}

.jm-story{margin-top:var(--s8);border-top:1px solid var(--ln);}
.jm-st{display:grid;grid-template-columns:220px 1fr;gap:var(--s6);
  padding:var(--s7) 0;border-bottom:1px solid var(--ln2);}
.jm-st:last-child{border-bottom:0;}
.jm-st-h{position:sticky;top:120px;align-self:start;}
.jm-st-h span{display:block;font-size:var(--t-xs);letter-spacing:1.6px;color:var(--pt);
  font-weight:600;margin-bottom:8px;}
.jm-st-h h3{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.9px;margin:0;
  line-height:1.35;}
.jm-st-b p{font-size:15px;color:var(--tx2);line-height:2;margin:0 0 var(--s3);}
.jm-st-b p:last-of-type{margin-bottom:0;}
.jm-st-b b{color:var(--tx);font-weight:600;}
.jm-st-sub{font-size:13px !important;color:var(--tx3) !important;}
.jm-st-q{font-size:17px !important;color:var(--tx) !important;font-weight:500;
  line-height:1.85 !important;padding-left:var(--s4);border-left:3px solid var(--pt);}
.jm-st-spec{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(2,1fr);gap:1px;background:var(--ln2);
  border:1px solid var(--ln2);border-radius:var(--r2);overflow:hidden;}
.jm-st-spec li{background:#fff;padding:15px 18px;}
.jm-st-spec b{display:block;font-size:var(--t-xs);letter-spacing:.8px;color:var(--tx3);
  font-weight:500;margin-bottom:5px;}
.jm-st-spec em{display:block;font-style:normal;font-size:15px;font-weight:600;color:var(--tx);}
.jm-st-spec span{display:block;font-size:12px;color:var(--tx3);margin-top:2px;}
.jm-st-sku{font-size:12px !important;color:var(--tx3) !important;letter-spacing:.4px;
  margin-top:var(--s3) !important;}
.jm-st-more{background:none;border:none;padding:var(--s3) 0 0;font-size:14px;font-weight:600;
  color:var(--pt);display:flex;align-items:center;gap:7px;}
.jm-st-more span{transition:transform .22s;display:inline-block;}
.jm-st-more:hover span{transform:translateX(4px);}

/* \u2500\u2500 \uCEEC\uB809\uC158 \u2500\u2500 */
.jm-colls{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);}
.jm-coll{position:relative;height:230px;border:none;border-radius:var(--r3);overflow:hidden;
  padding:0;display:block;text-align:left;transition:transform .24s,box-shadow .24s;}
.jm-coll:hover{transform:translateY(-3px);box-shadow:var(--sh2);}
.jm-coll svg{transition:transform .5s cubic-bezier(.2,.7,.2,1);}
.jm-coll:hover svg{transform:scale(1.05);}
.jm-coll-tx{position:absolute;left:0;right:0;bottom:0;padding:var(--s4);z-index:2;}
.jm-coll-tx em{display:block;font-style:normal;font-size:var(--t-xs);letter-spacing:1.8px;
  margin-bottom:6px;}
.jm-coll-tx b{display:block;font-size:24px;font-weight:700;letter-spacing:-1px;margin-bottom:6px;}
.jm-coll-tx i{font-style:normal;font-size:12px;}
.jm-coll[data-tone="night"] .jm-coll-tx{background:linear-gradient(transparent,rgba(8,14,26,.85) 55%);}
.jm-coll[data-tone="night"] em{color:#F0D89A;}
.jm-coll[data-tone="night"] b{color:#fff;}
.jm-coll[data-tone="night"] i{color:#B9C4D8;}
.jm-coll[data-tone="dawn"] .jm-coll-tx{background:linear-gradient(transparent,rgba(255,255,255,.9) 55%);}
.jm-coll[data-tone="dawn"] em{color:#B07A3E;}
.jm-coll[data-tone="dawn"] b{color:var(--tx);}
.jm-coll[data-tone="dawn"] i{color:var(--tx2);}
.jm-coll[data-tone="plain"] .jm-coll-tx{background:linear-gradient(transparent,rgba(255,255,255,.92) 55%);}
.jm-coll[data-tone="plain"] em{color:var(--pt);}
.jm-coll[data-tone="plain"] b{color:var(--tx);}
.jm-coll[data-tone="plain"] i{color:var(--tx2);}

.jm-collhero{position:relative;min-height:340px;display:flex;align-items:flex-end;overflow:hidden;}
.jm-collhero-in{position:relative;z-index:2;max-width:1200px;width:100%;margin:0 auto;
  padding:var(--s7) var(--pad) var(--s6);}
.jm-collhero-en{display:block;font-size:var(--t-xs);letter-spacing:2.4px;font-weight:600;
  margin-bottom:var(--s2);}
.jm-collhero h2{font-size:clamp(30px,4.2vw,50px);font-weight:700;letter-spacing:-2px;
  margin:0 0 var(--s3);line-height:1.15;}
.jm-collhero p{font-size:15px;line-height:1.85;margin:0 0 var(--s4);max-width:520px;}
.jm-collhero-n{display:inline-block;font-size:var(--t-xs);font-weight:600;padding:8px 16px;
  border-radius:var(--pill);}
.jm-collhero[data-tone="night"]{background:#0A1220;}
.jm-collhero[data-tone="night"] .jm-collhero-en{color:#F0D89A;}
.jm-collhero[data-tone="night"] h2{color:#fff;}
.jm-collhero[data-tone="night"] p{color:#B9C4D8;}
.jm-collhero[data-tone="night"] .jm-collhero-n{background:rgba(255,255,255,.16);color:#fff;}
.jm-collhero[data-tone="night"] .jm-crumb,
.jm-collhero[data-tone="night"] .jm-crumb button{color:rgba(255,255,255,.6);}
.jm-collhero[data-tone="dawn"]{background:#E4D8C8;}
.jm-collhero[data-tone="dawn"] .jm-collhero-en{color:#B07A3E;}
.jm-collhero[data-tone="dawn"] h2,.jm-collhero[data-tone="plain"] h2{color:var(--tx);}
.jm-collhero[data-tone="dawn"] p,.jm-collhero[data-tone="plain"] p{color:var(--tx2);}
.jm-collhero[data-tone="dawn"] .jm-collhero-n,
.jm-collhero[data-tone="plain"] .jm-collhero-n{background:#fff;color:var(--tx);box-shadow:var(--sh1);}
.jm-collhero[data-tone="plain"]{background:#F2F2F4;}
.jm-collhero[data-tone="plain"] .jm-collhero-en{color:var(--pt);}
.jm-coll-sum{text-align:right;flex-shrink:0;}
.jm-coll-sum span{display:block;font-size:12px;color:var(--tx3);margin-bottom:3px;}
.jm-coll-sum b{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.6px;}

/* \u2500\u2500 \uACE1\uC9D1 \uB2E4\uC911 \uC120\uD0DD \u2500\u2500 */
.jm-sck{width:20px;height:20px;border:1.5px solid var(--ln-i);border-radius:var(--r1);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .14s;}
.jm-sck:hover{border-color:var(--pt);}
.jm-sck[data-on="1"]{background:var(--pt);border-color:var(--pt);}
.jm-booktbl tr[data-on="1"] td{background:var(--pt-tint);}
.jm-selbar{position:sticky;bottom:var(--s3);z-index:30;margin-top:var(--s4);
  background:#fff;border:1px solid var(--pt);border-radius:var(--r3);
  box-shadow:0 12px 34px rgba(20,40,160,.16);animation:jm-selup .22s ease both;}
@keyframes jm-selup{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.jm-selbar-in{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);flex-wrap:wrap;}
.jm-sel-l{flex:1;min-width:200px;}
.jm-sel-l b{display:block;font-size:15px;font-weight:700;color:var(--pt);margin-bottom:3px;}
.jm-sel-l span{display:block;font-size:12px;color:var(--tx3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:340px;}
.jm-sel-q{display:flex;align-items:center;gap:var(--s2);flex-shrink:0;}
.jm-sel-q>span:first-child{font-size:13px;color:var(--tx2);}
.jm-sel-p{text-align:right;flex-shrink:0;}
.jm-sel-p span{display:block;font-size:12px;color:var(--tx3);margin-bottom:2px;}
.jm-sel-p b{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.7px;}
.jm-sel-a{display:flex;gap:6px;flex-shrink:0;}
.jm-sel-a .jm-bt{height:44px;padding:0 20px;flex:none;}
.jm-sel-done{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;
  color:var(--pt);flex-shrink:0;}
.jm-sel-done button{background:none;border:none;font-size:13px;color:var(--tx2);
  text-decoration:underline;text-underline-offset:3px;padding:0;}
.jm-sel-done button:hover{color:var(--pt);}
.jm-sel-note{font-size:12px;color:var(--tx3);margin:0;padding:0 var(--s4) var(--s3);
  border-top:1px solid var(--ln2);padding-top:var(--s3);line-height:1.7;}

/* \uBCA0\uC2A4\uD2B8 \uC9D1\uACC4\uC77C */
.jm-best-upd{display:inline-block;margin-left:9px;padding-left:9px;
  border-left:1px solid var(--ln);color:var(--tx3);font-size:12px;}
/* \uACE1\uC9D1 \uB2E4\uC911 \uC120\uD0DD \u2014 \uACE1\uBCC4 \uBD80\uC218 */
.jm-qty-sm{height:32px;padding:0 3px;}
.jm-qty-sm button{width:26px;height:26px;}
.jm-qty-sm input{width:34px;font-size:13px;}
.jm-qty-add{background:none;border:1px dashed var(--ln);border-radius:var(--pill);
  padding:7px 16px;font-size:12px;color:var(--tx3);}
.jm-qty-add:hover{border-color:var(--pt);border-style:solid;color:var(--pt);}
.jm-sel-mix{font-style:normal;font-size:11px;color:var(--pt);background:var(--pt-tint);
  padding:4px 10px;border-radius:var(--pill);white-space:nowrap;}
/* \u2500\u2500 PG \uACB0\uC81C\uCC3D \u2500\u2500 */
.jm-pwveil{position:fixed;inset:0;background:rgba(11,11,12,.55);z-index:70;display:flex;
  align-items:center;justify-content:center;padding:20px;animation:jm-fade .16s ease both;}
.jm-pw{background:#fff;border-radius:var(--r3);width:100%;max-width:420px;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;display:flex;flex-direction:column;}
.jm-pw-h{background:#1B1B1F;color:#fff;padding:14px 18px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;}
.jm-pw-lg{font-size:14px;font-weight:700;letter-spacing:-.3px;}
.jm-pw-h button{background:none;border:none;color:rgba(255,255,255,.7);display:flex;padding:3px;}
.jm-pw-h button:hover{color:#fff;}
.jm-pw-sum{padding:16px 18px;background:var(--paper);border-bottom:1px solid var(--ln);
  text-align:center;flex-shrink:0;}
.jm-pw-sum span{display:block;font-size:12px;color:var(--tx3);margin-bottom:4px;}
.jm-pw-sum b{display:block;font-size:24px;font-weight:750;letter-spacing:-1px;color:var(--tx);}
.jm-pw-sum em{font-style:normal;font-size:12px;color:var(--tx3);}
.jm-pw-b{padding:18px;overflow-y:auto;flex:1;}
.jm-pw-lb{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:9px;}
.jm-pw-ms{display:flex;flex-direction:column;gap:6px;}
.jm-pw-ms button{border:1px solid var(--ln);background:#fff;border-radius:var(--r1);
  padding:12px 14px;text-align:left;transition:border-color .14s,background .14s;}
.jm-pw-ms button b{display:block;font-size:14px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.jm-pw-ms button em{font-style:normal;font-size:12px;color:var(--tx3);}
.jm-pw-ms button[data-on="1"]{border-color:var(--pt);background:var(--pt-tint);}
.jm-pw-ms button[data-on="1"] b{color:var(--pt);}
.jm-pw-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.jm-pw-cards button{border:1px solid var(--ln);background:#fff;border-radius:var(--r1);
  padding:11px 4px;font-size:13px;color:var(--tx2);}
.jm-pw-cards button[data-on="1"]{border-color:var(--pt);background:var(--pt-tint);
  color:var(--pt);font-weight:700;}
.jm-pw-inst{display:flex;gap:6px;}
.jm-pw-inst button{flex:1;border:1px solid var(--ln);background:#fff;border-radius:var(--r1);
  padding:10px 4px;font-size:13px;color:var(--tx2);}
.jm-pw-inst button[data-on="1"]{border-color:var(--pt);background:var(--pt-tint);
  color:var(--pt);font-weight:700;}
.jm-pw-inst button:disabled{opacity:.4;}
.jm-pw-hint{font-size:12px;color:var(--tx3);margin:9px 0 0;line-height:1.7;}
.jm-pw-warn{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--warn);
  background:#FDF6EA;border-radius:var(--r1);padding:10px 12px;margin:12px 0 0;line-height:1.7;}
.jm-pw-warn svg{flex-shrink:0;margin-top:2px;}
.jm-pw-f{padding:14px 18px;border-top:1px solid var(--ln);display:flex;gap:7px;flex-shrink:0;}
.jm-pw-go{flex:1;background:var(--pt);color:#fff;border:none;border-radius:var(--r1);
  padding:14px;font-size:15px;font-weight:700;}
.jm-pw-go:hover:not(:disabled){background:var(--pt2);}
.jm-pw-go:disabled{background:#C6C6C6;}
.jm-pw-back{background:#fff;border:1px solid var(--ln);border-radius:var(--r1);
  padding:14px 20px;font-size:14px;color:var(--tx2);}
.jm-pw-note{font-size:11px;color:var(--tx3);text-align:center;padding:0 0 12px;margin:0;}

/* \u2500\u2500 \uACB0\uC81C \uC2E4\uD328 \u2500\u2500 */
.jm-fail{max-width:520px;margin:var(--s6) auto;text-align:center;}
.jm-fail-ic{width:56px;height:56px;border-radius:50%;background:var(--red-tint,#FAEDF1);
  color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s4);}
.jm-fail h2{font-size:24px;font-weight:750;letter-spacing:-1.2px;margin:0 0 var(--s2);}
.jm-fail-r{font-size:14px;color:var(--red);font-weight:600;margin:0 0 var(--s3);}
.jm-fail-d{font-size:14px;color:var(--tx2);line-height:1.9;margin:0 0 var(--s5);}
.jm-fail-a{display:flex;gap:8px;justify-content:center;margin-bottom:var(--s6);}
.jm-fail-a .jm-bt{flex:none;padding:0 26px;}
.jm-fail-help{background:var(--paper);border-radius:var(--r2);padding:18px 20px;text-align:left;}
.jm-fail-help b{display:block;font-size:13px;margin-bottom:9px;}
.jm-fail-help ul{margin:0 0 12px;padding-left:17px;font-size:13px;color:var(--tx2);
  line-height:1.9;}
.jm-fail-help p{font-size:13px;color:var(--tx2);margin:0;line-height:1.85;}

/* \u2500\u2500 \uC8FC\uBB38 \uB0B4\uC5ED \u2500\u2500 */
.jm-ords{display:flex;flex-direction:column;gap:var(--s3);}
.jm-ord{border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden;background:#fff;}
.jm-ord-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:13px var(--s4);background:var(--paper);border-bottom:1px solid var(--ln);}
.jm-ord-no{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--tx);
  margin-right:9px;}
.jm-ord-h em{font-style:normal;font-size:12px;color:var(--tx3);}
.jm-ord-st{font-size:11px;font-weight:700;padding:5px 12px;border-radius:var(--pill);}
.jm-ord-st[data-s="\uACB0\uC81C\uC644\uB8CC"]{background:var(--pt-tint);color:var(--pt);}
.jm-ord-st[data-s="\uC785\uAE08\uB300\uAE30"]{background:#FDF6EA;color:#B5761A;}
.jm-ord-st[data-s="\uD658\uBD88\uC644\uB8CC"]{background:var(--card);color:var(--tx2);}
.jm-ord-b{padding:var(--s3) var(--s4);}
.jm-ord-i{display:flex;align-items:center;gap:12px;padding:9px 0;}
.jm-ord-cv{flex-shrink:0;line-height:0;}
.jm-ord-cv svg{border-radius:var(--r1);box-shadow:0 2px 6px rgba(0,0,0,.14);}
.jm-ord-tx{flex:1;min-width:0;}
.jm-ord-tx b{display:block;font-size:14px;font-weight:600;color:var(--tx);}
.jm-ord-tx em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-top:2px;}
.jm-ord-q{font-size:13px;color:var(--tx2);flex-shrink:0;}
.jm-ord-p{font-size:14px;font-weight:700;color:var(--tx);flex-shrink:0;width:88px;
  text-align:right;}
.jm-ord-f{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
  padding:var(--s3) var(--s4);border-top:1px solid var(--ln2);flex-wrap:wrap;}
.jm-ord-pay{margin:0;display:flex;gap:var(--s5);flex-wrap:wrap;}
.jm-ord-pay div{display:flex;flex-direction:column;gap:2px;}
.jm-ord-pay dt{font-size:11px;color:var(--tx3);margin:0;}
.jm-ord-pay dd{font-size:13px;color:var(--tx);margin:0;}
.jm-ord-pay dd b{font-size:15px;font-weight:700;}
.jm-ord-a{display:flex;gap:6px;flex-shrink:0;}
.jm-ord-a .jm-bt{flex:none;}
.jm-ord-note{font-size:12px;color:var(--tx2);background:var(--paper);margin:0;
  padding:12px var(--s4);border-top:1px solid var(--ln2);line-height:1.8;}
.jm-ord-note[data-k="warn"]{background:#FDF6EA;color:#7A5A18;}

/* \u2500\u2500 \uD658\uBD88 \uC694\uCCAD \u2500\u2500 */
.jm-rf{background:#fff;border-radius:var(--r3);width:100%;max-width:440px;overflow:hidden;
  display:flex;flex-direction:column;max-height:88vh;}
.jm-rf-h{padding:var(--s4);border-bottom:1px solid var(--ln);display:flex;
  align-items:center;justify-content:space-between;}
.jm-rf-h b{font-size:17px;font-weight:700;letter-spacing:-.4px;}
.jm-rf-h button{background:none;border:none;color:var(--tx3);display:flex;padding:4px;
  border-radius:50%;}
.jm-rf-h button:hover{background:var(--paper);color:var(--tx);}
.jm-rf-b{padding:var(--s4);overflow-y:auto;}
.jm-rf-box{background:var(--pt-tint);border-radius:var(--r2);padding:14px 16px;
  margin-bottom:var(--s4);}
.jm-rf-box b{display:block;font-size:13px;color:var(--pt);margin-bottom:6px;}
.jm-rf-box p{font-size:13px;color:var(--tx2);line-height:1.85;margin:0;}
.jm-rf-spec{margin:0 0 var(--s3);border:1px solid var(--ln);border-radius:var(--r2);
  overflow:hidden;}
.jm-rf-spec div{display:flex;justify-content:space-between;gap:var(--s3);padding:11px 16px;
  border-bottom:1px solid var(--ln2);font-size:13px;}
.jm-rf-spec div:last-child{border-bottom:0;}
.jm-rf-spec dt{color:var(--tx3);margin:0;}
.jm-rf-spec dd{color:var(--tx);margin:0;font-weight:500;}
.jm-rf-spec dd b{font-size:15px;font-weight:700;}
.jm-rf-note{font-size:12px;color:var(--tx3);line-height:1.8;margin:0;}
.jm-rf-f{padding:var(--s3) var(--s4);border-top:1px solid var(--ln);display:flex;
  justify-content:flex-end;gap:7px;}
.jm-rf-f .jm-bt{flex:none;padding:0 22px;}
.jm-bt-d{border-color:var(--red) !important;color:var(--red) !important;}
.jm-bt-d:hover{background:var(--red) !important;color:#fff !important;}

.jm-pt{font-size:clamp(26px,3.4vw,38px);font-weight:750;letter-spacing:-1.8px;
  margin:0 0 var(--s2);line-height:1.15;}
.jm-psub{font-size:14px;color:var(--tx2);margin:0 0 var(--s5);line-height:1.85;}


/* \u2500\u2500 \uC800\uC791\uAD8C \uACE0\uC9C0 (\uC8FC\uBB38\uC11C) \u2500\u2500
   \uC57D\uAD00 \uBAA9\uB85D\uC5D0 \uBB3B\uD788\uC9C0 \uC54A\uB3C4\uB85D \uB3C5\uB9BD\uB41C \uBE14\uB85D\uC73C\uB85C \uB461\uB2C8\uB2E4.
   \uD615\uC0AC \uCC98\uBC8C \uAC00\uB2A5\uC131\uAE4C\uC9C0 \uBA85\uC2DC\uD558\uB294 \uAC83\uC774 \uC774 \uACE0\uC9C0\uC758 \uBAA9\uC801\uC785\uB2C8\uB2E4. */
.jm-copy{border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden;
  margin-top:var(--s5);background:#fff;}
.jm-copy-b{display:flex;gap:var(--s4);padding:var(--s4);align-items:flex-start;}
.jm-copy-ic{width:46px;height:46px;border-radius:var(--r2);background:var(--pt-tint);
  color:var(--pt);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.jm-copy-tx{flex:1;min-width:0;}
.jm-copy-tx p{font-size:13px;color:var(--tx2);line-height:1.9;margin:0 0 8px;}
.jm-copy-tx p:last-child{margin-bottom:0;}
.jm-copy-tx b{color:var(--tx);font-weight:600;}
.jm-copy-mark{padding-top:9px;border-top:1px dashed var(--ln);margin-top:11px !important;
  font-size:13px !important;color:var(--tx3) !important;}
.jm-copy-mark b{color:var(--pt) !important;}
.jm-copy-ck{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:14px;
  padding:14px var(--s4);border:none;border-top:1px solid var(--ln2);background:var(--paper);
  font-size:14px;color:var(--tx2);transition:background .16s;}
.jm-copy-ck:hover{background:var(--pt-tint);}
.jm-copy-ck em{font-style:normal;font-size:12px;color:var(--pt);font-weight:600;}
.jm-copy-ck i{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln-i);background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  transition:background .16s,border-color .16s;}
.jm-copy-ck:hover i{border-color:var(--pt);}
.jm-copy-ck[data-on="1"]{background:var(--pt-tint);color:var(--tx);font-weight:600;}
.jm-copy-ck[data-on="1"] i{background:var(--pt);border-color:var(--pt);}


/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   \uC881\uC740 \uD654\uBA74 \uB300\uC751

   \uC545\uBCF4\uB294 \uACB0\uAD6D PC\uC5D0\uC11C \uC778\uC1C4\uD558\uB294 \uBD84\uC774 \uB9CE\uC9C0\uB9CC, \uB458\uB7EC\uBCF4\uACE0 \uB2F4\uB294 \uC77C\uC740
   \uD734\uB300\uD3F0\uC73C\uB85C \uD558\uB294 \uBD84\uC774 \uB9CE\uC2B5\uB2C8\uB2E4. \uADF8\uB798\uC11C "\uAD6C\uACBD\uD558\uACE0 \uACE0\uB974\uB294" \uD654\uBA74\uC744
   \uBA3C\uC800 \uB9DE\uCD94\uACE0, \uD45C\uAC00 \uB9CE\uC740 \uD654\uBA74\uC740 \uCE74\uB4DC\uB85C \uBC14\uAFC9\uB2C8\uB2E4.

   \uB04A\uB294 \uC9C0\uC810
     1100px  2\uB2E8 \u2192 1\uB2E8 (\uC0C1\uC138\xB7\uACE1\uC9D1\xB7\uD788\uC5B4\uB85C)
      860px  4\uC5F4 \u2192 2\uC5F4, \uD478\uD130 \uC138\uB85C\uB85C
      640px  \uD734\uB300\uD3F0. \uD45C\uB97C \uCE74\uB4DC\uB85C, \uD5E4\uB354 \uD55C \uC904\uB85C
   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

/* \uC5B4\uB290 \uD3ED\uC5D0\uC11C\uB3C4 \uAC00\uB85C\uB85C \uC090\uC838\uB098\uAC00\uC9C0 \uC54A\uAC8C \uD558\uB294 \uC548\uC804\uC7A5\uCE58 */
.jm{overflow-x:hidden;}
.jm img,.jm svg{max-width:100%;}



/* \u2500\u2500 \uBA54\uC778 \uBC30\uB108 \uADF8\uB9BC (2026.11) \u2500\u2500 */
.jm-ha{position:relative;width:100%;max-width:500px;height:340px;}
.jm-ha-glow{position:absolute;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none;}
.jm-ha-pg{position:absolute;width:228px;border-radius:3px;overflow:hidden;background:#fff;
  box-shadow:0 2px 4px rgba(6,14,48,.22),0 22px 48px rgba(6,14,48,.38);}
.jm-ha-pg .jm-scorepage{max-width:none;width:100%;}
.jm-ha-pg-b{left:70px;top:22px;transform:rotate(-7deg);opacity:.9;}
.jm-ha-pg-a{left:182px;top:4px;transform:rotate(3deg);}
.jm-ha-chip{position:absolute;right:6px;bottom:22px;display:flex;align-items:center;gap:10px;
  background:var(--lime);color:var(--ink);border-radius:var(--r3);padding:11px 15px 11px 13px;
  box-shadow:0 12px 28px rgba(6,14,48,.32);}
.jm-ha-chip span{font-size:12px;line-height:1.45;}
.jm-ha-chip b{display:block;font-size:14px;}
.jm-ha-covers{display:flex;align-items:center;justify-content:center;}
.jm-ha-covers span{position:absolute;top:50%;left:50%;line-height:0;display:block;
  box-shadow:0 2px 4px rgba(0,0,0,.2),0 24px 50px rgba(0,0,0,.42);}
.jm-ha-covers .cv1{transform:translate(-128%,-46%) rotate(-9deg);}
.jm-ha-covers .cv3{transform:translate(28%,-46%) rotate(8deg);}
.jm-ha-covers .cv2{transform:translate(-50%,-50%);z-index:2;}
.jm-ha-steps{display:block;}
.jm-ha-card{position:absolute;background:#fff;border-radius:var(--r3);padding:14px 16px;color:var(--tx);
  box-shadow:0 2px 4px rgba(0,0,0,.14),0 18px 40px rgba(0,0,0,.32);}
.jm-ha-card em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--teal);margin-bottom:8px;}
.jm-ha-card span{display:block;font-size:12px;color:var(--tx2);margin-top:8px;}
.jm-ha-card.s1{left:8px;top:14px;width:176px;transform:rotate(-3deg);}
.jm-ha-mini{height:150px;overflow:hidden;border:1px solid var(--ln2);border-radius:4px;position:relative;}
.jm-ha-mini::after{content:'';position:absolute;inset:auto 0 0 0;height:56px;
  background:linear-gradient(rgba(255,255,255,0),#fff);}
.jm-ha-mini .jm-scorepage{max-width:none;width:100%;}
.jm-ha-card.s2{left:196px;top:60px;width:206px;z-index:2;}
.jm-ha-qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--ln);
  border-radius:var(--pill);padding:6px;}
.jm-ha-qty i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--paper);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--tx2);}
.jm-ha-qty b{font-size:24px;font-weight:700;}
.jm-ha-qty small{font-size:12px;font-weight:500;margin-left:2px;color:var(--tx2);font-family:'Pretendard Variable',Pretendard,sans-serif;}
.jm-ha-sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
  border-top:1px solid var(--ln2);padding-top:10px;}
.jm-ha-sum span{margin:0;font-size:12px;}
.jm-ha-sum b{font-size:17px;}
.jm-ha-card.s3{left:250px;top:212px;width:232px;background:var(--lime);transform:rotate(2deg);}
.jm-ha-card.s3 em{color:var(--ink);}
.jm-ha-print{display:flex;align-items:center;gap:10px;color:var(--ink);}
.jm-ha-print span{margin:0;color:var(--ink);font-size:13px;font-weight:600;}
@media (max-width:1100px){.jm-ha{transform:scale(.86);transform-origin:center;}}


/* \u2500\u2500 \uBD84\uB958 \uBC30\uB108: \uC2E4\uC81C \uACE1\uC9D1 \uD45C\uC9C0 \u2500\u2500 */
.jm-cathero-lines{position:absolute;inset:0;pointer-events:none;}
.jm-cathero-lines i{position:absolute;left:0;right:0;height:1px;background:currentColor;opacity:.08;}
.jm-cathero[data-dark="1"] .jm-cathero-lines i{background:#fff;opacity:.09;}
.jm-cathero-covers{position:absolute;right:max(var(--pad),calc((100% - 1200px) / 2 + 64px));top:50%;
  transform:translateY(-42%);width:300px;height:200px;pointer-events:none;}
.jm-cathero[data-scene="staff"]{background:linear-gradient(160deg,#F5F8F8,#E9EFF0);color:var(--teal);}
.jm-cathero[data-scene="orch"]{background:linear-gradient(150deg,#22379A,#0F1A52);}
.jm-cathero[data-scene="choir"]{background:linear-gradient(150deg,#94223F,#56122A);}
.jm-cathero[data-scene="wave"]{background:linear-gradient(160deg,#EEF4F3,#DCE9E7);color:var(--teal);}
.jm-cathero[data-scene="keys"]{background:linear-gradient(160deg,#FBF3F5,#F1E2E7);color:var(--red);}
.jm-cathero-covers span{position:absolute;display:block;line-height:0;
  box-shadow:0 2px 4px rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.30);}
.jm-cathero-covers span[data-i="0"]{left:84px;top:-12px;z-index:3;}
.jm-cathero-covers span[data-i="1"]{left:0;top:16px;transform:rotate(-8deg);z-index:2;}
.jm-cathero-covers span[data-i="2"]{left:190px;top:18px;transform:rotate(7deg);z-index:1;}
@media (max-width:860px){.jm-cathero-covers{display:none;}}


/* \u2500\u2500 \uBBF8\uB9AC\uB4E3\uAE30 \u2500\u2500 */
.jm-pv-play{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  padding:12px var(--s4);border-bottom:1px solid var(--ln);background:var(--paper);}
.jm-pv-pb{width:44px;height:44px;border-radius:50%;border:none;background:var(--lime);color:var(--ink);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;}
.jm-pv-pb:hover{transform:scale(1.05);}
.jm-pv-pi{min-width:0;}
.jm-pv-pt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.jm-pv-pt b{font-size:13px;color:var(--tx);}
.jm-pv-pt span{font-size:12px;color:var(--tx3);}
.jm-pv-track{height:6px;border-radius:var(--pill);background:var(--ln);cursor:pointer;position:relative;overflow:hidden;}
.jm-pv-track i{position:absolute;left:0;top:0;bottom:0;background:var(--pt);border-radius:var(--pill);}
.jm-pv-pnote{font-style:normal;font-size:11px;color:var(--tx3);max-width:240px;line-height:1.5;}
.jm-pv-pnote b{color:var(--tx2);font-weight:600;}
/* \uBBF8\uB9AC\uBCF4\uAE30(\uB113\uAC8C) + \uB4E4\uC5B4\uBCF4\uAE30(\uAE00\uC790\uB9CC\uD07C) \u2014 \uC67C\uCABD \uCE78 \uD3ED \uC548\uC5D0\uC11C\uB9CC \uB098\uB215\uB2C8\uB2E4 */
.jm-dt-pvs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:var(--s2);}
.jm-dt-pvs .jm-dt-pv{margin:0!important;width:auto;min-width:0;max-width:none!important;padding:0 14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jm-dt-listen{padding:0 18px!important;background:var(--lime)!important;border-color:var(--lime)!important;color:var(--ink)!important;font-weight:700;}
.jm-bk-acts{display:flex;gap:6px;justify-content:center;}
.jm-bk-listen{display:inline-flex;align-items:center;gap:4px;}
@media (max-width:640px){
  .jm-pv-play{grid-template-columns:auto 1fr;}
  .jm-pv-pnote{grid-column:1 / -1;max-width:none;}
}


/* \uACE1\uC9D1 \uC218\uB85D\uACE1 \u2014 \uD734\uB300\uD3F0\uC5D0\uC11C\uB294 \uD45C \uB300\uC2E0 \uCE74\uB4DC. \uD45C\uB97C \uADF8\uB300\uB85C \uB450\uBA74 \uBC84\uD2BC\uC774 \uD654\uBA74 \uBC16\uC73C\uB85C \uBC00\uB824\uB0A9\uB2C8\uB2E4 */
@media (max-width:640px){
  .jm-booktbl thead{display:none;}
  .jm-booktbl,.jm-booktbl tbody{display:block;width:100%;}
  .jm-booktbl tr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;
    grid-template-areas:"ck ti ti" "ck me lv" "ck qt am" "ck ac ac";gap:8px 10px;
    padding:16px 0;border-bottom:1px solid var(--ln2);align-items:center;}
  .jm-booktbl td{border:0!important;padding:0!important;background:none!important;}
  .jm-booktbl td:nth-child(1){grid-area:ck;align-self:start;padding-top:2px!important;}
  .jm-booktbl td:nth-child(2){display:none;}
  .jm-booktbl td:nth-child(3){grid-area:ti;}
  .jm-booktbl td:nth-child(4){grid-area:me;font-size:12px;color:var(--tx2);}
  .jm-booktbl td:nth-child(5){grid-area:lv;font-size:12px;color:var(--tx2);text-align:right;}
  .jm-booktbl td:nth-child(6){grid-area:qt;text-align:left!important;}
  .jm-booktbl td:nth-child(7){grid-area:am;text-align:right;}
  .jm-booktbl td:nth-child(8){grid-area:ac;}
  .jm-booktbl .jm-bk-acts{justify-content:flex-start;}
  .jm-booktbl tr[data-on="1"]{background:var(--pt-tint);}
}


/* \u2500\u2500 \uAD00\uC2EC \uC545\uBCF4 \u2500\u2500 */
.jm-wish{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:var(--tx2);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:3;transition:transform .15s,color .15s;}
.jm-wish:hover{color:var(--red);transform:scale(1.06);}
.jm-wish[data-on="1"]{color:var(--red);}
.jm-wish-dt[data-on="1"]{color:var(--red)!important;border-color:#E9C9D2!important;background:var(--red-tint)!important;}
.jm-hd-ic{position:relative;}
.jm-toast-a{background:none!important;width:auto!important;border-radius:0!important;color:var(--lime)!important;
  font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0 4px;}
.jm-wish-done{display:flex;align-items:center;gap:8px;background:var(--lime-soft);color:var(--ink);
  border-radius:var(--r2);padding:12px 16px;font-size:13px;margin-bottom:var(--s3);}
.jm-wish-done button{margin-left:auto;background:none;border:none;color:var(--pt);font-weight:700;
  text-decoration:underline;text-underline-offset:3px;}
.jm-wish-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ln);}
.jm-wish-n{font-size:12px;color:var(--tx3);}
.jm-wish-q{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--tx2);}
.jm-wish-q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--tx2);}
.jm-wish-q b{min-width:30px;text-align:center;font-size:15px;color:var(--tx);}
.jm-wish-list{list-style:none;margin:0;padding:0;}
.jm-wish-list li{display:grid;grid-template-columns:28px 56px minmax(0,1fr) auto auto;gap:16px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--ln2);}
.jm-wish-list li[data-off="1"]{opacity:.55;}
.jm-wish-ck{margin:0!important;}
.jm-wish-cv{background:none;border:none;padding:0;line-height:0;}
.jm-wish-tx{min-width:0;display:flex;flex-direction:column;gap:2px;}
.jm-wish-tx>span{font-size:12px;color:var(--tx3);}
.jm-wish-st{display:flex;gap:6px;margin-top:4px;}
.jm-wish-st em{font-style:normal;font-size:11px;padding:2px 8px;border-radius:var(--pill);font-weight:600;}
.jm-wish-st em[data-k="off"]{background:#F1F1F3;color:var(--tx2);}
.jm-wish-st em[data-k="own"]{background:var(--teal-tint);color:var(--teal);}
.jm-wish-st em[data-k="pr"]{background:#FDF4E7;color:var(--warn);}
.jm-wish-pr{font-size:15px;color:var(--tx);text-align:right;white-space:nowrap;}
.jm-wish-pr small{display:block;font-size:11px;color:var(--tx3);font-weight:400;}
.jm-wish-a{display:flex;gap:6px;align-items:center;}
.jm-wish-a .jm-bt{display:inline-flex;align-items:center;gap:4px;}
.jm-wish-x{width:32px;height:32px;border-radius:50%;border:none;background:none;color:var(--tx3);
  display:flex;align-items:center;justify-content:center;}
.jm-wish-x:hover{background:var(--paper);color:var(--tx);}
@media (max-width:760px){
  .jm-wish-list li{grid-template-columns:24px 48px minmax(0,1fr) auto;
    grid-template-areas:"ck cv tx pr" "ac ac ac ac";row-gap:12px;}
  .jm-wish-ck{grid-area:ck;align-self:start;}
  .jm-wish-cv{grid-area:cv;align-self:start;}
  .jm-wish-tx{grid-area:tx;}
  .jm-wish-pr{grid-area:pr;align-self:start;}
  .jm-wish-a{grid-area:ac;flex-wrap:nowrap;justify-content:flex-end;}
  .jm-wish-a .jm-bt{padding:0 12px!important;}
  .jm-toast{left:16px;right:16px;transform:none;max-width:none;border-radius:var(--r3);}
  .jm-wish-q{margin-left:0;}
  .jm-wish-bar .jm-bt{width:100%;}
}

/* \u2550\u2550 \uD0C0\uC774\uD3EC\uADF8\uB798\uD53C \xB7 \uD45C\uBA74 \uC815\uB9AC (2026.11) \u2550\u2550
   \uC6F9 \uD654\uBA74 \uAE00\uAF34\uC740 Pretendard \uD558\uB098. \uBA85\uC870(Noto Serif KR)\uB294 \uACE1\uC9D1 \uD45C\uC9C0 \xB7 \uC545\uBCF4 \uADF8\uB9BC \uC548\uC5D0\uC11C\uB9CC \uC501\uB2C8\uB2E4.
   \uACE0\uC815\uD3ED \uAE00\uAF34\uC740 \uC8FC\uBB38\uBC88\uD638 \uAC19\uC740 \uCF54\uB4DC\uC5D0\uB9CC \uC501\uB2C8\uB2E4. */
/* \uC6F9 \uD654\uBA74\uC758 \uC81C\uBAA9\uC740 \uBAA8\uB450 \uACE0\uB515(Pretendard)\uC785\uB2C8\uB2E4. \uBA85\uC870\uB294 \uC62C\uB4DC\uD574 \uBCF4\uC5EC \uC4F0\uC9C0 \uC54A\uACE0,
   \uACE1\uC9D1 \uD45C\uC9C0\uC640 \uC545\uBCF4 \uADF8\uB9BC \uC548\uC5D0\uC11C\uB9CC \uC501\uB2C8\uB2E4 */
.jm-ttl h2,.jm-dt-h,.jm-sect h3,.jm-st-h h3,.jm-fail h2,.jm-done h3,.jm-me-card h3{
  font-weight:700;letter-spacing:-.035em;text-wrap:balance;}
.jm-hero-tx h1,.jm-cathero h2,.jm-collhero h2,.jm-bookhero h2,.jm-up-h b{
  font-family:'Pretendard Variable',Pretendard,sans-serif;text-wrap:balance;}
.jm-hero-tx h1{font-weight:800;letter-spacing:-.04em;line-height:1.2;}
.jm-cathero h2,.jm-collhero h2{font-weight:800;letter-spacing:-.04em;}
.jm-up-d{font-family:'Pretendard Variable',Pretendard,sans-serif!important;font-weight:800!important;letter-spacing:-.05em!important;}
.jm-sp-hot i,.jm-sp-hot em,.jm-srchtabs em,.jm-quick-g button em,.jm-now-n,.jm-now-r,.jm-up-tag,
.jm-hero-idx button,.jm-lg-tx em{font-family:inherit!important;font-variant-numeric:tabular-nums;}
.jm{font-variant-numeric:tabular-nums;}
.jm p{text-wrap:pretty;}
/* \uD55C\uAE00\uC740 \uB0B1\uB9D0 \uC911\uAC04\uC5D0\uC11C \uC904\uC744 \uBC14\uAFB8\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4 */
.jm{word-break:keep-all;}
.jm-up-bg{opacity:.75;}
@media (max-width:640px){.jm-up-bg{display:none;}}
.jm h1,.jm h2,.jm h3,.jm h4,.jm p,.jm-sect h3{word-break:keep-all;overflow-wrap:break-word;}
/* \uBA38\uB9AC\uB9D0 \uB77C\uBCA8(eyebrow)\uC740 \uC4F0\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4 \u2014 \uC81C\uBAA9\uC774 \uC2A4\uC2A4\uB85C \uB9D0\uD558\uAC8C \uB461\uB2C8\uB2E4 */
.jm-hero .jm-hero-k,.jm-cathero-en,.jm-sect-n{display:none!important;}
/* \uBE0C\uB77C\uC6B0\uC800 \uAE30\uBCF8 \uBA74 */
.jm ::selection{background:var(--lime);color:var(--ink);}
.jm{scrollbar-color:#C9D2D3 transparent;}
.jm input{caret-color:var(--pt);}
.jm a,.jm button{text-underline-offset:3px;}
/* \uBC84\uD2BC \uD06C\uAE30 3\uB2E8\uACC4 \u2014 \uD07C 52 \xB7 \uBCF4\uD1B5 44 \xB7 \uC791\uC74C 36 */
.jm-bt-sm{height:36px!important;font-size:13px!important;padding:0 14px!important;}
.jm-hd-login,.jm-hd-out{min-height:36px;}

@media (max-width:1100px){
  /* \uC545\uBCF4 \uC774\uBBF8\uC9C0\uC640 \uC124\uBA85\uC744 \uC704\uC544\uB798\uB85C */
  .jm-dt{grid-template-columns:1fr;gap:var(--s5);}
  .jm-dt-img{max-width:420px;margin:0 auto;}
  .jm-dt-pv{max-width:420px;margin-left:auto;margin-right:auto;}
  .jm-dt-pvs{max-width:420px;margin-left:auto;margin-right:auto;}
  .jm-hero-in{grid-template-columns:1fr;gap:var(--s4);}
  .jm-bookhero-in{grid-template-columns:1fr;justify-items:start;gap:var(--s4);}
  .jm-st{grid-template-columns:1fr;gap:var(--s4);}
  .jm-books{grid-template-columns:repeat(3,1fr);}
  .jm-colls{grid-template-columns:repeat(2,1fr);}
  .jm-mega-cols{grid-template-columns:repeat(3,1fr);gap:16px;}
  /* \uBBF8\uB9AC\uBCF4\uAE30 \uBAA8\uB2EC \u2014 \uC606\uC5D0 \uBD99\uB358 \uC124\uBA85\uC744 \uC544\uB798\uB85C */
  .jm-pv-body{grid-template-columns:1fr;}

  /* \uD478\uD130 4\uCE78\uC740 1100px\uBD80\uD130 \uC774\uBBF8 \uC881\uC2B5\uB2C8\uB2E4. 2\uCE78\uC529 \uB450 \uC904\uB85C. */
  .jm-ft-in{grid-template-columns:repeat(2,1fr);row-gap:0;}
  .jm-ft-col:nth-child(2n){border-right:0;padding-right:0;}
  .jm-ft-col:nth-child(-n+2){border-bottom:1px solid var(--ln2);padding-bottom:24px;}
  .jm-ft-col:nth-child(n+3){padding-top:24px;}
}

@media (max-width:860px){
  .jm-grid{grid-template-columns:repeat(2,1fr);gap:var(--s4) var(--s3);}
  .jm-books{grid-template-columns:repeat(2,1fr);}
  .jm-colls{grid-template-columns:1fr;}
  .jm-steps3{grid-template-columns:1fr;}
  .jm-facts{grid-template-columns:repeat(3,1fr);gap:6px;}
  .jm-facts div{padding:11px 12px;}
  .jm-mega-cols{grid-template-columns:repeat(2,1fr);}
  .jm-pw-cards{grid-template-columns:repeat(3,1fr);}

  /* \uD478\uD130 \u2014 4\uCE78\uC744 \uC138\uB85C\uB85C \uC313\uACE0 \uCE78 \uC0AC\uC774 \uC120\uC744 \uAC00\uB85C\uC120\uC73C\uB85C */
  .jm-ft-in{grid-template-columns:1fr;padding:34px var(--pad) 30px;}
  .jm-ft-col{padding:22px 0;border-right:0;border-bottom:1px solid var(--ln2);}
  .jm-ft-col:first-child{padding-top:0;}
  .jm-ft-col:last-child{border-bottom:0;padding-bottom:0;}
  .jm-cs{font-size:24px;}
}

@media (max-width:640px){
  /* \uC88C\uC6B0 \uC5EC\uBC31\uC744 16px\uB85C \uC904\uC5EC \uD654\uBA74\uC744 \uB113\uAC8C \uC501\uB2C8\uB2E4 */
  :root,.jm{--pad:16px;}

  /* \uC0C1\uB2E8 \uC720\uD2F8\uBC14 \u2014 \uC11C\uBE44\uC2A4 \uD0ED\uB9CC \uB0A8\uAE30\uACE0 \uC6B0\uCE21 \uB9C1\uD06C\uB294 \uC228\uAE41\uB2C8\uB2E4.
     \uAC19\uC740 \uAE30\uB2A5\uC774 \uD5E4\uB354 \uC544\uC774\uCF58\uACFC \uD478\uD130\uC5D0 \uC788\uC2B5\uB2C8\uB2E4. */
  .jm-svc-r{display:none;}
  .jm-svc-t button,.jm-svc-t a{padding:0 12px;font-size:12px;}

  /* \uD5E4\uB354 \u2014 \uB85C\uACE0\uC640 \uC544\uC774\uCF58\uB9CC \uD55C \uC904, \uAC80\uC0C9\uC740 \uADF8 \uC544\uB798 \uC904\uB85C \uB0B4\uB9BD\uB2C8\uB2E4 */
  .jm-hd-in{height:auto;padding:12px var(--pad);flex-wrap:wrap;gap:10px;}
  .jm-hd[data-shrink="1"] .jm-hd-in{height:auto;}
  .jm-lg-tx b{font-size:17px;}
  .jm-srchwrap{order:3;flex-basis:100%;max-width:none;}
  .jm-hd-div{display:none;}

  .jm-gnb{height:46px;gap:0;}
  .jm-gnb button{padding:8px 11px;font-size:14px;}

  /* \uD788\uC5B4\uB85C \u2014 \uAE00\uC790\uB97C \uC904\uC774\uACE0 \uC7A5\uC2DD \uB3C4\uD615\uC740 \uBE8D\uB2C8\uB2E4 */
  .jm-hero-in{padding:var(--s5) var(--pad) var(--s6);}
  .jm-hero-art{display:none;}
  .jm-hero h2,.jm-hero-t{font-size:clamp(24px,7vw,32px);letter-spacing:-1px;}
  .jm-hero-ctl{position:static;padding:0 var(--pad) var(--s4);}
  .jm-hero-cta{align-self:stretch;justify-content:center;}

  /* \uC0C1\uD488 \uADF8\uB9AC\uB4DC\uB294 2\uC5F4 \uC720\uC9C0 \u2014 1\uC5F4\uB85C \uB9CC\uB4E4\uBA74 \uD45C\uC9C0\uAC00 \uC9C0\uB098\uCE58\uAC8C \uCEE4\uC9D1\uB2C8\uB2E4 */
  .jm-grid{gap:var(--s4) 10px;}
  /* 1\uC5F4\uB85C \uC138\uC6B0\uBA74 6\uAC1C\uAC00 \uD654\uBA74 \uD55C \uC7A5\uC744 \uB2E4 \uBA39\uC2B5\uB2C8\uB2E4 */
  .jm-facts{grid-template-columns:repeat(2,1fr);}
  .jm-pw-cards{grid-template-columns:repeat(2,1fr);}
  .jm-st-spec{grid-template-columns:1fr;}
  .jm-mega-cols{grid-template-columns:1fr;}
  .jm-books{grid-template-columns:repeat(2,1fr);gap:10px;}  /* 1\uC5F4\uC774\uBA74 \uACE1\uC9D1 4\uAC1C\uAC00 \uD654\uBA74 \uD55C \uC7A5 \uBC18 */

  /* \uD45C \u2192 \uCE74\uB4DC
     \uC881\uC740 \uD654\uBA74\uC5D0\uC11C \uD45C\uB97C \uAC00\uB85C\uB85C \uBC00\uBA74 \uD5E4\uB354\uAC00 \uC0AC\uB77C\uC838 \uBB34\uC2A8 \uAC12\uC778\uC9C0 \uC54C \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.
     \uD589 \uD558\uB098\uB97C \uCE74\uB4DC \uD558\uB098\uB85C \uC138\uC6B0\uACE0, \uAC01 \uCE78 \uC55E\uC5D0 \uC81C\uBAA9\uC744 \uBD99\uC785\uB2C8\uB2E4. */
  .jm-otb,.jm-otb tbody,.jm-otb tr,.jm-otb td{display:block;width:100%;}
  .jm-otb thead{display:none;}
  .jm-otb tr{border:1px solid var(--ln);border-radius:var(--r2);
    margin-bottom:10px;padding:4px 14px 12px;background:#fff;}
  .jm-otb td{border:0;padding:8px 0;text-align:left !important;
    display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .jm-otb td::before{content:attr(data-th);flex-shrink:0;
    font-size:12px;color:var(--tx3);font-weight:600;}
  .jm-otb td:not([data-th])::before{display:none;}
  .jm-otb td[data-th="\uC0C1\uD488\uC815\uBCF4"]{display:block;padding-top:12px;}
  .jm-otb td[data-th="\uC0C1\uD488\uC815\uBCF4"]::before{display:block;margin-bottom:7px;}

  /* \uBAA8\uB2EC\xB7\uACB0\uC81C\uCC3D\uC744 \uD654\uBA74 \uC544\uB798\uC5D0\uC11C \uC62C\uB77C\uC624\uB294 \uC2DC\uD2B8\uB85C */
  .jm-veil,.jm-pwveil{align-items:flex-end;justify-content:stretch;padding:0;}
  .jm-md,.jm-pw{max-width:none;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;}
  .jm-md-acts{flex-direction:column-reverse;}

  .jm-crumb{justify-content:flex-start;margin-bottom:22px;}
  .jm-ttl h2{font-size:24px;}
  .jm-coll{height:180px;}
  .jm-ord-h{flex-wrap:wrap;}

  /* \uD569\uACC4 \u2014 \uC881\uC740 \uD3ED\uC5D0\uC11C\uB294 \uC124\uBA85\uACFC \uAE08\uC561\uC744 \uC704\uC544\uB798\uB85C */
  .jm-sum{flex-direction:column;align-items:flex-start;gap:6px;padding:16px 14px;}
  .jm-sum span{display:flex;flex-direction:column;gap:3px;}
  .jm-sum b{font-size:24px;align-self:flex-end;}
  /* \uACC4\uC18D \uC1FC\uD551\uD558\uAE30 / \uC8FC\uBB38\uD558\uAE30 \u2014 \uCD5C\uC18C\uD3ED 180px\uC774\uB77C \uB450 \uAC1C\uAC00 \uD55C \uC904\uC5D0 \uC548 \uB4E4\uC5B4\uAC11\uB2C8\uB2E4 */
  .jm-mid{flex-direction:column;gap:8px;margin-top:22px;}
  .jm-mid .jm-bt{min-width:0;width:100%;}

  /* \uC139\uC158 \uC81C\uBAA9\uACFC \uD0ED\uC744 \uD55C \uC904\uC5D0 \uB450\uBA74 \uD0ED\uC774 \uD3ED\uC744 \uB2E4 \uAC00\uC838\uAC00
     \uC81C\uBAA9\uC774 \uD55C \uAE00\uC790\uC529 \uC138\uB85C\uB85C \uCABC\uAC1C\uC9D1\uB2C8\uB2E4. \uC704\uC544\uB798\uB85C \uB098\uB215\uB2C8\uB2E4. */
  .jm-sect{flex-direction:column;align-items:stretch;gap:var(--s3);}
  .jm-sect h3{font-size:20px;letter-spacing:-.8px;}
  .jm-sect-l{align-items:center;}

  /* \uD0ED\uC774 \uD55C \uC904\uC5D0 \uB2E4 \uC548 \uB4E4\uC5B4\uAC00\uBA74 \uC606\uC73C\uB85C \uBC00\uC5B4 \uBCFC \uC218 \uC788\uAC8C \uD569\uB2C8\uB2E4.
     \uC2A4\uD06C\uB864\uBC14\uB294 \uC228\uAE30\uACE0, \uC798\uB9B0 \uB290\uB08C\uC774 \uB098\uB3C4\uB85D \uC624\uB978\uCABD \uC5EC\uBC31\uC744 \uB461\uB2C8\uB2E4. */
  .jm-ntabs{overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding-right:var(--pad);}
  .jm-ntabs::-webkit-scrollbar,
  .jm-gnb::-webkit-scrollbar{display:none;}
  .jm-gnb{scrollbar-width:none;}
  .jm-ntabs button{flex-shrink:0;}

  /* \uD478\uD130 '\uC811\uAE30'\uB294 \uB9C8\uC9C0\uB9C9 \uCE78 \uAE30\uC900\uC73C\uB85C \uB5A0 \uC788\uC5B4 \uC138\uB85C\uB85C \uC313\uC73C\uBA74 \uC790\uB9AC\uB97C \uC783\uC2B5\uB2C8\uB2E4 */
  .jm-ft-up{position:static;margin-top:14px;}
}


/* \u2500\u2500 \uD648 \uAC1C\uD3B8 \uD6C4 \uC881\uC740 \uD654\uBA74 \u2500\u2500 (CSS \uB9E8 \uB05D\uC5D0 \uB450\uC5B4 \uC55E\uC758 \uADDC\uCE59\uBCF4\uB2E4 \uC6B0\uC120) */
@media (max-width:860px){

}
@media (max-width:640px){
  /* \uBC14\uB85C \uCC3E\uAE30 \u2014 \uC904\uBC14\uAFC8 \uB300\uC2E0 \uC606\uC73C\uB85C \uBC00\uAE30. \uB450\uC138 \uC904\uB85C \uC313\uC774\uBA74 \uC774\uC815\uD45C\uAC00 \uC544\uB2C8\uB77C \uBCBD\uC774 \uB429\uB2C8\uB2E4 */
  .jm-quick-in{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-top:12px;padding-bottom:12px;}
  .jm-quick-in::-webkit-scrollbar{display:none;}
  .jm-quick-g{flex-wrap:nowrap;}
  .jm-quick-g button{padding:7px 12px;font-size:13px;}
  .jm-now-col{padding:var(--s3) var(--s3) var(--s4);}

  /* \uBCA0\uC2A4\uD2B8 \uBAA9\uB85D \u2014 \uC608\uC804\uC5D0\uB294 \uD55C \uC904\uC5D0 \uC21C\uC704\xB7\uD45C\uC9C0\xB7\uACE1\uBA85\xB7\uBCC0\uB3D9\xB7\uAC00\uACA9\xB7\uBC84\uD2BC\uC744 \uB2E4 \uB123\uC5B4
     \uACE1\uBA85 \uCE78\uC774 \uBA87 px\uB9CC \uB0A8\uC544 \uD55C \uAE00\uC790\uC529 \uC138\uB85C\uB85C \uCABC\uAC1C\uC84C\uC2B5\uB2C8\uB2E4(\uD734\uB300\uD3F0\uC5D0\uC11C \uBAA9\uB85D \uD558\uB098\uAC00 \uD654\uBA74 \uC138 \uC7A5).
     \uACE1\uBA85\uC744 \uC704 \uC904 \uC804\uCCB4\uC5D0, \uAC00\uACA9\uACFC \uAD6C\uB9E4 \uBC84\uD2BC\uC744 \uC544\uB798 \uC904\uB85C \uB0B4\uB9BD\uB2C8\uB2E4. */
  .jm-best li{display:grid;grid-template-columns:22px 46px minmax(0,1fr) auto;
    grid-template-areas:"r th tx tx" "m th p bt";column-gap:12px;row-gap:6px;
    align-items:center;padding:14px 4px;}
  .jm-best-r{grid-area:r;width:auto;font-size:17px;}
  .jm-best-th{grid-area:th;}
  .jm-best-tx{grid-area:tx;}
  .jm-best-m{grid-area:m;width:auto;font-size:11px;text-align:center;}
  .jm-best-p{grid-area:p;width:auto;text-align:left;font-size:14px;}
  .jm-best-acts{grid-area:bt;}
  .jm-best-ls,.jm-best-bt{padding:8px 13px;}
  .jm-best-tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jm-best-tx em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
}
